               </tbody></table></div>
             ${dbStats ? `<div class="field" style="margin-top:13px">
               <label>保存先</label>
               <div class="num" style="font-size:11.5px;word-break:break-all;color:var(--ink-2)">${esc(dbStats.path)}</div>
             </div>` : ''}
             <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:16px">
               <button class="btn" data-act="sample">サンプルデータを読み込む</button>
               <button class="btn danger" data-act="wipe" ${n ? '' : 'disabled'}>すべて削除</button>
             </div>
           </div>
         </div>

         <div class="panel">
           <div class="panel-head"><h2>バックアップ</h2></div>
           <div class="panel-body">
             <p style="font-size:13px;color:var(--ink-2);margin-bottom:11px">
               <b>スプレッドシートの複製</b>を、あなたのドライブに日付つきで作ります。元のシートはそのまま残ります。</p>
             <button class="btn primary" data-act="backup">スプレッドシートを複製する</button>
             ${dbStats ? `<div class="note" style="font-size:11.5px;color:var(--ink-3);margin-top:6px;word-break:break-all">保存先： ${esc(dbStats.backupDir)}</div>` : ''}

             <p style="font-size:13px;color:var(--ink-2);margin:18px 0 11px;padding-top:16px;border-top:1px solid var(--border)">
               <b>JSON で書き出す</b>と、他のツールでも読める形になります。</p>
             <div style="display:flex;gap:9px;flex-wrap:wrap">
               <button class="btn" data-act="export">JSON に書き出す</button>
               <button class="btn" data-act="copy">クリップボードにコピー</button>
             </div>
             <div class="field" style="margin-top:16px">
               <label for="impFile">JSON バックアップを読み込む</label>
               <input type="file" id="impFile" accept="application/json,.json">
               <span class="note">読み込むと、現在のデータはすべて置き換わります。</span>
             </div>
           </div>
         </div>
       </div>

       <div class="panel" style="margin-top:16px">
         <div class="panel-head"><h2>計算の前提</h2></div>
         <div class="panel-body">
           <ul style="margin:0;padding-left:20px;font-size:13px;color:var(--ink-2);line-height:1.85">
             <li>利息は<b>日割り</b>で計算します。<b>元金 × 年利 ÷ 365日 × 経過日数</b>。うるう年も 365 日として扱います。</li>
             <li>利息が付くのは<b>元金だけ</b>です。払いきれずに残った未払利息が、それ自身でさらに利息を生むことはありません。</li>
             <li>返済を記録すると、起算日から返済日までの利息を積んだうえで、返済額を<b>まず利息に、残りを元金に</b>充当します。この計算と残高の更新は<b>一つのトランザクション</b>で行うため、片方だけが反映されることはありません。</li>
             <li>実際の約定日・遅延損害金・借入先ごとの端数処理は考慮していません。</li>
             <li>シミュレーションは、毎月の返済額が一定で、新たな借入がないことを前提としています。</li>
             <li>50年（600ヶ月）以内に完済しない場合、または残高が減らない場合は「完済しません」と表示します。</li>
             <li>実際の契約条件は借入先の返済予定表が優先されます。ここでの数字は計画を立てるための目安として使ってください。</li>
           </ul>
         </div>
       </div>`;

    const f = document.getElementById('impFile');
    f.addEventListener('change', () => {
      const file = f.files && f.files[0];
      if (!file) return;
      const rd = new FileReader();
      rd.onload = async () => {
        let p = null;
        try {
          p = JSON.parse(rd.result);
          if (!p || !Array.isArray(p.debts)) throw new Error();
        } catch (e) {
          toast('読み込めませんでした。JSON ファイルを確認してください。');
          f.value = '';
          return;
        }
        simExtra = null;
        await commit('/import', 'POST', p, 'バックアップを読み込みました');
        const f2 = document.getElementById('impFile');
        if (f2) f2.value = '';
      };
      rd.readAsText(file);
    });
  };

  /* ==========================================================
     7. ダイアログ（フォーム）
     ========================================================== */
  const dlg = document.getElementById('dlg');
  const dlgForm = document.getElementById('dlgForm');
  let onSubmit = null;

  function openDialog({ title, lede, body, ok, onOk, onOpen }) {
    document.getElementById('dlgTitle').textContent = title;
    document.getElementById('dlgLede').textContent = lede || '';
    document.getElementById('dlgBody').innerHTML = body;
    // フッターは使い回しなので、前のダイアログが足したボタンを必ず取り除く
    document.querySelectorAll('.dlg-foot [data-injected]').forEach(el => el.remove());
    document.getElementById('dlgOk').textContent = ok || '保存';
    onSubmit = onOk;
    dlg.showModal();
    if (onOpen) onOpen();
    const first = dlg.querySelector('input,select,textarea');
    if (first) first.focus();
  }

  document.getElementById('dlgCancel').addEventListener('click', () => dlg.close('cancel'));

  dlgForm.addEventListener('submit', ev => {
    const v = ev.submitter ? ev.submitter.value : 'ok';
    if (v !== 'ok') return;
    if (onSubmit) {
      const res = onSubmit(new FormData(dlgForm));
      if (res === false) { ev.preventDefault(); return; }
    }
  });
  // ここで onSubmit を消してはいけない。close は非同期に発火するので、
  // 「閉じてすぐ次を開く」と、遅れて届いた close が次の画面の処理を消してしまう。
  // 実際それで保存が黙って失われていた。開くたびに上書きするので後始末は不要。

  const numOf = (fd, k) => {
    const v = parseFloat(String(fd.get(k) || '').replace(/[^\d.\-]/g, ''));
    return isFinite(v) ? v : 0;
  };

  function debtForm(d) {
    return `<div class="form-grid">
      <div class="field full"><label for="f-name">借入先の名前</label>
        <input type="text" id="f-name" name="name" required maxlength="40" placeholder="例：〇〇カードローン" value="${d ? esc(d.name) : ''}"></div>
      <div class="field"><label for="f-prin">元金（円）</label>
        <input type="number" id="f-prin" name="principal" required min="0" step="1" value="${d ? Math.round(d.principal) : ''}">
        <span class="note">利息が付く対象</span></div>
      <div class="field"><label for="f-int">未払いの利息（円）</label>
        <input type="number" id="f-int" name="interestAccrued" min="0" step="1" value="${d ? Math.round(d.interestToday) : 0}">
        <span class="note">無ければ 0</span></div>
      <div class="field full"><label for="f-acc">利息計算の起算日</label>
        <input type="date" id="f-acc" name="accruedAt" required value="${todayISO()}">
        <span class="note">翌日から日割りで利息が付きます</span></div>
      <div class="field"><label for="f-rate">年利（%）</label>
        <input type="number" id="f-rate" name="rate" required min="0" max="100" step="0.01" value="${d ? d.rate : ''}"></div>
      <div class="field"><label for="f-init">当初の借入額（円）</label>
        <input type="number" id="f-init" name="initial" min="0" step="1" value="${d ? Math.round(d.initial || d.balance) : ''}">
        <span class="note">進捗率に使用</span></div>
      <div class="field"><label for="f-min">毎月の最低返済額（円）</label>
        <input type="number" id="f-min" name="minPayment" required min="0" step="1" value="${d ? Math.round(d.minPayment) : ''}"></div>
      <div class="full"><div class="calc-note" id="f-calc"></div></div>
    </div>`;
  }

  /** 元金・未払利息・年利の入力から、合計残高とこれから付く利息を出しておく。 */
  function debtFormPreview() {
    const get = id => Math.max(0, +document.getElementById(id).value || 0);
    const calc = document.getElementById('f-calc');
    const upd = () => {
      const prin = get('f-prin'), int = get('f-int'), rate = get('f-rate');
      const day = interestFor(prin, rate, 1);
      const mon = monthlyInterest({ principal: prin, rate });
      calc.innerHTML =
        `<div>合計残高 <b>${yen(prin + int)}</b>（元金 ${yen(prin)} ＋ 未払利息 ${yen(int)}）</div>
         <div>利息 <b>${yen(day)}</b>／日・<b>${yen(mon)}</b>／月
           <span style="color:var(--ink-3)">（元金 × ${rate}% ÷ ${DAY_BASIS}日）</span></div>`;
    };
    ['f-prin', 'f-int', 'f-rate'].forEach(id =>
      document.getElementById(id).addEventListener('input', upd));
    upd();
  }

  const debtPayload = fd => ({
    name: String(fd.get('name') || '').trim(),
    principal: numOf(fd, 'principal'),
    interestAccrued: numOf(fd, 'interestAccrued'),
    accruedAt: String(fd.get('accruedAt') || todayISO()),
    initial: numOf(fd, 'initial'),
    rate: numOf(fd, 'rate'),
    minPayment: numOf(fd, 'minPayment')
  });

  function addDebt() {
    openDialog({
      title: '借入を追加',
      lede: '返済予定表の数字を入れてください。以降の利息は日割りで自動計算されます。',
      body: debtForm(null),
      onOpen: debtFormPreview,
      onOk: fd => {
        const p = debtPayload(fd);
        if (!p.name) return false;
        simExtra = null;
        commit('/debts', 'POST', p, '借入を登録しました');
      }
    });
  }

  function editDebt(id) {
    const d = state.debts.find(x => x.id === id);
    if (!d) return;
    openDialog({
      title: '借入を編集',
      lede: d.name + '　未払利息と起算日は今日時点にそろえてあります',
      body: debtForm(d),
      onOpen: debtFormPreview,
      onOk: fd => {
        const p = debtPayload(fd);
        if (!p.name) return false;
        simExtra = null;
        commit('/debts/' + d.id, 'PUT', p, '借入を更新しました');
      }
    });
  }

  function payDialog(id) {
    const d = state.debts.find(x => x.id === id);
    if (!d) return;
    openDialog({
      title: '返済を記録',
      lede: `${d.name}（元金 ${yen(d.principal)} ＋ 未払利息 ${yen(d.interestToday)} ＝ ${yen(d.balance)}）`,
      ok: '記録する',
      body: `<div class="form-grid">
        <div class="field"><label for="p-date">返済日</label>
          <input type="date" id="p-date" name="date" required value="${todayISO()}"></div>
        <div class="field"><label for="p-amt">返済額（円）</label>
          <input type="number" id="p-amt" name="amount" required min="1" step="1" value="${Math.round(d.minPayment)}"></div>
        <div class="field full"><label for="p-memo">メモ</label>
          <input type="text" id="p-memo" name="memo" maxlength="60" placeholder="任意"></div>
        <div class="full"><div class="calc-note" id="p-calc"></div></div>
      </div>`,
      onOpen: () => {
        const amtEl = document.getElementById('p-amt');
        const dateEl = document.getElementById('p-date');
        const calc = document.getElementById('p-calc');
        const upd = () => {
          // サーバーと同じ順序で試算する：日割りで利息を積む → 利息へ充当 → 残りを元金へ。
          const picked = dateEl.value || todayISO();
          if (d.originDate && picked < d.originDate) {
            calc.innerHTML =
              `<div style="color:var(--warn-text,var(--ink))"><b>${esc(d.originDate)} より前の日付です。</b></div>
               <div>記録は残りますが、<b>残高の計算には入りません</b>。この借入は
                 ${esc(d.originDate)} 時点の残高として登録されていて、
                 それより前の返済はその残高に既に含まれているためです。</div>
               <div style="color:var(--ink-3);margin-top:4px">残高にも反映したいときは、借入を編集して
                 起算日と元金を、その時点の値に直してください。</div>`;
            return;
          }
          const days = daysApart(new Date(d.accruedAt + 'T00:00:00'),
                                 new Date(picked + 'T00:00:00'));
          const int = d.interestAccrued + interestFor(d.principal, d.rate, days);
          const a = Math.max(0, +amtEl.value || 0);
          const toInterest = Math.min(a, int);
          const toPrincipal = Math.min(a - toInterest, d.principal);
          const over = a - toInterest - toPrincipal;
          calc.innerHTML =
            `<div>${esc(d.accruedAt)} から <b>${days}日</b>分の利息 <b>${yen(interestFor(d.principal, d.rate, days))}</b>
                  <span style="color:var(--ink-3)">（元金 ${yen0(d.principal)} × ${d.rate}% ÷ ${DAY_BASIS}日 × ${days}日）</span></div>
             <div>未払利息の合計 <b>${yen(int)}</b></div>
             <div style="margin-top:4px">うち利息への充当 <b>${yen(toInterest)}</b></div>
             <div>うち元金への充当 <b>${yen(toPrincipal)}</b></div>
             <div>返済後の残高 <b>${yen(d.principal - toPrincipal + int - toInterest)}</b></div>
             ${a > 0 && a <= int
               ? `<div style="color:var(--crit-text);margin-top:4px">返済額が利息以下のため、元金は1円も減りません。</div>` : ''}
             ${over > 0.5
               ? `<div style="color:var(--ink-3);margin-top:4px">完済に必要なのは ${yen(int + d.principal)} です。超過分 ${yen(over)} は充当されません。</div>` : ''}`;
        };
        amtEl.addEventListener('input', upd);
        dateEl.addEventListener('change', upd);
        upd();
      },
      onOk: fd => {
        const amount = numOf(fd, 'amount');
        if (amount <= 0) return false;
        // 利息と元金の内訳はサーバー側で返済日までの日割り利息から計算し、
        // 残高の更新と同じトランザクションに入れる。
        commit('/repayments', 'POST', {
          debtId: d.id,
          date: String(fd.get('date') || todayISO()),
          amount,
          memo: String(fd.get('memo') || '').trim()
        }, '返済を記録しました');
      }
    });
  }

  function borrowDialog(id) {
    const d = state.debts.find(x => x.id === id);
    if (!d) return;
    openDialog({
      title: '追加で借りた', ok: '記録する',
      lede: `${d.name}（元金 ${yen(d.principal)}）　カードローンなどで、返済しながらまた借りたとき`,
      body: `<div class="form-grid">
        <div class="field"><label for="w-date">借りた日</label>
          <input type="date" id="w-date" name="date" required value="${todayISO()}"></div>
        <div class="field"><label for="w-amt">借りた金額（円）</label>
          <input type="number" id="w-amt" name="amount" required min="1" step="1" placeholder="0"></div>
        <div class="field full"><label for="w-memo">メモ</label>
          <input type="text" id="w-memo" name="memo" maxlength="60" placeholder="任意"></div>
        <div class="full"><div class="calc-note" id="w-calc"></div></div>
      </div>`,
      onOpen: () => {
        const amtEl = document.getElementById('w-amt');
        const calc = document.getElementById('w-calc');
        const upd = () => {
          const a = Math.max(0, +amtEl.value || 0);
          calc.innerHTML =
            `<div>借入後の元金 <b>${yen(d.principal + a)}</b></div>
             <div>利息 <b>${yen(interestFor(d.principal + a, d.rate, 1))}</b>／日
               <span style="color:var(--ink-3)">（いまは ${yen(interestFor(d.principal, d.rate, 1))}／日）</span></div>
             <div style="color:var(--ink-3);margin-top:4px">当初の借入額にも足され、返済済みの割合はその分下がります。</div>`;
        };
        amtEl.addEventListener('input', upd);
        upd();
      },
      onOk: fd => {
        const amount = numOf(fd, 'amount');
        if (amount <= 0) return false;
        simExtra = null;
        commit('/borrows', 'POST', {
          debtId: d.id,
          date: String(fd.get('date') || todayISO()),
          amount,
          memo: String(fd.get('memo') || '').trim()
        }, '追加借入を記録しました');
      }
    });
  }

  /**
   * 支払い方法の選択値をほどく。'' なら現金・口座、'card:<id>' ならカード払い。
   * カードは翌月引落なので、そのまま何ヶ月ずらすかも一緒に返す。
   */
  function payVia(v) {
    if (!String(v || '').startsWith('card:')) return { offset: 0, cardId: '' };
    return { offset: 1, cardId: String(v).slice(5) };
  }

  function txnDialog(type) {
    const cats = type === 'income' ? INCOME_CATS : EXPENSE_CATS;
    const label = type === 'income' ? '収入' : '支出';
    openDialog({
      title: label + 'を追加',
      lede: type === 'income' ? '手取り額（実際に受け取った金額）を入力してください。' : '借入の返済は「借入・返済」画面で記録します。',
      ok: '追加',
      body: `<div class="form-grid">
        <div class="field"><label for="t-date">日付</label>
          <input type="date" id="t-date" name="date" required value="${todayISO()}"></div>
        <div class="field"><label for="t-amt">金額（円）</label>
          <input type="number" id="t-amt" name="amount" required min="1" step="1" placeholder="0"></div>
        <div class="field"><label for="t-cat">カテゴリ</label>
          <select id="t-cat" name="category">${cats.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
        <div class="field"><label for="t-memo">メモ</label>
          <input type="text" id="t-memo" name="memo" maxlength="60" placeholder="任意"></div>
        ${type === 'expense' ? `
        <div class="field full"><label for="t-pay">支払い方法</label>
          <select id="t-pay" name="payVia">
            <option value="">現金・口座引落・デビット（今月）</option>
            ${rows('cards').length
              ? `<optgroup label="カード（翌月引落）">
                   ${rows('cards').map(c => `<option value="card:${esc(c.id)}">${esc(c.name)}</option>`).join('')}
                   <option value="card:">その他のカード</option>
                 </optgroup>`
              : `<option value="card:">クレジットカード（翌月引落）</option>`}
          </select>
          <span class="note" id="t-paynote"></span></div>` : ''}
      </div>`,
      onOpen: type === 'expense' ? () => {
        const dateEl = document.getElementById('t-date');
        const payEl = document.getElementById('t-pay');
        const note = document.getElementById('t-paynote');
        const upd = () => {
          const via = payVia(payEl.value);
          const m = addMonthKey(monthKey(dateEl.value || todayISO()), via.offset);
          // 請求額を登録しているカードなら、この明細は内訳であって二重に数えない
          const billed = via.cardId &&
            rows('cardBills').some(b => b.cardId === via.cardId && b.payMonth === m);
          note.textContent = m.replace('-', '年') + '月に口座から出ていきます' +
            (billed ? '。請求額を登録済みなので内訳として扱います' : '');
        };
        dateEl.addEventListener('change', upd);
        payEl.addEventListener('change', upd);
        upd();
      } : undefined,
      onOk: fd => {
        const amount = numOf(fd, 'amount');
        if (amount <= 0) return false;
        const date = String(fd.get('date') || todayISO());
        cashMonth = monthKey(date);
        const via = payVia(String(fd.get('payVia') || ''));
        commit('/txns', 'POST', {
          type, date, amount,
          category: String(fd.get('category') || 'その他'),
          memo: String(fd.get('memo') || '').trim(),
          payMonth: addMonthKey(monthKey(date), via.offset),
          cardId: via.cardId
        }, label + 'を追加しました');
      }
    });
  }

  function cardDialog(id) {
    const c = id ? state.cards.find(x => x.id === id) : null;
    openDialog({
      title: c ? 'カードを編集' : 'カードを追加',
      lede: c ? '' : '請求額を月ごとに登録できるようになります。',
      body: `<div class="form-grid">
        <div class="field full"><label for="c-name">カードの名前</label>
          <input type="text" id="c-name" name="name" required maxlength="40"
                 placeholder="例：楽天カード" value="${c ? esc(c.name) : ''}"></div>
      </div>`,
      onOpen: c ? () => {
        // 編集のときだけ削除も出す。カードを消しても明細は残り、現金・口座払いに戻る。
        const foot = document.querySelector('.dlg-foot');
        if (!foot) return;
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'btn danger'; b.textContent = 'このカードを削除';
        b.dataset.injected = '1';
        b.addEventListener('click', () => {
          dlg.close('cancel');
          confirmDialog('カードを削除',
            `「${c.name}」と、登録した請求額をすべて削除します。` +
            'このカードで払った記録は残り、現金・口座払いとして数えられます。',
            () => commit('/cards/' + c.id, 'DELETE', undefined, 'カードを削除しました'));
        });
        foot.insertBefore(b, foot.firstChild);
      } : undefined,
      onOk: fd => {
        const name = String(fd.get('name') || '').trim();
        if (!name) return false;
        if (c) commit('/cards/' + c.id, 'PUT', { name }, 'カードを更新しました');
        else commit('/cards', 'POST', { name }, 'カードを追加しました');
      }
    });
  }

  function cardBillDialog(cardId) {
    const c = state.cards.find(x => x.id === cardId);
    if (!c) return;
    const cur = state.cardBills.find(b => b.cardId === cardId && b.payMonth === cashMonth);
    const est = (monthSummary(cashMonth).out.rows.find(r => r.id === cardId) || {}).detail || 0;
    openDialog({
      title: '請求額を登録', lede: `${c.name}　${cashMonth.replace('-', '年')}月の引落`,
      body: `<div class="form-grid">
        <div class="field"><label for="b-month">引落月</label>
          <input type="month" id="b-month" name="payMonth" required value="${esc(cashMonth)}"></div>
        <div class="field"><label for="b-amt">請求額（円）</label>
          <input type="number" id="b-amt" name="amount" required min="0" step="1"
                 value="${cur ? Math.round(cur.amount) : ''}"></div>
        <div class="field full"><label for="b-memo">メモ</label>
          <input type="text" id="b-memo" name="memo" maxlength="60" placeholder="任意"
                 value="${cur ? esc(cur.memo) : ''}"></div>
        <div class="full"><div class="calc-note">
          <div>入力済みの明細の合計は <b>${yen(est)}</b> です。</div>
          <div style="color:var(--ink-3);margin-top:4px">請求額を登録すると、その月はこの額が引落として使われます（明細は内訳扱いになり、二重には数えません）。</div>
        </div></div>
      </div>`,
      onOk: fd => {
        const amount = numOf(fd, 'amount');
        if (amount < 0) return false;
        commit('/cardbills', 'POST', {
          cardId, payMonth: String(fd.get('payMonth') || cashMonth),
          amount, memo: String(fd.get('memo') || '').trim()
        }, '請求額を登録しました');
      }
    });
  }

  function goalsDialog() {
    const g = state.goals;
    openDialog({
      title: '目標を編集', lede: '未入力の項目は「未設定」として扱われます。',
      body: `<div class="form-grid">
        <div class="field"><label for="g-date">完済の目標日</label>
          <input type="date" id="g-date" name="targetDate" value="${esc(g.targetDate || '')}"></div>
        <div class="field"><label for="g-rep">月々の返済目標（円）</label>
          <input type="number" id="g-rep" name="monthlyRepay" min="0" step="1000" value="${g.monthlyRepay || ''}">
          <span class="note">最低返済額の合計は ${yen(totalMinPayment())}</span></div>
        <div class="field"><label for="g-ef">生活防衛資金の目標（円）</label>
          <input type="number" id="g-ef" name="emergency" min="0" step="10000" value="${g.emergency || ''}"></div>
        <div class="field"><label for="g-efc">生活防衛資金の現在額（円）</label>
          <input type="number" id="g-efc" name="emergencyCurrent" min="0" step="1000" value="${g.emergencyCurrent || ''}"></div>
      </div>`,
      onOk: fd => {
        simExtra = null;
        commit('/goals', 'PUT', {
          targetDate: String(fd.get('targetDate') || ''),
          monthlyRepay: numOf(fd, 'monthlyRepay'),
          emergency: numOf(fd, 'emergency'),
          emergencyCurrent: numOf(fd, 'emergencyCurrent')
        }, '目標を更新しました');
      }
    });
  }

  function confirmDialog(title, lede, onYes, okLabel) {
    openDialog({
      title, lede, ok: okLabel || '削除する',
      body: '<p style="font-size:13px;color:var(--ink-2)">この操作は元に戻せません。</p>',
      onOk: () => { onYes(); }
    });
    const ok = document.getElementById('dlgOk');
    ok.classList.remove('primary'); ok.classList.add('danger');
    dlg.addEventListener('close', function restore() {
      ok.classList.add('primary'); ok.classList.remove('danger');
      dlg.removeEventListener('close', restore);
    });
  }

  /* ==========================================================
     8. データの書き出し・サンプル
     ========================================================== */
  function exportData() {
    // サーバーが Content-Disposition を付けて返すので、ブラウザがそのまま保存する
    location.href = '/api/export';
  }

  /** Drive の files.copy でスプレッドシートごと複製する */
  async function makeBackup() {
    try {
      const r = await api('/backup', 'POST');
      try { dbStats = await api('/stats'); } catch (e) {}
      render();
      toast('バックアップを作成しました（' + Math.max(1, Math.round(r.size / 1024)) + ' KB）');
    } catch (e) {
      toast(e.message);
    }
  }

  async function copyData() {
    const json = JSON.stringify(state, null, 2);
    try {
      await navigator.clipboard.writeText(json);
      toast('クリップボードにコピーしました');
    } catch (e) {
      openDialog({
        title: 'バックアップ', lede: '下のテキストをすべて選択してコピーし、ファイルとして保存してください。',
        ok: '閉じる',
        body: `<textarea readonly style="min-height:200px" id="bkText">${esc(json)}</textarea>`,
        onOpen: () => { const t = document.getElementById('bkText'); t.focus(); t.select(); },
        onOk: () => {}
      });
    }
  }

  /* ==========================================================
     9. イベント配線と初期化
     ========================================================== */
  document.addEventListener('click', ev => {
    const nav = ev.target.closest('.nav-item');
    if (nav) {
      currentView = nav.dataset.view;
      document.querySelectorAll('.nav-item').forEach(b =>
        b.setAttribute('aria-current', b === nav ? 'page' : 'false'));
      document.querySelectorAll('.view').forEach(v =>
        v.classList.toggle('is-active', v.dataset.view === currentView));
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
      return;
    }

    const btn = ev.target.closest('[data-act]');
    if (!btn) return;
    const id = btn.dataset.id;

    switch (btn.dataset.act) {
      case 'add-debt':   addDebt(); break;
      case 'edit-debt':  editDebt(id); break;
      case 'pay':        payDialog(id); break;
      case 'add-income': txnDialog('income'); break;
      case 'add-expense':txnDialog('expense'); break;
      case 'add-card':   cardDialog(null); break;
      case 'edit-card':  cardDialog(id); break;
      case 'card-bill':  cardBillDialog(id); break;
      case 'borrow':     borrowDialog(id); break;
      case 'edit-goals': goalsDialog(); break;
      case 'export':     exportData(); break;
      case 'copy':       copyData(); break;
      case 'backup':     makeBackup(); break;
      case 'sample':
        simExtra = null; cashMonth = thisMonth();
        commit('/sample', 'POST', undefined, 'サンプルデータを読み込みました');
        break;

      case 'del-debt': {
        const d = state.debts.find(x => x.id === id);
        if (!d) break;
        confirmDialog('借入を削除', `「${d.name}」と、この借入に紐づく返済の記録をすべて削除します。`, () => {
          simExtra = null;
          commit('/debts/' + id, 'DELETE', undefined, '借入を削除しました');
        });
        break;
      }
      case 'del-borrow': {
        const b = state.borrows.find(x => x.id === id);
        if (!b) break;
        confirmDialog('追加借入を取り消す',
          `${b.date} の ${yen(b.amount)} の借入を取り消し、残高と当初借入額を元に戻します。`,
          () => { simExtra = null; commit('/borrows/' + id, 'DELETE', undefined, '追加借入を取り消しました'); });
        break;
      }
      case 'del-rep': {
        const r = state.repayments.find(x => x.id === id);
        if (!r) break;
        confirmDialog('返済の記録を取り消す',
          `${r.date} の ${yen(r.amount)} を取り消し、元金充当分 ${yen(r.principal)} を残高に戻します。`,
          () => commit('/repayments/' + id, 'DELETE', undefined, '返済の記録を取り消しました'),
          '取り消す');
        break;
      }
      case 'del-txn':
        commit('/txns/' + id, 'DELETE', undefined, '削除しました');
        break;

      case 'wipe':
        confirmDialog('すべて削除', '借入・収支・返済の記録と目標を、すべて消去します。', () => {
          simExtra = null; cashMonth = thisMonth();
          commit('/wipe', 'POST', undefined, 'すべて削除しました');
        });
        break;
    }
  });

  boot();
})();
</script>
</body>
</html>
