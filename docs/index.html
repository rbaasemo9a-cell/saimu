<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>返済ロードマップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ============================================================
   TOKENS — light is the bare :root; dark redefined in both scopes
   ============================================================ */
:root {
  color-scheme: light;
  --bg:          #eef0f4;
  --surface:     #fafbfc;
  --surface-2:   #f2f4f7;
  --surface-3:   #e8ebf1;
  --border:      #dde1e8;
  --border-2:    #c6cdda;
  --ink:         #131720;
  --ink-2:       #545d6b;
  --ink-3:       #838d9c;
  --accent:      #2b4a8f;
  --accent-2:    #3f63b4;
  --accent-ink:  #ffffff;
  --accent-soft: #e3e9f6;
  --good:        #0ca30c;
  --good-text:   #006300;
  --good-soft:   #e2f3e2;
  --warn:        #fab219;
  --warn-text:   #855400;
  --warn-soft:   #fdf1d9;
  --crit:        #d03b3b;
  --crit-text:   #a72a2a;
  --crit-soft:   #fae5e5;
  --grid:        #e3e6ec;
  --axis:        #c6cdda;
  --shadow:      0 1px 2px rgba(19,23,32,.05), 0 8px 24px -14px rgba(19,23,32,.22);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;

  --sans: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
  --disp: "Zen Kaku Gothic New", "IBM Plex Sans JP", "Hiragino Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:          #0d1016;
    --surface:     #171b23;
    --surface-2:   #1e232d;
    --surface-3:   #262c38;
    --border:      #2a3140;
    --border-2:    #3a4354;
    --ink:         #eef1f6;
    --ink-2:       #a4aebd;
    --ink-3:       #7b8696;
    --accent:      #7b9bea;
    --accent-2:    #99b4f4;
    --accent-ink:  #0d1016;
    --accent-soft: #1d2740;
    --good:        #0ca30c;
    --good-text:   #3fc93f;
    --good-soft:   #143014;
    --warn:        #fab219;
    --warn-text:   #f5bb44;
    --warn-soft:   #33280d;
    --crit:        #d03b3b;
    --crit-text:   #ef7c7c;
    --crit-soft:   #331717;
    --grid:        #242a35;
    --axis:        #333c4b;
    --shadow:      0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.8);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:          #0d1016;
  --surface:     #171b23;
  --surface-2:   #1e232d;
  --surface-3:   #262c38;
  --border:      #2a3140;
  --border-2:    #3a4354;
  --ink:         #eef1f6;
  --ink-2:       #a4aebd;
  --ink-3:       #7b8696;
  --accent:      #7b9bea;
  --accent-2:    #99b4f4;
  --accent-ink:  #0d1016;
  --accent-soft: #1d2740;
  --good:        #0ca30c;
  --good-text:   #3fc93f;
  --good-soft:   #143014;
  --warn:        #fab219;
  --warn-text:   #f5bb44;
  --warn-soft:   #33280d;
  --crit:        #d03b3b;
  --crit-text:   #ef7c7c;
  --crit-soft:   #331717;
  --grid:        #242a35;
  --axis:        #333c4b;
  --shadow:      0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.8);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
}

/* ============================================================
   BASE
   ============================================================ */
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { font-family: var(--disp); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.3; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ============================================================
   SHELL
   ============================================================ */
.app { display: grid; grid-template-columns: 232px minmax(0,1fr); min-height: 100vh; }

.rail {
  border-right: 1px solid var(--border);
  background: var(--surface);
  padding: 22px 14px;
  display: flex; flex-direction: column; gap: 26px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.brand-mark {
  font-family: var(--disp); font-weight: 900; font-size: 17px;
  letter-spacing: .01em; color: var(--ink);
}
.brand-sub { font-size: 11px; color: var(--ink-3); letter-spacing: .09em; text-transform: uppercase; }

.rail-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 10px; border-radius: var(--r);
  background: none; border: 0; cursor: pointer;
  color: var(--ink-2); font-size: 13.5px; font-weight: 500;
  text-align: left; width: 100%; transition: background .13s, color .13s;
}
.nav-item svg { width: 17px; height: 17px; flex: none; stroke-width: 1.7; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 8px; }
.saved-note { font-size: 11px; color: var(--ink-3); line-height: 1.5; }

.main { padding: 34px 40px 72px; max-width: 1240px; }
.view { display: none; }
.view.is-active { display: block; }

.view-head { margin-bottom: 24px; }
.view-head h1 { font-size: 25px; font-weight: 900; letter-spacing: -.01em; }
.view-head .lede { color: var(--ink-2); font-size: 13.5px; margin-top: 4px; max-width: 62ch; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail {
    position: static; height: auto; flex-direction: row; align-items: center;
    border-right: 0; border-bottom: 1px solid var(--border);
    padding: 12px 16px; gap: 16px; overflow-x: auto;
  }
  .brand { flex: none; }
  .brand-sub { display: none; }
  .rail-nav { flex-direction: row; gap: 4px; }
  .nav-item { padding: 7px 11px; white-space: nowrap; }
  .nav-item span { display: none; }
  .nav-item[aria-current="page"] span { display: inline; }
  .rail-foot { display: none; }
  .main { padding: 22px 18px 64px; }
}

/* ============================================================
   PANELS / CARDS
   ============================================================ */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
}
.panel-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 14px; padding: 16px 18px 0;
}
.panel-head h2 { font-size: 14.5px; font-weight: 700; }
.panel-head .hint { font-size: 12px; color: var(--ink-3); }
.panel-body { padding: 14px 18px 18px; }

.grid { display: grid; gap: 16px; }
.g-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
@media (max-width: 1080px) { .g-4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 820px)  { .g-2, .g-3 { grid-template-columns: 1fr; } .g-4 { grid-template-columns: repeat(2,minmax(0,1fr)); } }

/* ---- roadmap band (the dashboard hero) ---- */
.roadmap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  display: grid; grid-template-columns: 320px minmax(0,1fr);
  overflow: hidden; box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.roadmap-figure {
  padding: 22px 24px; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; justify-content: center; gap: 3px;
}
.roadmap-label {
  font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 600;
}
.hero-figure {
  font-family: var(--sans); font-weight: 600; font-size: 40px;
  line-height: 1.12; letter-spacing: -.02em; color: var(--ink);
}
.hero-figure.is-muted { font-size: 27px; color: var(--ink-2); }
.roadmap-sub { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.roadmap-chart { position: relative; min-height: 190px; display: flex; align-items: flex-end; }
.roadmap-chart > svg { width: 100%; }
@media (max-width: 820px) {
  .roadmap { grid-template-columns: 1fr; }
  .roadmap-figure { border-right: 0; border-bottom: 1px solid var(--border); }
}

/* ---- stat tiles ---- */
.tile {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 14px 16px;
  display: flex; flex-direction: column; gap: 2px;
}
.tile-label { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }
.tile-value { font-family: var(--sans); font-weight: 600; font-size: 22px; letter-spacing: -.01em; line-height: 1.25; }
.tile-value.neg { color: var(--crit-text); }
.tile-value.pos { color: var(--good-text); }
.tile-delta { font-size: 11.5px; color: var(--ink-2); }

/* ---- meter ---- */
.meter { height: 7px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.meter.is-good > i { background: var(--good); }
.meter.is-warn > i { background: var(--warn); }
.meter.is-crit > i { background: var(--crit); }

/* ---- pills ---- */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600; padding: 2px 8px;
  border-radius: 20px; border: 1px solid transparent; white-space: nowrap;
}
.pill svg { width: 12px; height: 12px; flex: none; }
.pill.ok   { background: var(--good-soft); color: var(--good-text); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
.pill.warn { background: var(--warn-soft); color: var(--warn-text); border-color: color-mix(in srgb, var(--warn) 34%, transparent); }
.pill.crit { background: var(--crit-soft); color: var(--crit-text); border-color: color-mix(in srgb, var(--crit) 34%, transparent); }
.pill.flat { background: var(--surface-2); color: var(--ink-2); border-color: var(--border); }

/* ============================================================
   CONTROLS
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  padding: 8px 14px; border-radius: var(--r);
  border: 1px solid var(--border-2); background: var(--surface);
  color: var(--ink); font-size: 13px; font-weight: 500; cursor: pointer;
  transition: background .13s, border-color .13s;
}
.btn svg { width: 15px; height: 15px; flex: none; stroke-width: 1.8; }
.btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.danger { color: var(--crit-text); border-color: color-mix(in srgb, var(--crit) 40%, transparent); }
.btn.danger:hover { background: var(--crit-soft); }
.btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field > label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field .note { font-size: 11.5px; color: var(--ink-3); }
input[type="text"], input[type="number"], input[type="date"], input[type="month"], select, textarea {
  font: inherit; width: 100%;
  padding: 8px 10px; border-radius: 5px;
  border: 1px solid var(--border-2); background: var(--surface);
  color: var(--ink);
}
input[type="number"] { font-family: var(--mono); font-variant-numeric: tabular-nums; }
textarea { resize: vertical; min-height: 62px; font-family: var(--mono); font-size: 12px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 13px; }
.form-grid .full { grid-column: 1 / -1; }
/* 狭い画面でも2列のままにする。1列にすると縦に伸びて小さい端末で収まらない。
   横に置けない項目だけ .full を付けて全幅にする。 */
@media (max-width: 620px) { .form-grid { gap: 10px 9px; } }

/* ============================================================
   MOBILE — 普段使いはスマホ。親指の届く下部タブと、詰まらない余白。
   ============================================================ */
@media (max-width: 700px) {
  /* 内容が列を押し広げないようにする。横スクロールの元凶を断つ。 */
  .app { grid-template-columns: minmax(0, 1fr); }
  .main { padding: 16px 14px calc(78px + env(safe-area-inset-bottom)); }
  .main, .view, .panel, .debt-card, .tile { min-width: 0; }

  /* --- ナビを下部タブへ --- */
  .rail {
    position: fixed; inset: auto 0 0 0; z-index: 30;
    flex-direction: column; gap: 0; height: auto; overflow: visible;
    padding: 0 0 env(safe-area-inset-bottom);
    border-bottom: 0; border-top: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: saturate(1.6) blur(12px);
  }
  .brand { display: none; }
  .rail-foot { display: none; }
  .rail-nav {
    flex-direction: row; gap: 0;
    justify-content: space-around; align-items: stretch; width: 100%;
  }
  .nav-item {
    flex: 1 1 0; min-width: 0;
    flex-direction: column; gap: 3px;
    padding: 8px 2px 7px; border-radius: 0;
    font-size: 10px; line-height: 1.2; text-align: center;
    justify-content: center;
  }
  .nav-item svg { width: 21px; height: 21px; }
  /* 下部タブでは全項目の名前を出す。現在地だけ見えても迷う。 */
  /* 元の名前は長すぎて省略されるので、タブ用の短い名前に差し替える */
  .nav-item span { display: inline !important; font-size: 0; white-space: nowrap; }
  .nav-item span::after { font-size: 10.5px; letter-spacing: .01em; }
  .nav-item[data-view="dash"]  span::after { content: "ホーム"; }
  .nav-item[data-view="debts"] span::after { content: "借入"; }
  .nav-item[data-view="cash"]  span::after { content: "収支"; }
  .nav-item[data-view="goals"] span::after { content: "目標"; }
  .nav-item[data-view="sim"]   span::after { content: "試算"; }
  .nav-item[data-view="data"]  span::after { content: "データ"; }
  .nav-item[aria-current="page"] { background: none; color: var(--accent); font-weight: 700; }
  .nav-item[aria-current="page"] svg { stroke-width: 2.2; }

  /* --- 見出しと余白を締める --- */
  .view-head { margin-bottom: 16px; }
  .view-head h1 { font-size: 21px; }
  .view-head .lede { font-size: 12.5px; }
  .grid { gap: 12px; }
  .panel-head { padding: 14px 14px 0; }
  .panel-body { padding: 12px 14px 14px; }

  /* --- 数字は詰めて2列に収める --- */
  .g-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .tile { padding: 12px 12px; }
  .tile-value { font-size: 19px; }
  .tile-delta, .tile-label { overflow-wrap: anywhere; }

  /* --- ダッシュボードの主役 --- */
  .hero-figure { font-size: 31px; }
  .hero-figure.is-muted { font-size: 21px; }
  .roadmap-figure { padding: 16px 16px; }
  .roadmap-chart { min-height: 150px; }

  /* --- 借入カード --- */
  .debt-card { padding: 14px; }
  .debt-top { flex-wrap: wrap; gap: 8px; }
  .debt-bal { font-size: 24px; }
  .debt-meta { gap: 4px 12px; font-size: 11.5px; }
  .debt-actions { gap: 8px; }
  .debt-actions .btn { flex: 1 1 auto; justify-content: center; }

  /* --- 表は文字単位で折り返さず、枠の中で横スクロールさせる --- */
  /* 文字単位の折り返しをやめ、枠の中だけを横に滑らせる。
     右端固定はやめた — 金額の上に「取消」が重なって読めなくなるため。 */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .ledger th, .ledger td { white-space: nowrap; }
  .col-memo { display: none; }

  /* --- 指で押せる大きさに --- */
  .btn { min-height: 40px; padding: 9px 14px; }
  .btn.sm { min-height: 40px; padding: 8px 12px; font-size: 12.5px; }
  .toolbar { gap: 8px; }
  .toolbar .spacer { flex-basis: 100%; height: 0; }

  /* --- 入力欄。16px 未満だと iOS が勝手に拡大する --- */
  input, select, textarea { font-size: 16px !important; min-height: 42px; }
  .field .note { font-size: 11px; }

  /* --- 背の低い端末でも入力欄が画面に収まるように詰める --- */
  @media (max-height: 700px) {
    .dlg-head { padding: 12px 16px 0; }
    .dlg-head h3 { font-size: 15px; }
    .dlg-head p { font-size: 11.5px; line-height: 1.5; }
    .dlg-body { padding: 11px 16px; }
    .dlg-foot { padding: 10px 16px; }
    .form-grid { gap: 8px 9px; }
    .field > label { font-size: 11.5px; }
    .field .note { font-size: 10.5px; line-height: 1.45; }
    input, select, textarea { min-height: 38px !important; }
    .calc-note { font-size: 11px; line-height: 1.55; }
    /* 補足はラベルを読めば分かる範囲なので、背が低い端末では畳んで高さを稼ぐ。
       これを出したままだと借入フォームが画面に収まらない。 */
    .dlg-body .field .note { display: none; }
  }

  /* --- ダイアログは下から出るシートに --- */
  /* 要素は <dialog id="dlg">。class="dlg" は無いので id で当てる。
     ここを .dlg と書いていて、この節がまるごと効いていなかった。 */
  #dlg {
    margin: auto auto 0; width: 100%; max-width: none;
    border-radius: 16px 16px 0 0;
    max-height: 96vh; max-height: 96dvh; padding-bottom: env(safe-area-inset-bottom);
    /* 見出しと操作列を先に確保し、残り全部を本文に配る。
       固定値で引くと端末によって本文が足りず、入力欄がスクロールに隠れる。 */
    display: flex; flex-direction: column;
  }
  /* #dlg の直接の子は <form> で、見出し・本文・操作列はその中にある。
     form にも flex を掛けないと、本文が縮まず操作列が枠の外へ出る。 */
  #dlgForm { display: flex; flex-direction: column; min-height: 0; max-height: inherit; }
  .dlg-head, .dlg-foot { flex: 0 0 auto; }
  /* basis を 0 にして、見出しと操作列を引いた残りだけを本文に与える。 */
  .dlg-body { flex: 1 1 0%; min-height: 0; overflow-y: auto; }
  .dlg-foot .btn { flex: 1 1 auto; justify-content: center; }
}

/* 幅の狭い端末では数字タイルを1列にして、金額の桁を折らない */
@media (max-width: 380px) {
  .g-4 { grid-template-columns: 1fr; }
  .nav-item { font-size: 9px; }
}

.seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: var(--r); overflow: hidden; }
.seg button {
  padding: 7px 14px; border: 0; background: var(--surface);
  cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--ink-2);
  border-right: 1px solid var(--border-2);
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
.toolbar .spacer { flex: 1 1 auto; }

/* ============================================================
   TABLES — ruled like a household ledger
   ============================================================ */
.table-wrap { overflow-x: auto; }
table.ledger { width: 100%; border-collapse: collapse; font-size: 13px; }
table.ledger th {
  text-align: left; font-weight: 600; font-size: 11.5px; color: var(--ink-3);

/* ---- empty states ---- */

  border: 1px dashed var(--border-2); border-radius: var(--r);
  padding: 34px 26px; text-align: center; color: var(--ink-2);

.chart { position: relative; width: 100%; }

.tip {
  position: absolute; pointer-events: none; opacity: 0;
  background: var(--surface); border: 1px solid var(--border-2);

}

.tip .tip-t { font-weight: 600; margin-bottom: 4px; font-size: 11.5px; color: var(--ink-2); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; }

dialog {
  border: 1px solid var(--border-2); border-radius: 8px; padding: 0;

<script>
(function () {
  'use strict';

  /* ==========================================================
     1. 定数・ユーティリティ
     ========================================================== */
  const MAXM = 600;                       // シミュレーション上限 (50年)
  const NS = 'http://www.w3.org/2000/svg';

  const INCOME_CATS  = ['給与', '賞与', '配達（現金回収）', '副業', '事業', '年金・給付', 'その他収入'];
  const EXPENSE_CATS = ['住居', '食費', '水道光熱', '通信', '交通', '保険', '医療',
                        '日用品', '被服', '教育', '交際費', '娯楽',
                        '社会保険', '税金', '預かり金の返却', 'その他支出'];

  const yen  = n => '¥' + Math.round(n).toLocaleString('ja-JP');
  const yen0 = n => Math.round(n).toLocaleString('ja-JP');
  const pct  = n => (Math.round(n * 10) / 10).toFixed(1) + '%';
  const uid  = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ローカル時刻での日付。toISOString() は UTC を返すので、日本時間だと朝9時前に前日へずれる。
  const todayISO = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  };
  const monthKey = iso => (iso || '').slice(0, 7);
  const thisMonth = () => todayISO().slice(0, 7);

  function addMonths(date, n) {
    const d = new Date(date.getFullYear(), date.getMonth(), 1);
    d.setMonth(d.getMonth() + n);
    return d;
  }
  const fmtMonth = d => d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
  const fmtMonthShort = key => {
    const [y, m] = key.split('-');
    return (+m === 1 ? y.slice(2) + '/' : '') + (+m) + '月';
  };
  /** YYYY-MM に n ヶ月足す。年またぎもここで面倒を見る。 */
  function addMonthKey(key, n) {
    if (!/^\d{4}-\d{2}$/.test(key || '')) return key;
    const [y, m] = key.split('-').map(Number);
    const t = (y * 12) + (m - 1) + n;
    return Math.floor(t / 12) + '-' + String((t % 12) + 1).padStart(2, '0');
  }
  /** 実際に口座から出ていく月。未設定の古い記録は利用月とみなす。 */
  const payMonthOf = t => t.payMonth || monthKey(t.date);

  /**
   * 一覧の取り出し。新しい種類のデータを足したとき、まだそれを持たない保存先を
   * 開いても画面が落ちないようにする。列を足して実際に壊したことがあるので、
   * ここは必ずこの関数を通す。
   */
  const rows = name => (Array.isArray(state[name]) ? state[name] : []);

  function monthsBetween(fromKey, toKey) {
    const [y1, m1] = fromKey.split('-').map(Number);
    const [y2, m2] = toKey.split('-').map(Number);
    return (y2 - y1) * 12 + (m2 - m1);
  }
  function durationText(m) {
    if (m == null) return '—';
    const y = Math.floor(m / 12), r = m % 12;
    if (y && r) return y + '年' + r + 'ヶ月';
    if (y) return y + '年';
    return r + 'ヶ月';
  }

  const ICON = {
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.01"/></svg>',
    crit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.01"/></svg>',
    ok:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.8 2.8L16 9.5"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
  };

  /* ==========================================================
     2. 状態と保存
     ========================================================== */
  const blank = () => ({
    debts: [], txns: [], repayments: [], borrows: [], cards: [], cardBills: [],
    goals: { targetDate: '', monthlyRepay: 0, emergency: 0, emergencyCurrent: 0 },
    v: 1
  });

  let state = blank();
  let dbStats = null;
  let online = true;

  /** サーバーの応答を画面が期待する形に整える */
  function adopt(p) {
    state = Object.assign(blank(), p);
    state.goals = Object.assign(blank().goals, p.goals || {});
  }

  // ここから下のデータ層は tools/build-web.js が Google スプレッドシート版に差し替える
  /* ==========================================================
   データ層 — Google スプレッドシート
   tools/build-web.js が public/index.html のデータ層と差し替える。

   ・ログインは Google。drive.file スコープなので、このアプリが作った
     ファイルにしか触れない。他人の Drive は見えないし、こちらも見せない。
   ・保存先は利用者自身の Drive に作る1枚のスプレッドシート。
     つまり「誰がログインしたか」がそのまま「どのデータを見るか」になる。
   ・書き込みは毎回、全シートを1回の batchUpdate で置き換える。
     部分更新をしないので「返済は記録されたが残高が古いまま」が起きない。
   ========================================================== */

const SCOPE = 'https://www.googleapis.com/auth/drive.file';
const FILE_NAME = '返済ロードマップ';
const SHEETS_API = 'https://sheets.googleapis.com/v4/spreadsheets';
const DRIVE_API = 'https://www.googleapis.com/drive/v3/files';

const LS = {
  clientId: 'saimu.clientId',
  fileId:   'saimu.fileId',
  token:    'saimu.token',
  cache:    'saimu.cache'
};

/** なぜログインが要るのかを画面で説明するために覚えておく。 */
let authReason = 'none';

/* ---------- 表の形 ---------- */

const TABLES = {
  debts: ['id', 'name', 'principal', 'interestAccrued', 'accruedAt',
          'originPrincipal', 'originInterest', 'originDate',
          'initial', 'rate', 'minPayment', 'createdAt'],
  txns: ['id', 'type', 'date', 'amount', 'category', 'memo', 'payMonth', 'cardId'],
  cards: ['id', 'name', 'createdAt'],
  cardBills: ['id', 'cardId', 'payMonth', 'amount', 'memo'],
  repayments: ['id', 'debtId', 'date', 'amount', 'interest', 'principal', 'memo'],
  borrows: ['id', 'debtId', 'date', 'amount', 'memo'],
  goals: ['targetDate', 'monthlyRepay', 'emergency', 'emergencyCurrent'],
  meta: ['revision', 'updatedAt', 'app']
};
const NUMERIC = new Set(['principal', 'interestAccrued', 'originPrincipal', 'originInterest',
                         'initial', 'rate', 'minPayment',
                         'amount', 'interest', 'monthlyRepay', 'emergency', 'emergencyCurrent',
                         'revision']);

/* ---------- 利息（db.js と同じ規則） ---------- */

const DAY_BASIS_DB = 365;
const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;
const ISO_MONTH = /^\d{4}-\d{2}$/;

function daysBetweenISO(fromISO, toISO) {
  if (!ISO_DATE.test(fromISO || '') || !ISO_DATE.test(toISO || '')) return 0;
  const [y1, m1, d1] = fromISO.split('-').map(Number);
  const [y2, m2, d2] = toISO.split('-').map(Number);
  return Math.max(0, Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000));
}
/** 利息は元金にのみ付く。未払いのまま残った利息はそれ自身では増えない。 */
const accrueOn = (principal, rate, days) => principal * (rate / 100 / DAY_BASIS_DB) * days;

/* ---------- 値の正規化（db.js と同じ扱い） ---------- */

const toNum = (v, def = 0) => {
  const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/[^\d.\-]/g, ''));
  return Number.isFinite(n) ? n : def;
};
const strOf = (v, max = 200) => String(v ?? '').trim().slice(0, max);
const dateOrDefault = (v, fallback) => (ISO_DATE.test(strOf(v, 10)) ? strOf(v, 10) : fallback);
const nowISO = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
         '-' + String(d.getDate()).padStart(2, '0');
};
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/** YYYY-MM に n ヶ月足す。年またぎもここで面倒を見る。 */
function addMonthKey(key, n) {
  if (!ISO_MONTH.test(key || '')) return key;
  const [y, m] = key.split('-').map(Number);
  const t = (y * 12) + (m - 1) + n;
  return Math.floor(t / 12) + '-' + String((t % 12) + 1).padStart(2, '0');
}
const monthOf = iso => String(iso || '').slice(0, 7);
/** 引落月。指定が無ければ利用月そのまま（＝現金・口座払い）。 */
function payMonthFor(b, date) {
  const given = strOf(b.payMonth, 7);
  return ISO_MONTH.test(given) ? given : monthOf(date);
}

class Refused extends Error {}

function debtFields(b) {
  const split = b.principal != null || b.interestAccrued != null;
  const principal = Math.max(0, split ? toNum(b.principal) : toNum(b.balance));
  const interest = Math.max(0, toNum(b.interestAccrued));
  const balance = principal + interest;
  return {
    principal, interestAccrued: interest,
    accruedAt: dateOrDefault(b.accruedAt, nowISO()),
    initial: Math.max(balance, toNum(b.initial) || balance),
    rate: Math.min(100, Math.max(0, toNum(b.rate))),
    minPayment: Math.max(0, toNum(b.minPayment))
  };
}

/* ---------- ログイン ---------- */

let clientId = localStorage.getItem(LS.clientId) || '';
let tokenClient = null;
let accessToken = null;
let tokenExpires = 0;

/**
 * アクセストークンは1時間で切れる短命な鍵。これを端末に覚えておかないと、
 * 画面を再読み込みするたびに Google のログインをやり直す羽目になる。
 * 保存先はこの端末のこのサイト専用の領域で、他のサイトからは読めない。
 */
function rememberToken() {
  try {
    localStorage.setItem(LS.token, JSON.stringify({ t: accessToken, e: tokenExpires }));
  } catch (e) { /* 保存できなくても動作は続けられる */ }
}
function forgetToken() {
  accessToken = null; tokenExpires = 0;
  try { localStorage.removeItem(LS.token); } catch (e) {}
}
function recallToken() {
  try {
    const raw = localStorage.getItem(LS.token);
    if (!raw) { authReason = 'none'; return false; }
    const v = JSON.parse(raw);
    // 期限ぎりぎりのものは使わない。操作の途中で切れる方が困る。
    if (v && v.t && v.e > Date.now() + 120000) {
      accessToken = v.t; tokenExpires = v.e;
      authReason = 'ok';
      return true;
    }
    authReason = 'expired';
  } catch (e) { authReason = 'broken'; }
  forgetToken();
  return false;
}

/* ---------- 手元の控え ---------- */

/**
 * 最後に読んだ内容をこの端末に控えておく。
 * 開いた瞬間に前回の数字を出せるので、「見るだけ」ならログインが要らない。
 * アクセストークンは1時間で切れる短命な鍵で、ブラウザだけで動く作りでは
 * 長期の更新鍵をもらえない。だから残高を見るたびにログイン、を避けるには
 * 手元に控えておくしかない。
 */
function saveCache(state) {
  try {
    localStorage.setItem(LS.cache, JSON.stringify({ fileId, at: Date.now(), state }));
  } catch (e) { /* 容量超過などは無視。次の同期でまた試す */ }
}
function loadCache() {
  try {
    const raw = localStorage.getItem(LS.cache);
    if (!raw) return null;
    const v = JSON.parse(raw);
    if (!v || !v.state) return null;
    // 別のファイルを開いている控えは使わない
    if (v.fileId && fileId && v.fileId !== fileId) return null;
    return v;
  } catch (e) { return null; }
}
function clearCache() {
  try { localStorage.removeItem(LS.cache); } catch (e) {}
}
recallToken();

/** 覚えている鍵だけで進めるか。true ならログイン画面を出さずに済む。 */
const hasLiveToken = () => !!accessToken && Date.now() < tokenExpires - 120000;

const setClientId = id => {
  clientId = String(id || '').trim();
  localStorage.setItem(LS.clientId, clientId);
  tokenClient = null;
};

function gisReady() {
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    (function poll() {
      if (window.google && google.accounts && google.accounts.oauth2) return resolve();
      if (Date.now() - t0 > 12000) return reject(new Error('Google のログイン部品を読み込めませんでした'));
      setTimeout(poll, 60);
    })();
  });
}

/** アクセストークンを取る。1時間で切れるので、切れていれば取り直す。 */
async function getToken(interactive) {
  if (accessToken && Date.now() < tokenExpires - 60000) return accessToken;
  if (!clientId) throw new Refused('クライアントIDが未設定です');
  await gisReady();

  return new Promise((resolve, reject) => {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: SCOPE,
      callback: r => {
        if (r.error) return reject(new Refused(r.error_description || r.error));
        accessToken = r.access_token;
        tokenExpires = Date.now() + (Number(r.expires_in || 3600) * 1000);
        rememberToken();
        resolve(accessToken);
      },
      error_callback: e => reject(new Refused((e && e.message) || 'ログインを中断しました'))
    });
    // prompt を空にすると、同意済みなら黙って発行され、必要なときだけ画面が出る。
    // 'consent' を指定すると毎回同意画面が出てしまうので使わない。
    tokenClient.requestAccessToken({ prompt: '' });
  });
}

function signOut() {
  if (accessToken && window.google && google.accounts && google.accounts.oauth2) {
    try { google.accounts.oauth2.revoke(accessToken); } catch (e) { /* 失効済みなら何もしない */ }
  }
  forgetToken();
  clearCache();
  localStorage.removeItem(LS.fileId);
}

/* ---------- Google API 呼び出し ---------- */

async function gapi(url, opts) {
  opts = opts || {};
  const token = await getToken(false);
  const res = await fetch(url, {
    method: opts.method || 'GET',
    headers: Object.assign(
      { Authorization: 'Bearer ' + token },
      opts.body ? { 'Content-Type': 'application/json' } : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (res.status === 401) {          // トークンが切れていた。取り直して1度だけやり直す。
    authReason = 'rejected';
    forgetToken();
    const fresh = await getToken(false);
    const retry = await fetch(url, {
      method: opts.method || 'GET',
      headers: Object.assign(
        { Authorization: 'Bearer ' + fresh },
        opts.body ? { 'Content-Type': 'application/json' } : {}),
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    if (!retry.ok) throw new Error(await describe(retry));
    return retry.json();
  }
  if (!res.ok) throw new Error(await describe(res));
  return res.json();
}

async function describe(res) {
  let detail = '';
  try {
    const j = await res.json();
    detail = (j.error && (j.error.message || j.error.status)) || '';
  } catch (e) { /* 本文が JSON でないこともある */ }
  if (res.status === 403) return 'Google に拒否されました。' + (detail || 'スコープや権限を確認してください');
  if (res.status === 429) return 'Google の利用上限に達しました。少し待ってからもう一度試してください';
  return 'Google との通信に失敗しました（' + res.status + '）' + (detail ? ' ' + detail : '');
}

/* ---------- スプレッドシートの用意 ---------- */

let fileId = localStorage.getItem(LS.fileId) || '';
let sheetIds = {};       // 表の名前 → sheetId
let rowCounts = {};      // 前回書いた行数。余りを空行で消すのに使う。
let revision = 0;

async function ensureFile() {
  if (fileId) {
    try {
      await loadSheetIds();
      return fileId;
    } catch (e) {
      fileId = '';                                   // 消された・共有が外れた等
      localStorage.removeItem(LS.fileId);
    }
  }
  // drive.file なので、ここで見えるのはこのアプリが作ったファイルだけ
  const q = encodeURIComponent(
    `name='${FILE_NAME}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`);
  const found = await gapi(`${DRIVE_API}?q=${q}&fields=files(id,name)&pageSize=10`);
  if (found.files && found.files.length) {
    fileId = found.files[0].id;
  } else {
    const made = await gapi(SHEETS_API, {
      method: 'POST',
      body: {
        properties: { title: FILE_NAME },
        sheets: Object.keys(TABLES).map(name => ({ properties: { title: name } }))
      }
    });
    fileId = made.spreadsheetId;
  }
  localStorage.setItem(LS.fileId, fileId);
  await loadSheetIds();
  return fileId;
}

async function loadSheetIds() {
  const meta = await gapi(`${SHEETS_API}/${fileId}?fields=sheets(properties(sheetId,title))`);
  sheetIds = {};
  (meta.sheets || []).forEach(s => { sheetIds[s.properties.title] = s.properties.sheetId; });

  // 足りない表があれば足す（古いファイルを開いたとき用）
  const missing = Object.keys(TABLES).filter(t => sheetIds[t] === undefined);
  if (missing.length) {
    await gapi(`${SHEETS_API}/${fileId}:batchUpdate`, {
      method: 'POST',
      body: { requests: missing.map(title => ({ addSheet: { properties: { title } } })) }
    });
    const again = await gapi(`${SHEETS_API}/${fileId}?fields=sheets(properties(sheetId,title))`);
    sheetIds = {};
    (again.sheets || []).forEach(s => { sheetIds[s.properties.title] = s.properties.sheetId; });
  }
}

/* ---------- 読み書き ---------- */

const colLetter = n => String.fromCharCode(64 + n);
const rangeOf = t => `${t}!A1:${colLetter(TABLES[t].length)}`;

/**
 * 行を項目に組み直す。**1行目の見出しを見て対応づける。**
 *
 * 位置で決め打つと、列を1つ足しただけで既存のシートが全部ずれる。
 * 実際、debts の途中に起点の3列を入れたときに年利と最低返済額が消えた。
 * 見出しで引けば、古いシートを開いても無い列が空になるだけで済む。
 */
function rowsToObjects(table, rows) {
  const cols = TABLES[table];
  const header = (rows && rows[0]) || [];
  const at = {};
  cols.forEach(c => {
    const i = header.findIndex(h => String(h ?? '').trim() === c);
    // 見出しが無いシート（自分で作る前の手書きなど）だけ、並び順を頼りにする
    at[c] = i >= 0 ? i : (header.length ? -1 : cols.indexOf(c));
  });

  const out = [];
  for (const row of (rows || []).slice(1)) {
    if (!row || row.every(c => String(c ?? '') === '')) continue;
    const o = {};
    cols.forEach(c => {
      const raw = at[c] >= 0 ? row[at[c]] : undefined;
      o[c] = NUMERIC.has(c) ? toNum(raw) : String(raw ?? '');
    });
    out.push(o);
  }
  return out;
}

async function readAll() {
  const ranges = Object.keys(TABLES).map(t => `ranges=${encodeURIComponent(rangeOf(t))}`).join('&');
  const got = await gapi(`${SHEETS_API}/${fileId}/values:batchGet?${ranges}&majorDimension=ROWS`);
  const byTable = {};
  Object.keys(TABLES).forEach((t, i) => {
    const values = (got.valueRanges && got.valueRanges[i] && got.valueRanges[i].values) || [];
    rowCounts[t] = Math.max(0, values.length - 1);
    byTable[t] = rowsToObjects(t, values);
  });

  // 起点の列が無かった頃のシートを開いたとき。いまの状態をそのまま起点として補う。
  // ここを空のままにすると、次の書き込みで元金0として保存され残高が消える。
  byTable.debts.forEach(d => {
    if (!ISO_DATE.test(d.originDate || '')) {
      d.originDate = ISO_DATE.test(d.accruedAt || '') ? d.accruedAt : nowISO();
      d.originPrincipal = d.principal;
      d.originInterest = d.interestAccrued;
    }
    if (!(d.initial > 0)) d.initial = d.principal + d.interestAccrued;
  });

  const g = byTable.goals[0] || {};
  const m = byTable.meta[0] || {};
  revision = toNum(m.revision);

  return {
    debts: byTable.debts,
    cards: byTable.cards,
    cardBills: byTable.cardBills,
    borrows: byTable.borrows,
    txns: byTable.txns,
    repayments: byTable.repayments,
    goals: {
      targetDate: g.targetDate || '',
      monthlyRepay: toNum(g.monthlyRepay),
      emergency: toNum(g.emergency),
      emergencyCurrent: toNum(g.emergencyCurrent)
    }
  };
}

/** 全シートを1回の batchUpdate で置き換える。前回より短くなった分は空行で消す。 */
async function writeAll(st) {
  const payload = {
    debts: st.debts, txns: st.txns, repayments: st.repayments,
    cards: st.cards, cardBills: st.cardBills, borrows: st.borrows,
    goals: [st.goals],
    meta: [{ revision: revision + 1, updatedAt: new Date().toISOString(), app: 'saimu-roadmap' }]
  };

  const requests = [];
  for (const table of Object.keys(TABLES)) {
    const cols = TABLES[table];
    const data = payload[table] || [];
    const body = data.map(o => cols.map(c => o[c]));
    const blanks = Math.max(0, (rowCounts[table] || 0) - data.length);
    const rows = [cols].concat(body).concat(
      Array.from({ length: blanks }, () => cols.map(() => '')));

    requests.push({
      updateCells: {
        range: { sheetId: sheetIds[table], startRowIndex: 0, startColumnIndex: 0 },
        fields: 'userEnteredValue',
        rows: rows.map(r => ({
          values: r.map(v => ({
            userEnteredValue: v === '' || v == null ? {}
              : (typeof v === 'number' ? { numberValue: v } : { stringValue: String(v) })
          }))
        }))
      }
    });
    rowCounts[table] = data.length;
  }

  await gapi(`${SHEETS_API}/${fileId}:batchUpdate`, { method: 'POST', body: { requests } });
  revision += 1;
}

/** 他の端末が先に書いていないか確かめる。書き負けを黙って起こさないため。 */
async function assertFresh() {
  const got = await gapi(
    `${SHEETS_API}/${fileId}/values:batchGet?ranges=${encodeURIComponent('meta!A1:C2')}`);
  const rows = (got.valueRanges && got.valueRanges[0] && got.valueRanges[0].values) || [];
  const theirs = toNum((rows[1] || [])[0]);
  if (theirs > revision) {
    throw new Error('別の端末で更新されています。画面を再読み込みしてから、もう一度お試しください');
  }
}

/* ----------------------------------------------------------
   server.js の JSON API と同じ形をブラウザ側で再現する。
   呼び出し側（commit / 各画面）は元のままで動く。
   ---------------------------------------------------------- */

let mem = null;          // スプレッドシートに入っている生の状態

/** 保存値は起算日時点。画面には今日時点の未払利息と残高を渡す。 */
function derive(st) {
  const today = nowISO();
  return {
    debts: st.debts.map(d => {
      const days = daysBetweenISO(d.accruedAt, today);
      const pending = accrueOn(d.principal, d.rate, days);
      const interestToday = d.interestAccrued + pending;
      return Object.assign({}, d, {
        originDate: d.originDate,
        pendingDays: days,
        pendingInterest: pending,
        interestToday,
        balance: d.principal + interestToday
      });
    }),
    cards: st.cards.slice(),
    cardBills: st.cardBills.slice(),
    borrows: st.borrows.slice(),
    txns: st.txns.slice().sort((a, b) => b.date.localeCompare(a.date)),
    repayments: st.repayments.slice().sort((a, b) => b.date.localeCompare(a.date)),
    goals: st.goals
  };
}

/* ---------- 変更の中身（db.js と同じ規則） ---------- */

const findDebt = id => mem.debts.find(d => d.id === id);

/**
 * 借入の現在の状態を、起点から返済を**日付順に**再生して組み立て直す。
 * 入力した順ではなく日付の順で計算するので、あとから過去の返済を足しても結果は変わらない。
 */
function rebuildDebt(d) {
  // 追加借入と返済を1本の時間軸に並べる。同じ日なら借りてから返した順に扱う。
  const events = [];
  mem.borrows.filter(b => b.debtId === d.id && b.date >= d.originDate)
    .forEach(b => events.push({ kind: 0, date: b.date, amount: b.amount, ref: b }));
  mem.repayments.filter(r => r.debtId === d.id && r.date >= d.originDate)
    .forEach(r => events.push({ kind: 1, date: r.date, amount: r.amount, ref: r }));
  events.sort((a, b) => a.date.localeCompare(b.date) || (a.kind - b.kind) ||
                        String(a.ref.id).localeCompare(String(b.ref.id)));

  let principal = d.originPrincipal;
  let interest = d.originInterest;
  let cursor = d.originDate;

  for (const e of events) {
    interest += accrueOn(principal, d.rate, daysBetweenISO(cursor, e.date));
    if (e.kind === 0) {
      principal += e.amount;                       // 追加で借りた
    } else {
      const paidInterest = Math.min(e.amount, interest);
      const paidPrincipal = Math.min(e.amount - paidInterest, principal);
      e.ref.interest = paidInterest;
      e.ref.principal = paidPrincipal;
      interest -= paidInterest;
      principal -= paidPrincipal;
    }
    if (e.date > cursor) cursor = e.date;
  }
  d.principal = principal;
  d.interestAccrued = interest;
  d.accruedAt = cursor;
}

const MUT = {
  addDebt(b) {
    const name = strOf(b.name, 60);
    if (!name) throw new Refused('借入先の名前を入力してください');
    const f = debtFields(b);
    mem.debts.push(Object.assign({ id: newId(), name }, f, {
      originPrincipal: f.principal, originInterest: f.interestAccrued, originDate: f.accruedAt,
      createdAt: nowISO()
    }));
  },

  updateDebt(id, b) {
    const d = findDebt(id);
    if (!d) throw new Refused('その借入は見つかりません');
    const name = strOf(b.name, 60);
    if (!name) throw new Refused('借入先の名前を入力してください');
    const f = debtFields(b);
    // 編集は「この日時点でこの残高だった」という申告し直し。起点も更新して組み直す。
    Object.assign(d, { name }, f, {
      originPrincipal: f.principal, originInterest: f.interestAccrued, originDate: f.accruedAt
    });
    rebuildDebt(d);
  },

  deleteDebt(id) {
    mem.debts = mem.debts.filter(d => d.id !== id);
    mem.repayments = mem.repayments.filter(r => r.debtId !== id);   // ON DELETE CASCADE の代わり
    mem.borrows = mem.borrows.filter(b => b.debtId !== id);
  },

  addRepayment(b) {
    const d = findDebt(strOf(b.debtId, 40));
    if (!d) throw new Refused('その借入は見つかりません');
    const amount = toNum(b.amount);
    if (!(amount > 0)) throw new Refused('返済額は1円以上で入力してください');

    const date = dateOrDefault(b.date, nowISO());
    // 起点より前の返済も記録はできる。ただし残高には反映しない。
    // rebuildDebt が起点以降だけを再生するので、二重に減ることはない。
    mem.repayments.push({
      id: newId(), debtId: d.id, date, amount,
      interest: 0, principal: 0, memo: strOf(b.memo, 60)
    });
    rebuildDebt(d);
  },

  /** 追加で借りた記録。当初借入額も増やし、進捗率が借りた総額に対する割合になるようにする。 */
  addBorrow(b) {
    const d = findDebt(strOf(b.debtId, 40));
    if (!d) throw new Refused('その借入は見つかりません');
    const amount = toNum(b.amount);
    if (!(amount > 0)) throw new Refused('借入額は1円以上で入力してください');
    const date = dateOrDefault(b.date, nowISO());
    mem.borrows.push({ id: newId(), debtId: d.id, date, amount, memo: strOf(b.memo, 60) });
    // 残高に反映しない（起点より前の）借入では、当初借入額も動かさない
    if (!d.originDate || date >= d.originDate) d.initial += amount;
    rebuildDebt(d);
  },

  deleteBorrow(id) {
    const b = mem.borrows.find(x => x.id === id);
    if (!b) return;
    mem.borrows = mem.borrows.filter(x => x.id !== id);
    const d = findDebt(b.debtId);
    if (!d) return;
    if (!d.originDate || b.date >= d.originDate) d.initial = Math.max(0, d.initial - b.amount);
    rebuildDebt(d);
  },

  deleteRepayment(id) {
    const r = mem.repayments.find(x => x.id === id);
    if (!r) return;
    mem.repayments = mem.repayments.filter(x => x.id !== id);
    const d = findDebt(r.debtId);
    if (d) rebuildDebt(d);
  },

  addTxn(b) {
    const amount = toNum(b.amount);
    if (!(amount > 0)) throw new Refused('金額は1円以上で入力してください');
    const type = b.type === 'income' ? 'income' : 'expense';
    const date = dateOrDefault(b.date, nowISO());
    const cid = type === 'income' ? '' : strOf(b.cardId, 40);
    mem.txns.push({
      id: newId(), type, date, amount,
      category: strOf(b.category, 30) || 'その他',
      memo: strOf(b.memo, 60),
      // 収入は受け取った月がそのまま現金の動き。引落月を選べるのは支出だけ。
      payMonth: type === 'income' ? monthOf(date) : payMonthFor(b, date),
      cardId: mem.cards.some(c => c.id === cid) ? cid : ''
    });
  },

  addCard(b) {
    const name = strOf(b.name, 40);
    if (!name) throw new Refused('カードの名前を入力してください');
    mem.cards.push({ id: newId(), name, createdAt: nowISO() });
  },

  updateCard(id, b) {
    const c = mem.cards.find(x => x.id === id);
    if (!c) throw new Refused('そのカードは見つかりません');
    const name = strOf(b.name, 40);
    if (!name) throw new Refused('カードの名前を入力してください');
    c.name = name;
  },

  /** カードを消すと請求額も消える。明細は現金・口座払い扱いに戻す。 */
  deleteCard(id) {
    mem.cards = mem.cards.filter(c => c.id !== id);
    mem.cardBills = mem.cardBills.filter(b => b.cardId !== id);
    mem.txns.forEach(t => { if (t.cardId === id) t.cardId = ''; });
  },

  /** 1枚のカードにつき1ヶ月1件。同じ月なら上書きする。 */
  setCardBill(b) {
    const cardId = strOf(b.cardId, 40);
    if (!mem.cards.some(c => c.id === cardId)) throw new Refused('そのカードは見つかりません');
    const payMonth = strOf(b.payMonth, 7);
    if (!ISO_MONTH.test(payMonth)) throw new Refused('引落月は YYYY-MM の形で指定してください');
    const amount = Math.max(0, toNum(b.amount));
    const memo = strOf(b.memo, 60);
    const cur = mem.cardBills.find(x => x.cardId === cardId && x.payMonth === payMonth);
    if (cur) { cur.amount = amount; cur.memo = memo; }
    else mem.cardBills.push({ id: newId(), cardId, payMonth, amount, memo });
  },

  deleteCardBill(id) {
    mem.cardBills = mem.cardBills.filter(b => b.id !== id);
  },

  deleteTxn(id) { mem.txns = mem.txns.filter(t => t.id !== id); },

  setGoals(b) {
    mem.goals = {
      targetDate: dateOrDefault(b.targetDate, ''),
      monthlyRepay: Math.max(0, toNum(b.monthlyRepay)),
      emergency: Math.max(0, toNum(b.emergency)),
      emergencyCurrent: Math.max(0, toNum(b.emergencyCurrent))
    };
  },

  wipe() {
    mem = { debts: [], txns: [], repayments: [], borrows: [], cards: [], cardBills: [],
            goals: { targetDate: '', monthlyRepay: 0, emergency: 0, emergencyCurrent: 0 } };
  },

  importState(p) {
    if (!p || !Array.isArray(p.debts)) throw new Refused('バックアップの形式が違います');
    const seen = new Set();
    const debts = [];
    for (const d of p.debts) {
      const id = strOf(d.id, 40) || newId();
      if (seen.has(id)) continue;
      seen.add(id);
      const f = debtFields(d);
      debts.push(Object.assign({ id, name: strOf(d.name, 60) || '名称未設定' }, f, {
        originPrincipal: f.principal, originInterest: f.interestAccrued, originDate: f.accruedAt,
        createdAt: dateOrDefault(d.createdAt, nowISO())
      }));
    }
    const cards = [];
    const cardIds = new Set();
    for (const c of (p.cards || [])) {
      const id = strOf(c.id, 40) || newId();
      if (cardIds.has(id)) continue;
      cardIds.add(id);
      cards.push({ id, name: strOf(c.name, 40) || '名称未設定',
                   createdAt: dateOrDefault(c.createdAt, nowISO()) });
    }
    const cardBills = [];
    for (const b of (p.cardBills || [])) {
      const cid = strOf(b.cardId, 40);
      const pm = strOf(b.payMonth, 7);
      if (!cardIds.has(cid) || !ISO_MONTH.test(pm)) continue;   // 宛先の無い請求は捨てる
      cardBills.push({ id: strOf(b.id, 40) || newId(), cardId: cid, payMonth: pm,
                       amount: Math.max(0, toNum(b.amount)), memo: strOf(b.memo, 60) });
    }
    const txns = [];
    for (const t of (p.txns || [])) {
      const amount = toNum(t.amount);
      if (!(amount > 0)) continue;
      const ttype = t.type === 'income' ? 'income' : 'expense';
      const tdate = dateOrDefault(t.date, nowISO());
      txns.push({
        id: strOf(t.id, 40) || newId(), type: ttype, date: tdate, amount,
        category: strOf(t.category, 30) || 'その他', memo: strOf(t.memo, 60),
        payMonth: ttype === 'income' ? monthOf(tdate) : payMonthFor(t, tdate),
        cardId: cardIds.has(strOf(t.cardId, 40)) ? strOf(t.cardId, 40) : ''
      });
    }
    const repayments = [];
    for (const r of (p.repayments || [])) {
      const amount = toNum(r.amount);
      if (!(amount > 0) || !seen.has(strOf(r.debtId, 40))) continue;   // 宛先の無い記録は捨てる
      repayments.push({
        id: strOf(r.id, 40) || newId(), debtId: strOf(r.debtId, 40),
        date: dateOrDefault(r.date, nowISO()), amount,
        interest: Math.max(0, toNum(r.interest)), principal: Math.max(0, toNum(r.principal)),
        memo: strOf(r.memo, 60)
      });
    }
    const borrows = [];
    for (const b of (p.borrows || [])) {
      const amount = toNum(b.amount);
      if (!(amount > 0) || !seen.has(strOf(b.debtId, 40))) continue;   // 宛先の無い記録は捨てる
      borrows.push({ id: strOf(b.id, 40) || newId(), debtId: strOf(b.debtId, 40),
                     date: dateOrDefault(b.date, nowISO()), amount, memo: strOf(b.memo, 60) });
    }
    const g = p.goals || {};
    mem = { debts, cards, cardBills, txns, repayments, borrows, goals: {
      targetDate: dateOrDefault(g.targetDate, ''),
      monthlyRepay: Math.max(0, toNum(g.monthlyRepay)),
      emergency: Math.max(0, toNum(g.emergency)),
      emergency_current: undefined,
      emergencyCurrent: Math.max(0, toNum(g.emergencyCurrent))
    } };
    delete mem.goals.emergency_current;
  },

  loadSample() {
    const now = new Date();
    const mk = i => {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    };
    const today = nowISO();
    MUT.wipe();

    const seeds = [
      ['銀行カードローン', 1330000, 1500000, 14.5, 30000, 38000],
      ['自動車ローン',     1030000, 1800000, 3.9,  32000, 32000],
      ['クレジット分割',    320000,  400000, 15.0, 15000, 15000]
    ].map(([name, prin, initial, rate, minPayment, pay]) => {
      const d = { id: newId(), name, principal: prin, interestAccrued: 0,
                  accruedAt: mk(6) + '-27',
                  originPrincipal: prin, originInterest: 0, originDate: mk(6) + '-27',
                  initial, rate, minPayment, createdAt: mk(10) + '-01' };
      mem.debts.push(d);
      return { d, pay };
    });

    const EX = [['住居', 82000], ['食費', 54000], ['水道光熱', 16500], ['通信', 9800],
                ['交通', 12000], ['保険', 14000], ['日用品', 11500], ['交際費', 9000], ['娯楽', 7500]];

    for (let i = 5; i >= 0; i--) {
      const m = mk(i);
      mem.txns.push({ id: newId(), type: 'income', date: m + '-25',
                      amount: 328000 + (i % 2 ? 0 : 4000), category: '給与', memo: '', payMonth: m });
      if (i === 1) mem.txns.push({ id: newId(), type: 'income', date: m + '-10',
                                   amount: 420000, category: '賞与', memo: '夏季', payMonth: m });
      // カードで払いがちな費目は、利用した月ではなく翌月に口座から出ていく
      const CARD = new Set(['通信', '娯楽', '交際費', '被服']);
      EX.forEach(([c, v], k) => mem.txns.push({
        id: newId(), type: 'expense', date: m + '-' + String(3 + k * 2).padStart(2, '0'),
        amount: v + ((i * 7 + k * 3) % 5) * 400, category: c,
        memo: CARD.has(c) ? 'カード払い' : '',
        payMonth: CARD.has(c) ? addMonthKey(m, 1) : m
      }));
      seeds.forEach(({ d, pay }) => {
        const date = m + '-27';
        if (date > today) return;                       // まだ来ていない返済日は記録しない
        const interest = accrueOn(d.principal, d.rate, daysBetweenISO(d.accruedAt, date));
        const paidInterest = Math.min(pay, interest);
        const paidPrincipal = Math.min(pay - paidInterest, d.principal);
        mem.repayments.push({ id: newId(), debtId: d.id, date, amount: pay,
                              interest: paidInterest, principal: paidPrincipal, memo: '' });
        d.principal -= paidPrincipal;
        d.accruedAt = date;
      });
    }

    mem.goals = { targetDate: (now.getFullYear() + 3) + '-03-31', monthlyRepay: 95000,
                  emergency: 600000, emergencyCurrent: 180000 };
  }
};

/* ---------- 入口 ---------- */

async function api(path, method, body) {
  const [, resource, id] = path.split('/');
  const m = method || 'GET';

  if (resource === 'state' && m === 'GET') return derive(mem);

  if (resource === 'stats' && m === 'GET') {
    return {
      path: `https://docs.google.com/spreadsheets/d/${fileId}/edit`,
      size: JSON.stringify(mem).length,
      debts: mem.debts.length,
      txns: mem.txns.length,
      repayments: mem.repayments.length,
      backupDir: 'Google ドライブ'
    };
  }

  // 書き込み。先に他端末の更新を確かめ、変更を適用してから全体を書き戻す。
  const save = async fn => {
    await assertFresh();
    const before = JSON.stringify(mem);
    try {
      fn();
      await writeAll(mem);
      saveCache(mem);                  // 手元の控えも最新にする
    } catch (e) {
      mem = JSON.parse(before);        // 書けなかったら手元も元に戻す
      throw e;
    }
    return derive(mem);
  };

  switch (resource) {
    case 'debts':
      if (m === 'POST')   return save(() => MUT.addDebt(body));
      if (m === 'PUT')    return save(() => MUT.updateDebt(id, body));
      if (m === 'DELETE') return save(() => MUT.deleteDebt(id));
      break;
    case 'repayments':
      if (m === 'POST')   return save(() => MUT.addRepayment(body));
      if (m === 'DELETE') return save(() => MUT.deleteRepayment(id));
      break;
    case 'borrows':
      if (m === 'POST')   return save(() => MUT.addBorrow(body));
      if (m === 'DELETE') return save(() => MUT.deleteBorrow(id));
      break;
    case 'txns':
      if (m === 'POST')   return save(() => MUT.addTxn(body));
      if (m === 'DELETE') return save(() => MUT.deleteTxn(id));
      break;
    case 'cards':
      if (m === 'POST')   return save(() => MUT.addCard(body));
      if (m === 'PUT')    return save(() => MUT.updateCard(id, body));
      if (m === 'DELETE') return save(() => MUT.deleteCard(id));
      break;
    case 'cardbills':
      if (m === 'POST')   return save(() => MUT.setCardBill(body));
      if (m === 'DELETE') return save(() => MUT.deleteCardBill(id));
      break;
    case 'goals':
      if (m === 'PUT')    return save(() => MUT.setGoals(body));
      break;
    case 'import':
      if (m === 'POST')   return save(() => MUT.importState(body));
      break;
    case 'sample':
      if (m === 'POST')   return save(() => MUT.loadSample());
      break;
    case 'wipe':
      if (m === 'POST')   return save(() => MUT.wipe());
      break;
    case 'backup': {
      if (m !== 'POST') break;
      const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      const copy = await gapi(`${DRIVE_API}/${fileId}/copy`, {
        method: 'POST', body: { name: `${FILE_NAME} ${stamp}` }
      });
      return { file: copy.name, size: JSON.stringify(mem).length };
    }
  }

  throw new Error('この操作には対応していません');
}
  

  /**
   * 書き込み。サーバーが返す更新後の全状態で置き換えてから再描画するので、
   * 画面と DB の中身がずれることがない。
   */
  async function commit(path, method, body, okMsg) {
    try {
      adopt(await api(path, method, body));
      online = true;
      try { dbStats = await api('/stats'); } catch (e) { /* 表示用なので失敗は無視 */ }
      render();
      if (okMsg) toast(okMsg);
      return true;
    } catch (e) {
      online = false;
      render();
      toast(e.message);
      return false;
    }
  }

          broken:   'この端末に保存された情報が読めませんでした。入り直してください。',

        }[authReason] || ''}</p>

function hideGate() { gateEl().hidden = true; }

async function signIn() {
  const btn = document.getElementById('gate-in');
  if (btn) { btn.disabled = true; btn.textContent = 'ログイン中…'; }

    await getToken(true);
    await afterSignIn();

  }

/** ログイン後：本人確認 → 自分のファイルを用意 → 読み込み → 描画 */
async function afterSignIn() {
  // ここで userinfo を叩いてはいけない。要求しているのは drive.file だけなので
  // 権限外として 401 が返り、gapi がそれを「鍵が切れた」と誤解して鍵を捨て、
  // 取り直しのポップアップを毎回出してしまう。メール表示のために払う代償ではない。
  await ensureFile();
  mem = await readAll();
  saveCache(mem);                     // 次に開いたときログイン無しで見られるように
  dbStats = await api('/stats');
  adopt(await api('/state'));
  online = true;
  hideGate();
  hideStaleBanner();
  render();
}

/** 手元の控えを画面に出す。ログインしていなくても前回の数字が見られる。 */
function showCached() {
  const c = loadCache();
  if (!c) return null;
  mem = c.state;
  adopt(derive(mem));
  online = false;
  hideGate();
  render();
  showStaleBanner(c.at);
  return c;
}

async function boot() {
  online = false;
  mem = { debts: [], txns: [], repayments: [], borrows: [], cards: [], cardBills: [],
          goals: { targetDate: '', monthlyRepay: 0, emergency: 0, emergencyCurrent: 0 } };
  adopt(mem);

  if (!clientId) { render(); showGate(); return; }

  // まず手元の控えを出す。残高を見るだけならこれで足りるので、
  // アクセストークンが切れていてもログイン画面で止めない。
  const cached = showCached();
  if (!cached) render();

  // 期限内の鍵があれば、Google に問い合わせずそのまま最新に合わせる。
  if (hasLiveToken()) {
    try {
      await afterSignIn();
      return;
    } catch (e) {
      // 通信の失敗と、鍵が拒否されたのは別物。拒否でなければ鍵は捨てない。
      if (authReason !== 'rejected') {
        if (cached) { showStaleBanner(cached.at, e.message); return; }
      } else {
        forgetToken();
      }
    }
  }

  // 鍵が無い・切れている。
  // ここで自動的に取り直そうとすると、Google のアカウント選択が勝手に出る。
  // 静かに終わる保証が無い（特にスマホのブラウザ）ので、控えがあるなら出さない。
  // 更新は「最新にする」を押したときと、記録を変えるときだけにする。
  if (cached) {
    showStaleBanner(cached.at);
    return;
  }
  try {
    await getToken(false);
    await afterSignIn();
  } catch (e) {
    showGate('in');
  }
}

/**
 * 使っている最中に期限が切れないよう、先回りして取り直す。
 * すでに許可済みで Google の画面も開いたばかりなので、たいていは何も出ずに通る。
 * 失敗しても何もしない（控えを見せたまま、必要なときに押してもらう）。
 */
function keepTokenFresh() {
  setInterval(async () => {
    if (document.hidden || !online) return;
    if (!accessToken) return;
    if (Date.now() < tokenExpires - 10 * 60 * 1000) return;   // 残り10分を切ってから
    try {
      await getToken(false);
    } catch (e) { /* 取り直せなければ、次の操作のときに改めて出す */ }
  }, 5 * 60 * 1000);
}
keepTokenFresh();

/** 控えを見せているときの帯。いつ時点の数字かと、更新の手立てを出す。 */
function showStaleBanner(at, note) {
  const d = new Date(at);
  const stamp = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' +
                String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  let bar = document.getElementById('stale');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'stale';
    document.body.appendChild(bar);
  }
  bar.innerHTML =
    `<span>この端末に保存された <b>${stamp}</b> 時点の内容です${note ? '（' + esc(note) + '）' : ''}</span>
     <button class="btn sm primary" id="stale-sync">最新にする</button>`;
  bar.hidden = false;
  document.getElementById('stale-sync').addEventListener('click', async () => {
    const b = document.getElementById('stale-sync');
    b.disabled = true; b.textContent = '更新中…';
    try {
      await getToken(true);
      await afterSignIn();
      hideStaleBanner();
    } catch (e) {
      b.disabled = false; b.textContent = '最新にする';
      toast(e.message || '更新できませんでした');
    }
  });
}

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
