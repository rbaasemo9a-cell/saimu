  /* ==========================================================
     3. 金融計算
     ========================================================== */
  const DAY_BASIS = 365;                  // 年利を日割りする分母。うるう年も 365 日として扱う。

  /** 日付を保ったまま n ヶ月後。31日など相手の月に無い日は月末に丸める。 */
  function addMonthsExact(date, n) {
    const d = new Date(date.getFullYear(), date.getMonth(), 1);
    d.setMonth(d.getMonth() + n);
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(date.getDate(), last));
    return d;
  }
  /** Date どうしの日数。過去に戻る向きは 0。 */
  function daysApart(a, b) {
    const u = x => Date.UTC(x.getFullYear(), x.getMonth(), x.getDate());
    return Math.max(0, Math.round((u(b) - u(a)) / 86400000));
  }
  /** days 日分の利息。利息は元金にのみ付き、未払いの利息はそれ自身では増えない。 */
  function interestFor(principal, rate, days) {
    return principal * (rate / 100 / DAY_BASIS) * days;
  }
  /** 今日から1ヶ月後までに発生する利息。 */
  function monthlyInterest(d) {
    const t = new Date();
    return interestFor(d.principal, d.rate, daysApart(t, addMonthsExact(t, 1)));
  }

  const totalBalance     = () => state.debts.reduce((s, d) => s + Math.max(0, d.balance), 0);
  const totalPrincipal   = () => state.debts.reduce((s, d) => s + Math.max(0, d.principal), 0);
  const totalInterestDue = () => state.debts.reduce((s, d) => s + Math.max(0, d.interestToday), 0);
  const totalInitial     = () => state.debts.reduce((s, d) => s + Math.max(d.initial || 0, d.balance), 0);
  const totalMinPayment  = () => state.debts.reduce((s, d) => (d.balance > 0 ? s + d.minPayment : s), 0);

  /**
   * 毎月の返済をシミュレートする。
   * 利息は日割り（年利 ÷ 365 × 経過日数）で元金にのみ発生し、返済額はまず未払利息に、
   * 残った分だけが元金に充当される。返済日は今日から1ヶ月刻みに置くので、
   * 月ごとの日数の違い（28日／31日）もそのまま利息に効く。
   * strategy: 'avalanche' 高金利優先 / 'snowball' 少額優先 / 'minimum' 最低返済のみ
   * 返り値の payoffMonths が null なら期間内に完済しない。
   */
  function simulate(budget, strategy) {
    const ds = state.debts
      .filter(d => d.balance > 0.5)
      .map(d => ({ id: d.id, name: d.name, prin: Math.max(0, d.principal),
                   int: Math.max(0, d.interestToday), rate: d.rate, min: d.minPayment }));

    if (!ds.length) return { months: [], totalInterest: 0, payoffMonths: 0, stalled: false, perDebt: {} };

    const sumMin = ds.reduce((s, d) => s + d.min, 0);
    const budgetUsed = strategy === 'minimum' ? sumMin : Math.max(budget, 0);

    const months = [];
    const perDebt = {};
    ds.forEach(d => { perDebt[d.id] = { name: d.name, paidOff: null }; });
    let totalInterest = 0, stalled = false;

    const bal = d => d.prin + d.int;
    /** 1件への充当。利息が先、余りが元金。 */
    const apply = (d, pay) => {
      const toInterest = Math.min(pay, d.int);
      d.int -= toInterest;
      d.prin = Math.max(0, d.prin - (pay - toInterest));
    };

    const start = new Date();
    let cursor = start;

    for (let m = 0; m < MAXM; m++) {
      const live = ds.filter(d => bal(d) > 0.5);
      if (!live.length) break;

      // 前回の返済日から今回の返済日までの日数分、利息が発生する
      const due = addMonthsExact(start, m + 1);
      const days = daysApart(cursor, due);
      cursor = due;

      let mi = 0;
      live.forEach(d => { const i = interestFor(d.prin, d.rate, days); d.int += i; mi += i; });
      totalInterest += mi;

      // 最低返済を全件に充当
      let avail = budgetUsed;
      live.forEach(d => {
        const pay = Math.min(d.min, bal(d), avail);
        apply(d, pay); avail -= pay;
      });

      // 余剰を戦略に従って1件へ集中
      if (strategy !== 'minimum' && avail > 0.5) {
        const rest = ds.filter(d => bal(d) > 0.5);
        rest.sort(strategy === 'snowball' ? (a, b) => bal(a) - bal(b) : (a, b) => b.rate - a.rate);
        for (const d of rest) {
          if (avail <= 0.5) break;
          const pay = Math.min(avail, bal(d));
          apply(d, pay); avail -= pay;
        }
      }

      live.forEach(d => { if (bal(d) <= 0.5 && perDebt[d.id].paidOff == null) perDebt[d.id].paidOff = m + 1; });

      const tb = ds.reduce((s, d) => s + Math.max(0, bal(d)), 0);
      months.push({ m: m + 1, balance: tb, interest: mi });

      const L = months.length;
      if (L >= 2 && months[L - 1].balance >= months[L - 2].balance - 0.5) { stalled = true; break; }
    }

    const done = !stalled && ds.every(d => bal(d) <= 0.5);
    return {
      months, totalInterest, perDebt, stalled,
      payoffMonths: done ? months.length : null,
      budgetUsed
    };
  }

  /**
   * この家計で使う返済方式。残高の小さい借入から順に完済していく雪だるま式。
   * 完済予定日も必要返済額も、実際に払う方式で計算しないと意味がない。
   */
  const PLAN = 'snowball';

  /** 目標期間内に完済するのに必要な月額返済を二分探索で求める */
  function requiredBudget(targetMonths) {
    if (targetMonths <= 0) return null;
    const tb = totalBalance();
    if (tb <= 0) return 0;
    let lo = 0, hi = tb * 1.5 + 10000;
    if (!simulate(hi, PLAN).payoffMonths) return null;
    for (let i = 0; i < 44; i++) {
      const mid = (lo + hi) / 2;
      const r = simulate(mid, PLAN);
      if (r.payoffMonths && r.payoffMonths <= targetMonths) hi = mid; else lo = mid;
    }
    return Math.ceil(hi / 100) * 100;
  }

  /* ==========================================================
     4. 集計
     ========================================================== */
  /**
   * その月に口座から出ていく額の内訳。
   * カードは、請求額の登録があればそれを正とする（明細を全部入れなくても正しくなる）。
   * 登録が無い月だけ、明細の合計で代替する。両方を足すと二重計上になるので必ずどちらか。
   * usedBy を渡すと「その月までに使った分」だけを明細から拾う（取り置きの計算用）。
   */
  function outflow(key, usedBy) {
    let cash = 0;
    const byCard = {};
    rows('txns').forEach(t => {
      if (t.type !== 'expense' || payMonthOf(t) !== key) return;
      if (usedBy && monthKey(t.date) > usedBy) return;
      if (t.cardId) byCard[t.cardId] = (byCard[t.cardId] || 0) + t.amount;
      else cash += t.amount;
    });

    const bills = {};
    rows('cardBills').forEach(b => { if (b.payMonth === key) bills[b.cardId] = b.amount; });

    const cardRows = rows('cards').map(c => {
      const billed = Object.prototype.hasOwnProperty.call(bills, c.id);
      return {
        id: c.id, name: c.name, billed,
        amount: billed ? bills[c.id] : (byCard[c.id] || 0),
        detail: byCard[c.id] || 0
      };
    });
    // 消したカードに紐づいたままの明細も取りこぼさない
    let orphan = 0;
    Object.keys(byCard).forEach(id => {
      if (!cardRows.some(c => c.id === id)) orphan += byCard[id];
    });

    const card = cardRows.reduce((a, r) => a + r.amount, 0) + orphan;
    return { cash, card, orphan, rows: cardRows, total: cash + card };
  }

  /**
   * 月次の集計。支出は2つの見方を持つ。
   *   expense     発生ベース … 使った月。「今月いくら使ったか」を見るための数字。
   *   expensePaid 引落ベース … 実際に口座から出ていく月。カード払いは翌月に回る。
   * 「返済に回せる余力」は現金の話なので、引落ベースで出す。
   */
  function monthSummary(key) {
    let income = 0, expense = 0, expensePaid = 0, deferred = 0;
    rows('txns').forEach(t => {
      const used = monthKey(t.date) === key;
      if (t.type === 'income') { if (used) income += t.amount; return; }
      if (used) {
        expense += t.amount;
        if (payMonthOf(t) !== key) deferred += t.amount;   // 今月使ったが翌月以降に出ていく分
      }
    });
    const out = outflow(key);
    expensePaid = out.total;

    // その月に実際に借金が減った額。返済しても同じ月に借りていれば、その分は戻る。
    // 現金の流れとしても、借入は手元に入るお金なので差し引きで見るのが正しい。
    const repayGross = rows('repayments')
      .filter(r => monthKey(r.date) === key)
      .reduce((s, r) => s + r.amount, 0);
    const borrow = rows('borrows')
      .filter(b => monthKey(b.date) === key)
      .reduce((s, b) => s + b.amount, 0);
    const repay = repayGross - borrow;

    return { key, income, expense, expensePaid, deferred, out,
             repay, repayGross, borrow,
             net: income - expensePaid - repay };
  }

  /**
   * 翌月に確定している引落。今月の手元にお金があっても、この分は既に他人のものなので
   * 使ってはいけない。現金回収の仕事だと手元の現金と口座の引落がずれるため、
   * これを見せないと「使い切って翌月払えない」が起きる。
   */
  function committedNext(key) {
    return outflow(addMonthKey(key, 1), key).total;
  }

  /** その月に引き落とされる額のうち、前の月までに使った分（＝カード払いの繰越）。 */
  function carriedInto(key) {
    return rows('txns')
      .filter(t => t.type === 'expense' && payMonthOf(t) === key && monthKey(t.date) !== key)
      .reduce((s, t) => s + t.amount, 0);
  }

  const cardName = id => (rows('cards').find(c => c.id === id) || {}).name || '';

  /** 直近 n ヶ月（当月を含む）のキー配列 */
  function recentMonths(n) {
    const out = [];
    const now = new Date();
    for (let i = n - 1; i >= 0; i--) {
      const d = addMonths(now, -i);
      out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
    }
    return out;
  }

  /**
   * 返済に回せる月々の余力：直近 n ヶ月の (収入 − 引落) の平均。
   * 使った月ではなく口座から出ていく月で数える。カード払いを発生ベースで引くと、
   * 引落が翌月に来る分だけ余力を過大にも過小にも見せてしまう。
   */
  function avgCapacity(n) {
    const keys = recentMonths(n).filter(k => {
      return state.txns.some(t => monthKey(t.date) === k);
    });
    if (!keys.length) return null;
    const tot = keys.reduce((s, k) => {
      const m = monthSummary(k);
      return s + (m.income - m.expensePaid);
    }, 0);
    return tot / keys.length;
  }

  function expenseByCategory(key) {
    const map = new Map();
    state.txns.forEach(t => {
      if (t.type !== 'expense' || monthKey(t.date) !== key) return;
      map.set(t.category, (map.get(t.category) || 0) + t.amount);
    });
    let rows = [...map.entries()].map(([k, v]) => ({ label: k, value: v }))
      .sort((a, b) => b.value - a.value);
    // 系列は循環させない。8枠を超えたら「その他」に畳む。
    if (rows.length > 7) {
      const rest = rows.slice(7).reduce((s, r) => s + r.value, 0);
      rows = rows.slice(0, 7).concat([{ label: 'その他の項目', value: rest }]);
    }
    return rows;
  }

  /* ==========================================================
     5. チャート基盤
     ========================================================== */
  const SERIES = i => 'var(--s' + ((i % 8) + 1) + ')';
  let observers = [];
  function clearCharts() { observers.forEach(o => o.disconnect()); observers = []; }

  function mountChart(el, draw) {
    // 同じ要素に二重に監視をつけない
    if (el.__ro) {
      el.__ro.disconnect();
      const i = observers.indexOf(el.__ro);
      if (i >= 0) observers.splice(i, 1);
    }
    let last = 0;
    const ro = new ResizeObserver(entries => {
      const w = Math.max(260, Math.floor(entries[0].contentRect.width));
      if (Math.abs(w - last) < 2) return;
      last = w;
      el.querySelectorAll('svg').forEach(s => s.remove());
      draw(el, w);
    });
    ro.observe(el);
    observers.push(ro);
    el.__ro = ro;
  }

  function el(tag, attrs, style) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (style) e.setAttribute('style', style);
    return e;
  }

  function tipFor(container) {
    let t = container.querySelector('.tip');
    if (!t) { t = document.createElement('div'); t.className = 'tip'; container.appendChild(t); }
    return t;
  }
  function placeTip(container, tip, x, y) {
    const cw = container.clientWidth;
    tip.classList.add('show');
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = clamp(x - tw / 2, 4, Math.max(4, cw - tw - 4)) + 'px';
    tip.style.top = Math.max(4, y - th - 12) + 'px';
  }

  /** 目盛りの丸め */
  function niceTicks(max, count) {
    if (max <= 0) return [0, 1];
    const raw = max / count;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
    const out = [];
    for (let v = 0; v <= max + step * 0.001; v += step) out.push(v);
    if (out[out.length - 1] < max) out.push(out[out.length - 1] + step);
    return out;
  }
  function compact(n) {
    const a = Math.abs(n);
    if (a >= 1e8) return (n / 1e8).toFixed(a >= 1e9 ? 0 : 1).replace(/\.0$/, '') + '億';
    if (a >= 1e4) return (n / 1e4).toFixed(a >= 1e6 ? 0 : 1).replace(/\.0$/, '') + '万';
    return yen0(n);
  }

  /** 片側だけ角を丸めたバーのパス */
  function barPath(x, y, w, h, r, dir) {
    r = Math.max(0, Math.min(r, dir === 'up' ? w / 2 : h / 2, dir === 'up' ? h : w));
    if (h <= 0 || w <= 0) return '';
    if (dir === 'up') {
      return `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z`;
    }
    return `M${x},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h - r} Q${x + w},${y + h} ${x + w - r},${y + h} L${x},${y + h} Z`;
  }

  /* ---------- 面グラフ（単一系列・十字カーソル） ---------- */
  function areaChart(container, w, opts) {
    const { points, height = 190, pad = { t: 16, r: 16, b: 26, l: 52 }, label, bleed } = opts;
    if (!points.length) return;
    const P = bleed ? { t: 14, r: 0, b: 24, l: 0 } : pad;
    const iw = w - P.l - P.r, ih = height - P.t - P.b;
    const svg = el('svg', { viewBox: `0 0 ${w} ${height}`, height, role: 'img',
      'aria-label': (label || '推移') + 'の折れ線グラフ' });

    const maxV = Math.max(...points.map(p => p.v), 1);
    const ticks = niceTicks(maxV, 3);
    const top = ticks[ticks.length - 1];
    const X = i => P.l + (points.length === 1 ? iw / 2 : (i / (points.length - 1)) * iw);
    const Y = v => P.t + ih - (v / top) * ih;

    if (!bleed) {
      ticks.forEach(t => {
        svg.appendChild(el('line', { x1: P.l, x2: P.l + iw, y1: Y(t), y2: Y(t) },
          'stroke:var(--grid);stroke-width:1'));
        const tx = el('text', { x: P.l - 8, y: Y(t) + 3.5, 'text-anchor': 'end', class: 'tick' },
          'fill:var(--ink-3)');
        tx.textContent = compact(t);
        svg.appendChild(tx);
      });
    } else {
      ticks.forEach(t => {
        if (t === 0) return;
        svg.appendChild(el('line', { x1: 0, x2: w, y1: Y(t), y2: Y(t) },
          'stroke:var(--grid);stroke-width:1'));
      });
    }

    const gid = 'ag' + uid();
    const defs = el('defs');
    const grad = el('linearGradient', { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 });
    grad.appendChild(el('stop', { offset: '0%', 'stop-opacity': '.16' }, 'stop-color:var(--accent)'));
    grad.appendChild(el('stop', { offset: '100%', 'stop-opacity': '.01' }, 'stop-color:var(--accent)'));
    defs.appendChild(grad); svg.appendChild(defs);

    const line = points.map((p, i) => (i ? 'L' : 'M') + X(i) + ',' + Y(p.v)).join(' ');
    svg.appendChild(el('path', { d: `${line} L${X(points.length - 1)},${P.t + ih} L${X(0)},${P.t + ih} Z`, fill: `url(#${gid})` }));
    svg.appendChild(el('path', { d: line, fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' },
      'stroke:var(--accent);stroke-width:2'));

    // 軸ラベル（最初と最後のみ）
    [0, points.length - 1].forEach((i, k) => {
      if (points.length < 2 && k) return;
      const t = el('text', { x: clamp(X(i), 16, w - 16), y: height - 7,
        'text-anchor': k ? 'end' : 'start', class: 'tick' }, 'fill:var(--ink-3)');
      t.textContent = points[i].label;
      svg.appendChild(t);
    });

    // 終点のマーカー（サーフェスリング付き）
    const li = points.length - 1;
    svg.appendChild(el('circle', { cx: X(li), cy: Y(points[li].v), r: 5.5 },
      'fill:var(--accent);stroke:var(--surface);stroke-width:2'));

    // 十字カーソル
    const cross = el('line', { y1: P.t, y2: P.t + ih, opacity: 0 }, 'stroke:var(--ink-3);stroke-width:1');
    const dot = el('circle', { r: 4.5, opacity: 0 }, 'fill:var(--accent);stroke:var(--surface);stroke-width:2');
    svg.appendChild(cross); svg.appendChild(dot);
    const tip = tipFor(container);

    svg.addEventListener('pointermove', ev => {
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) * (w / r.width);
      let idx = points.length === 1 ? 0
        : Math.round(((px - P.l) / iw) * (points.length - 1));
      idx = clamp(idx, 0, points.length - 1);
      const p = points[idx];
      cross.setAttribute('x1', X(idx)); cross.setAttribute('x2', X(idx)); cross.setAttribute('opacity', .5);
      dot.setAttribute('cx', X(idx)); dot.setAttribute('cy', Y(p.v)); dot.setAttribute('opacity', 1);
      tip.innerHTML = `<div class="tip-t">${esc(p.full || p.label)}</div>
        <div class="tip-r"><span class="tip-k"><i class="swatch" style="background:var(--accent)"></i>${esc(label || '残高')}</span><b>${yen(p.v)}</b></div>`;
      placeTip(container, tip, X(idx) * (r.width / w), Y(p.v) * (r.height / height));
    });
    svg.addEventListener('pointerleave', () => {
      cross.setAttribute('opacity', 0); dot.setAttribute('opacity', 0); tip.classList.remove('show');
    });

    container.appendChild(svg);
  }

  /* ---------- 横棒グラフ（カテゴリ別） ---------- */
  function barsChart(container, w, opts) {
    const { rows, colorFn, valueFmt = yen } = opts;
    if (!rows.length) return;
    const labelW = Math.min(112, Math.max(64, w * 0.26));
    const P = { t: 6, r: 74, b: 6, l: labelW };
    const bh = Math.min(24, Math.max(13, 240 / rows.length));
    const gap = 12;
    const height = P.t + P.b + rows.length * (bh + gap) - gap;
    const iw = w - P.l - P.r;
    const max = Math.max(...rows.map(r => r.value), 1);

    const svg = el('svg', { viewBox: `0 0 ${w} ${height}`, height, role: 'img',
      'aria-label': '項目別の横棒グラフ' });
    const tip = tipFor(container);

    rows.forEach((r, i) => {
      const y = P.t + i * (bh + gap);
      const bw = Math.max(2, (r.value / max) * iw);
      const color = colorFn ? colorFn(r, i) : SERIES(i);

      const lb = el('text', { x: P.l - 10, y: y + bh / 2 + 4, 'text-anchor': 'end', class: 'clabel' },
        'fill:var(--ink-2)');
      lb.textContent = r.label.length > 7 ? r.label.slice(0, 6) + '…' : r.label;
      svg.appendChild(lb);

      svg.appendChild(el('rect', { x: P.l, y, width: iw, height: bh, rx: 3 },
        'fill:var(--surface-3);opacity:.55'));

      const bar = el('path', { d: barPath(P.l, y, bw, bh, 4, 'right') }, 'fill:' + color);
      svg.appendChild(bar);

      const vl = el('text', { x: P.l + bw + 9, y: y + bh / 2 + 4, class: 'dlabel' }, 'fill:var(--ink-2)');
      vl.textContent = valueFmt(r.value);
      svg.appendChild(vl);

      const hit = el('rect', { x: 0, y: y - gap / 2, width: w, height: bh + gap, fill: 'transparent' });
      hit.style.cursor = 'default';
      hit.addEventListener('pointerenter', () => {
        bar.style.filter = 'brightness(1.08)';
        tip.innerHTML = `<div class="tip-t">${esc(r.label)}</div>
          <div class="tip-r"><span class="tip-k"><i class="swatch" style="background:${color}"></i>${esc(r.sub || '金額')}</span><b>${valueFmt(r.value)}</b></div>`;
        const rc = svg.getBoundingClientRect();
        placeTip(container, tip, (P.l + bw / 2) * (rc.width / w), (y) * (rc.height / height));
      });
      hit.addEventListener('pointerleave', () => { bar.style.filter = ''; tip.classList.remove('show'); });
      svg.appendChild(hit);
    });

    container.appendChild(svg);
  }

  /* ---------- グループ縦棒（月次収支） ---------- */
  function groupedColumns(container, w, opts) {
    const { groups, series, height = 220 } = opts;
    if (!groups.length) return;
    const P = { t: 14, r: 12, b: 30, l: 52 };
    const iw = w - P.l - P.r, ih = height - P.t - P.b;
    const max = Math.max(1, ...groups.map(g => Math.max(...g.values)));
    const ticks = niceTicks(max, 3);
    const top = ticks[ticks.length - 1];

    const svg = el('svg', { viewBox: `0 0 ${w} ${height}`, height, role: 'img',
      'aria-label': '月ごとの収入・支出・返済の縦棒グラフ' });
    const tip = tipFor(container);

    ticks.forEach(t => {
      const y = P.t + ih - (t / top) * ih;
      svg.appendChild(el('line', { x1: P.l, x2: P.l + iw, y1: y, y2: y },
        'stroke:' + (t === 0 ? 'var(--axis)' : 'var(--grid)') + ';stroke-width:1'));
      const tx = el('text', { x: P.l - 8, y: y + 3.5, 'text-anchor': 'end', class: 'tick' }, 'fill:var(--ink-3)');
      tx.textContent = compact(t);
      svg.appendChild(tx);
    });

    const band = iw / groups.length;
    const n = series.length;
    const GAP = 2;                                   // サーフェスギャップ
    const bw = Math.min(24, Math.max(5, (band * 0.66 - GAP * (n - 1)) / n));
    const clusterW = bw * n + GAP * (n - 1);

    groups.forEach((g, gi) => {
      const cx = P.l + band * gi + band / 2;
      const x0 = cx - clusterW / 2;

      g.values.forEach((v, si) => {
        const h = (v / top) * ih;
        const x = x0 + si * (bw + GAP);
        const y = P.t + ih - h;
        if (h > 0.5) {
          svg.appendChild(el('path', { d: barPath(x, y, bw, h, 4, 'up') },
            'fill:' + series[si].color));
        }
      });

      const lb = el('text', { x: cx, y: height - 9, 'text-anchor': 'middle', class: 'tick' },
        'fill:var(--ink-3)');
      lb.textContent = g.label;
      svg.appendChild(lb);

      const hit = el('rect', { x: P.l + band * gi, y: P.t, width: band, height: ih, fill: 'transparent' });
      hit.addEventListener('pointerenter', () => {
        tip.innerHTML = `<div class="tip-t">${esc(g.full || g.label)}</div>` +
          series.map((s, si) => `<div class="tip-r"><span class="tip-k"><i class="swatch" style="background:${s.color}"></i>${esc(s.name)}</span><b>${yen(g.values[si])}</b></div>`).join('') +
          `<div class="tip-r" style="margin-top:4px;padding-top:4px;border-top:1px solid var(--border)"><span class="tip-k">差引</span><b>${yen(g.net)}</b></div>`;
        const rc = svg.getBoundingClientRect();
        placeTip(container, tip, cx * (rc.width / w), P.t * (rc.height / height));
      });
      hit.addEventListener('pointerleave', () => tip.classList.remove('show'));
      svg.appendChild(hit);
    });

    container.appendChild(svg);
  }

  /* ---------- 複数折れ線（戦略比較） ---------- */
  function multiLine(container, w, opts) {
    const { series, height = 250, xLabel } = opts;
    const P = { t: 16, r: 84, b: 30, l: 56 };
    const iw = w - P.l - P.r, ih = height - P.t - P.b;
    const len = Math.max(...series.map(s => s.points.length), 1);
    const max = Math.max(1, ...series.flatMap(s => s.points));
    const ticks = niceTicks(max, 4);
    const top = ticks[ticks.length - 1];
    const X = i => P.l + (len === 1 ? 0 : (i / (len - 1)) * iw);
    const Y = v => P.t + ih - (v / top) * ih;

    const svg = el('svg', { viewBox: `0 0 ${w} ${height}`, height, role: 'img',
      'aria-label': '返済戦略ごとの残高推移の比較グラフ' });
    const tip = tipFor(container);

    ticks.forEach(t => {
      svg.appendChild(el('line', { x1: P.l, x2: P.l + iw, y1: Y(t), y2: Y(t) },
        'stroke:' + (t === 0 ? 'var(--axis)' : 'var(--grid)') + ';stroke-width:1'));
      const tx = el('text', { x: P.l - 8, y: Y(t) + 3.5, 'text-anchor': 'end', class: 'tick' }, 'fill:var(--ink-3)');
      tx.textContent = compact(t);
      svg.appendChild(tx);
    });

    // x 軸ラベル
    [0, Math.floor((len - 1) / 2), len - 1].forEach((i, k) => {
      if (i < 0) return;
      const t = el('text', { x: clamp(X(i), P.l, P.l + iw), y: height - 9,
        'text-anchor': k === 0 ? 'start' : k === 2 ? 'end' : 'middle', class: 'tick' }, 'fill:var(--ink-3)');
      t.textContent = (i + 1) + 'ヶ月';
      svg.appendChild(t);
    });
    if (xLabel) {
      const t = el('text', { x: P.l, y: 10, class: 'clabel' }, 'fill:var(--ink-3)');
      t.textContent = xLabel; svg.appendChild(t);
    }

    series.forEach(s => {
      if (!s.points.length) return;
      const d = s.points.map((v, i) => (i ? 'L' : 'M') + X(i) + ',' + Y(v)).join(' ');
      svg.appendChild(el('path', { d, fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' },
        `stroke:${s.color};stroke-width:2`));
      const li = s.points.length - 1;
      svg.appendChild(el('circle', { cx: X(li), cy: Y(s.points[li]), r: 4.5 },
        `fill:${s.color};stroke:var(--surface);stroke-width:2`));
      // 完済点に直接ラベル（凡例を補う）
      const lab = el('text', { x: Math.min(X(li) + 10, w - 4), y: Y(s.points[li]) + 4, class: 'dlabel' },
        'fill:var(--ink-2)');
      lab.textContent = s.payoff ? s.payoff + 'ヶ月' : '未完済';
      svg.appendChild(lab);
    });

    const cross = el('line', { y1: P.t, y2: P.t + ih, opacity: 0 }, 'stroke:var(--ink-3);stroke-width:1');
    svg.appendChild(cross);
    svg.addEventListener('pointermove', ev => {
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) * (w / r.width);
      let idx = clamp(Math.round(((px - P.l) / iw) * (len - 1)), 0, len - 1);
      cross.setAttribute('x1', X(idx)); cross.setAttribute('x2', X(idx)); cross.setAttribute('opacity', .45);
      tip.innerHTML = `<div class="tip-t">${idx + 1}ヶ月後の残高</div>` +
        series.map(s => `<div class="tip-r"><span class="tip-k"><i class="swatch" style="background:${s.color}"></i>${esc(s.name)}</span><b>${idx < s.points.length ? yen(s.points[idx]) : '完済'}</b></div>`).join('');
      placeTip(container, tip, X(idx) * (r.width / w), P.t * (r.height / height));
    });
    svg.addEventListener('pointerleave', () => { cross.setAttribute('opacity', 0); tip.classList.remove('show'); });

    container.appendChild(svg);
  }

  function legendHTML(items) {
    return '<div class="legend">' + items.map(i =>
      `<span><i class="swatch" style="background:${i.color}"></i>${esc(i.name)}</span>`).join('') + '</div>';
  }

  /* ==========================================================
     6. ビュー描画

  let currentView = 'dash';

  /* ---------- ダッシュボード ---------- */
  V.dash = function () {
    const root = document.getElementById('view-dash');
    const tb = totalBalance();

    if (!state.debts.length) {
      root.innerHTML = headHTML('ダッシュボード', 'まず借入を登録すると、完済予定日と必要な毎月の返済額を計算します。') +
        `<div class="empty">
           <h3>借入がまだ登録されていません</h3>
           <p>借入先・元金・未払利息・年利・最低返済額を登録すると、完済までの道のりと利息の総額がすぐに見えるようになります。利息はその後、日割りで自動計算されます。</p>
           <div style="display:flex;gap:9px;flex-wrap:wrap;justify-content:center">
             <button class="btn primary" data-act="add-debt">${ICON.plus}借入を登録する</button>
             <button class="btn" data-act="sample">サンプルデータで試す</button>
           </div>
         </div>`;
      return;
    }

    const budget = plannedBudget();
    const sim = simulate(budget, PLAN);
    const payoffDate = sim.payoffMonths ? fmtMonth(addMonths(new Date(), sim.payoffMonths)) : null;
    const mk = thisMonth();
    const ms = monthSummary(mk);
    const init = totalInitial();
    const progress = init > 0 ? ((init - tb) / init) * 100 : 0;
    const sumMin = totalMinPayment();
    const monthInterest = state.debts.reduce((s, d) => s + monthlyInterest(d), 0);
    const dayInterest = state.debts.reduce((s, d) => s + interestFor(d.principal, d.rate, 1), 0);

    const alerts = [];
    state.debts.filter(d => d.balance > 0.5).forEach(d => {
      if (d.minPayment <= monthlyInterest(d)) {
        alerts.push(`<div class="callout crit">${ICON.crit}<div><b>${esc(d.name)}</b> は最低返済額（${yen(d.minPayment)}）が毎月の利息（${yen(monthlyInterest(d))}）を下回っています。このままでは残高が減りません。返済額を増やすか、借り換えを検討してください。</div></div>`);
      }
    });
    const committed = committedNext(mk);
    if (committed > 0 && ms.net - committed < 0) {
      alerts.push(`<div class="callout crit">${ICON.crit}<div>来月の引落 <b>${yen(committed)}</b> が確定していますが、今月の余力は <b>${yen(ms.net)}</b> しかありません。<b>${yen(committed - ms.net)}</b> 不足します。手元の現金を使う前に取り置いてください。</div></div>`);
    } else if (committed > 0) {
      alerts.push(`<div class="callout warn">${ICON.warn}<div>来月の引落として <b>${yen(committed)}</b> が確定しています。今月まだ使ってよいのは <b>${yen(ms.net - committed)}</b> です。</div></div>`);
    }
    if (budget < sumMin) {
      alerts.push(`<div class="callout warn">${ICON.warn}<div>予定している月々の返済額 <b>${yen(budget)}</b> が、最低返済額の合計 <b>${yen(sumMin)}</b> に届いていません。目標画面で返済額を見直してください。</div></div>`);
    }

    root.innerHTML =
      headHTML('ダッシュボード', `現在の残高と返済ペースから、完済までの道のりを計算しています。基準となる月々の返済額は <b class="num">${yen(budget)}</b> です。`) +

      `<div class="roadmap">
         <div class="roadmap-figure">
           <div class="roadmap-label">完済予定</div>
           ${payoffDate
            ? `<div class="hero-figure">${payoffDate}</div>
               <div class="roadmap-sub">あと <b class="num">${durationText(sim.payoffMonths)}</b>・支払う利息 <b class="num">${yen(sim.totalInterest)}</b></div>`
            : `<div class="hero-figure is-muted">計算できません</div>
               <div class="roadmap-sub">今の返済額では残高が減りません。返済額を増やすと予定日が表示されます。</div>`}
         </div>
         <div class="roadmap-chart chart" id="ch-road"></div>
       </div>

       ${alerts.join('')}

       <div class="grid g-4" style="margin-top:16px">
         <div class="tile">
           <span class="tile-label">借入残高の合計</span>
           <span class="tile-value neg">${yen(tb)}</span>
           <span class="tile-delta">元金 ${compact(totalPrincipal())}・未払利息 ${compact(totalInterestDue())}</span>
         </div>
         <div class="tile">
           <span class="tile-label">返済の進捗</span>
           <span class="tile-value">${pct(progress)}</span>
           <div class="meter ${progress >= 60 ? 'is-good' : ''}" style="margin-top:6px"><i style="width:${clamp(progress, 0, 100)}%"></i></div>
         </div>
         <div class="tile">
           <span class="tile-label">今月の収支（返済後）</span>
           <span class="tile-value ${ms.net < 0 ? 'neg' : 'pos'}">${yen(ms.net)}</span>
           <span class="tile-delta">収入 ${compact(ms.income)}・引落 ${compact(ms.expensePaid)}・返済 ${compact(ms.repay)}${ms.borrow > 0 ? `（${compact(ms.repayGross)}−借入${compact(ms.borrow)}）` : ''}${ms.deferred > 0 ? `<br>カードで翌月に回る分 ${compact(ms.deferred)}` : ''}</span>
         </div>
         <div class="tile">
           <span class="tile-label">これから1ヶ月の利息</span>
           <span class="tile-value">${yen(monthInterest)}</span>
           <span class="tile-delta">日割りで ${yen(dayInterest)}/日・最低返済額 ${compact(sumMin)}</span>
         </div>
       </div>

       <div class="grid g-2" style="margin-top:16px">
         <div class="panel">
           <div class="panel-head"><h2>借入先ごとの残高</h2><span class="hint">完済予定順</span></div>
           <div class="panel-body"><div class="chart" id="ch-debts"></div>
             <details class="tableview"><summary>数値で見る</summary><div id="tb-debts"></div></details>
           </div>
         </div>
         <div class="panel">
           <div class="panel-head"><h2>月次の収入・支出・返済</h2><span class="hint">直近6ヶ月</span></div>
           <div class="panel-body"><div class="chart" id="ch-cash"></div>
             <div id="lg-cash"></div>
             <details class="tableview"><summary>数値で見る</summary><div id="tb-cash"></div></details>
           </div>
         </div>
       </div>`;

    // 残高の降下カーブ
    const road = document.getElementById('ch-road');
    const pts = [{ v: tb, label: '現在', full: '現在' }].concat(
      sim.months.map((m, i) => ({
        v: m.balance,
        label: sim.payoffMonths && i === sim.months.length - 1 ? '完済' : (m.m + 'ヶ月'),
        full: fmtMonth(addMonths(new Date(), m.m))
      })));
    mountChart(road, (c, w) => areaChart(c, w, { points: pts, height: 190, bleed: true, label: '残高' }));

    // 借入先ごとの残高（完済予定順）
    const dRows = state.debts.filter(d => d.balance > 0.5)
      .map(d => ({ ...d, off: sim.perDebt[d.id] ? sim.perDebt[d.id].paidOff : null }))
      .sort((a, b) => (a.off ?? 9999) - (b.off ?? 9999))
      .map((d, i) => ({ label: d.name, value: d.balance, sub: '残高', off: d.off, rate: d.rate,
                        prin: d.principal, int: d.interestToday, _i: i }));
    const dc = document.getElementById('ch-debts');
    if (dRows.length) {
      mountChart(dc, (c, w) => barsChart(c, w, { rows: dRows, colorFn: (r) => SERIES(r._i) }));
      document.getElementById('tb-debts').innerHTML = `<div class="table-wrap"><table class="ledger">
        <thead><tr><th>借入先</th><th class="r">元金</th><th class="r">未払利息</th><th class="r">残高</th><th class="r">年利</th><th class="r">完済まで</th></tr></thead>
        <tbody>${dRows.map(r => `<tr>
          <td><span style="display:inline-flex;align-items:center;gap:7px"><i class="swatch" style="background:${SERIES(r._i)}"></i>${esc(r.label)}</span></td>
          <td class="r">${yen(r.prin)}</td>
          <td class="r" style="color:var(--ink-2)">${yen(r.int)}</td>
          <td class="r">${yen(r.value)}</td><td class="r">${r.rate}%</td>
          <td class="r">${r.off ? durationText(r.off) : '—'}</td></tr>`).join('')}</tbody></table></div>`;
    } else {
      dc.innerHTML = '<p style="color:var(--ink-3);font-size:13px">残高のある借入がありません。</p>';
    }

    // 月次収支
    renderCashChart('ch-cash', 'lg-cash', 'tb-cash', 6);
  };

  function renderCashChart(chartId, legendId, tableId, n) {
    const keys = recentMonths(n);
    const sums = keys.map(monthSummary);
    const series = [
      { name: '収入', color: SERIES(0) },
      { name: '生活支出（引落）', color: SERIES(1) },
      { name: '返済（借入を差引）', color: SERIES(2) }
    ];
    // 棒は現金の出入りなので引落ベース。使った月ではなく出ていく月で並べる。
    const groups = sums.map(s => ({
      label: fmtMonthShort(s.key), full: s.key.replace('-', '年') + '月',
      values: [s.income, s.expensePaid, s.repay], net: s.net
    }));
    const c = document.getElementById(chartId);
    if (!sums.some(s => s.income || s.expense || s.repay)) {
      c.innerHTML = '<p style="color:var(--ink-3);font-size:13px;padding:24px 0">収入・支出・返済の記録がまだありません。</p>';
      if (legendId) document.getElementById(legendId).innerHTML = '';
      if (tableId) document.getElementById(tableId).innerHTML = '';
      return;
    }
    mountChart(c, (cc, w) => groupedColumns(cc, w, { groups, series }));
    if (legendId) document.getElementById(legendId).innerHTML = legendHTML(series);
    if (tableId) {
      document.getElementById(tableId).innerHTML = `<div class="table-wrap"><table class="ledger">
        <thead><tr><th>月</th><th class="r">収入</th>
          <th class="r col-memo" title="その月に使った額">使った額</th>
          <th class="r">引落</th><th class="r col-memo">借入</th><th class="r">返済</th><th class="r">差引</th></tr></thead>
        <tbody>${sums.map(s => `<tr><td>${esc(s.key)}</td>
          <td class="r">${yen(s.income)}</td>
          <td class="r col-memo" style="color:var(--ink-3)">${yen(s.expense)}</td>
          <td class="r">${yen(s.expensePaid)}</td>
          <td class="r col-memo" style="color:var(--ink-3)">${s.borrow > 0 ? '+' + yen(s.borrow) : '—'}</td>
          <td class="r ${s.repay < 0 ? 'amt-neg' : ''}">${yen(s.repay)}</td>
          <td class="r ${s.net < 0 ? 'amt-neg' : 'amt-pos'}">${yen(s.net)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>合計</td>
          <td class="r">${yen(sums.reduce((a, s) => a + s.income, 0))}</td>
          <td class="r col-memo" style="color:var(--ink-3)">${yen(sums.reduce((a, s) => a + s.expense, 0))}</td>
          <td class="r">${yen(sums.reduce((a, s) => a + s.expensePaid, 0))}</td>
          <td class="r col-memo" style="color:var(--ink-3)">${yen(sums.reduce((a, s) => a + s.borrow, 0))}</td>
          <td class="r">${yen(sums.reduce((a, s) => a + s.repay, 0))}</td>
          <td class="r">${yen(sums.reduce((a, s) => a + s.net, 0))}</td></tr></tfoot></table></div>`;
    }
  }

  /** 計画上の月々の返済額：目標 > 直近実績の平均 > 最低返済額合計 */
  function plannedBudget() {
    if (state.goals.monthlyRepay > 0) return state.goals.monthlyRepay;
    const keys = recentMonths(3);
    const paid = keys.map(k => monthSummary(k).repay).filter(v => v > 0);
    if (paid.length) return paid.reduce((a, b) => a + b, 0) / paid.length;
    return totalMinPayment();
  }

  /* ---------- 借入・返済 ---------- */
  V.debts = function () {
    const root = document.getElementById('view-debts');
    const sim = simulate(plannedBudget(), PLAN);

    const cards = state.debts.map((d, i) => {
      const int = monthlyInterest(d);
      const init = Math.max(d.initial || 0, d.balance);
      const prog = init > 0 ? ((init - d.balance) / init) * 100 : 100;
      const off = sim.perDebt[d.id] ? sim.perDebt[d.id].paidOff : null;
      const cleared = d.balance <= 0.5;
      const stuck = !cleared && d.minPayment <= int;
      const pill = cleared
        ? `<span class="pill ok">${ICON.ok}完済</span>`
        : stuck ? `<span class="pill crit">${ICON.crit}元金が減りません</span>`
        : off ? `<span class="pill flat">あと ${durationText(off)}</span>`
        : `<span class="pill warn">${ICON.warn}期間内に完済しません</span>`;

      return `<div class="debt-card">
        <div class="debt-top">
          <div>
            <div class="debt-name"><i class="swatch" style="background:${SERIES(i)};width:10px;height:10px"></i>${esc(d.name)}</div>
            <div class="debt-bal ${cleared ? '' : 'amt-neg'}" style="margin-top:2px">${yen(d.balance)}</div>
            <div style="font-size:12px;color:var(--ink-2);margin-top:2px">
              元金 <b>${yen(d.principal)}</b>　＋　未払利息 <b>${yen(d.interestToday)}</b></div>
          </div>
          ${pill}
        </div>
        <div class="meter ${cleared ? 'is-good' : stuck ? 'is-crit' : ''}"><i style="width:${clamp(prog, 0, 100)}%"></i></div>
        <div class="debt-meta">
          <span>年利 <b>${d.rate}%</b></span>
          <span>最低返済 <b>${yen(d.minPayment)}</b></span>
          <span title="元金 ${yen0(d.principal)} × ${d.rate}% ÷ ${DAY_BASIS}日">利息 <b>${yen(interestFor(d.principal, d.rate, 1))}/日</b>・<b>${yen(int)}/月</b></span>
          <span>返済済み <b>${pct(prog)}</b></span>
        </div>
        <div class="debt-actions">
          <button class="btn sm primary" data-act="pay" data-id="${d.id}" ${cleared ? 'disabled' : ''}>返済を記録</button>
          <button class="btn sm" data-act="borrow" data-id="${d.id}">追加で借りた</button>
          <button class="btn sm" data-act="edit-debt" data-id="${d.id}">編集</button>
          <button class="btn sm danger" data-act="del-debt" data-id="${d.id}">削除</button>
        </div>
      </div>`;
    }).join('');

    // 返済と追加借入を1つの時間軸で見せる。残高が動いた理由が一覧で追える。
    const moves = [
      ...state.repayments.map(r => ({ ...r, kind: 'repay' })),
      ...state.borrows.map(b => ({ ...b, kind: 'borrow' }))
    ].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 40);
    const nameOf = id => (rows('debts').find(d => d.id === id) || {}).name || '（削除済み）';
    /** 起点より前の記録は、申告した残高に既に含まれているので計算に入らない。 */
    const historyOnly = r => {
      const d = rows('debts').find(x => x.id === r.debtId);
      return !!(d && d.originDate && r.date < d.originDate);
    };

    root.innerHTML =
      headHTML('借入・返済', '借入ごとに<b>元金</b>と<b>未払利息</b>を登録すると、以降の利息は<b>日割り</b>（年利 ÷ 365 × 経過日数）で自動計算されます。返済を記録すると、返済額はまず利息に充当され、残った分が元金から引かれます。') +
      `<div class="toolbar">
         <button class="btn primary" data-act="add-debt">${ICON.plus}借入を追加</button>
         <div class="spacer"></div>
         <span style="font-size:12.5px;color:var(--ink-2)">残高合計 <b class="num" style="color:var(--ink)">${yen(totalBalance())}</b>（元金 ${yen(totalPrincipal())}＋未払利息 ${yen(totalInterestDue())}）　最低返済額 <b class="num" style="color:var(--ink)">${yen(totalMinPayment())}/月</b></span>
       </div>` +
      (state.debts.length
        ? `<div class="grid g-2">${cards}</div>`
        : `<div class="empty"><h3>借入がありません</h3><p>「借入を追加」から、借入先・元金・未払利息・年利・毎月の最低返済額を登録してください。</p>
             <button class="btn primary" data-act="add-debt">${ICON.plus}借入を追加</button></div>`) +

      `<div class="panel" style="margin-top:16px">
         <div class="panel-head"><h2>返済・追加借入の記録</h2><span class="hint">直近40件</span></div>
         <div class="panel-body">
           ${moves.length ? `<div class="table-wrap"><table class="ledger">
             <thead><tr><th>日付</th><th>区分</th><th>借入先</th><th class="r">金額</th><th class="r">うち利息</th><th class="r">うち元金</th><th class="col-memo">メモ</th><th></th></tr></thead>
             <tbody>${moves.map(r => `<tr>
               <td class="r" style="text-align:left">${esc(r.date)}</td>
               <td>${r.kind === 'borrow'
                 ? '<span class="pill crit">借入</span>'
                 : '<span class="pill flat">返済</span>'}${historyOnly(r)
                 ? '<br><span class="pill warn" title="起算日より前なので、残高の計算には入りません">履歴のみ</span>' : ''}</td>
               <td>${esc(nameOf(r.debtId))}</td>
               <td class="r ${r.kind === 'borrow' ? 'amt-neg' : ''}">${r.kind === 'borrow' ? '+' : ''}${yen(r.amount)}</td>
               <td class="r" style="color:var(--ink-2)">${r.kind === 'borrow' || historyOnly(r) ? '—' : yen(r.interest)}</td>
               <td class="r">${r.kind === 'borrow' || historyOnly(r) ? '—' : yen(r.principal)}</td>
               <td class="col-memo" style="color:var(--ink-2)">${esc(r.memo || '')}</td>
               <td class="r"><button class="btn sm danger" data-act="${r.kind === 'borrow' ? 'del-borrow' : 'del-rep'}" data-id="${r.id}">取消</button></td>
             </tr>`).join('')}</tbody></table></div>`
             : `<p style="color:var(--ink-3);font-size:13px">まだ記録がありません。借入カードの「返済を記録」「追加で借りた」から登録してください。</p>`}
         </div>
       </div>`;
  };

  /* ---------- 収入・支出 ---------- */
  let cashMonth = thisMonth();

  V.cash = function () {
    const root = document.getElementById('view-cash');
    const s = monthSummary(cashMonth);
    const rows = state.txns.filter(t => monthKey(t.date) === cashMonth)
      .sort((a, b) => b.date.localeCompare(a.date));
    const cats = expenseByCategory(cashMonth);
    const repRows = state.repayments.filter(r => monthKey(r.date) === cashMonth);
    const carried = carriedInto(cashMonth);
    const nextKey = addMonthKey(cashMonth, 1);
    const nextS = monthSummary(nextKey);
    const committed = committedNext(cashMonth);
    const out = s.out;
    const nextOut = nextS.out;

    root.innerHTML =
      headHTML('収入・支出', '毎月の手取り収入と生活支出を記録します。返済は別集計なので二重に数えられません。カード払いは<b>口座から出ていく月</b>で数えるので、<b>収入 − 引落 − 返済 = 返済に回せる余力</b>が実態どおりになります。') +
      `<div class="toolbar">
         <button class="btn primary" data-act="add-income">${ICON.plus}収入を追加</button>
         <button class="btn" data-act="add-expense">${ICON.plus}支出を追加</button>
         <div class="spacer"></div>
         <div class="field" style="flex-direction:row;align-items:center;gap:8px">
           <label for="mSel" style="white-space:nowrap">対象月</label>
           <input type="month" id="mSel" value="${cashMonth}" style="width:auto">
         </div>
       </div>

       <div class="grid g-4">
         <div class="tile"><span class="tile-label">収入</span><span class="tile-value pos">${yen(s.income)}</span></div>
         <div class="tile"><span class="tile-label">生活支出（引落ベース）</span>
           <span class="tile-value">${yen(s.expensePaid)}</span>
           <span class="tile-delta">${carried > 0 ? `うち前月までの利用 ${compact(carried)}` : 'すべて当月の利用'}</span></div>
         <div class="tile"><span class="tile-label">返済（借入を差引）</span>
           <span class="tile-value ${s.repay < 0 ? 'neg' : ''}">${yen(s.repay)}</span>
           <span class="tile-delta">${s.borrow > 0
             ? `返済 ${compact(s.repayGross)} − 借入 ${compact(s.borrow)}`
             : `${repRows.length}件の記録`}</span></div>
         <div class="tile"><span class="tile-label">残り（貯蓄・繰上返済の余力）</span>
           <span class="tile-value ${s.net < 0 ? 'neg' : 'pos'}">${yen(s.net)}</span>
           ${committed > 0 ? `<span class="tile-delta">取り置き後 <b class="num">${yen(s.net - committed)}</b></span>` : ''}</div>
       </div>

       ${committed > 0 ? `
       <div class="callout ${s.net - committed < 0 ? 'crit' : 'warn'}" style="margin-top:16px">
         ${s.net - committed < 0 ? ICON.crit : ICON.warn}<div>
         来月の引落として <b>${yen(committed)}</b> が既に確定しています。
         手元にお金があっても、この分は取り置いてください。
         <b>今月まだ使ってよいのは ${yen(Math.max(0, s.net - committed))}</b> です。
         ${s.net - committed < 0
           ? `<br>このままだと来月の引落に <b>${yen(committed - s.net)}</b> 足りません。`
           : ''}
       </div></div>` : ''}

       ${s.deferred > 0 || nextS.expensePaid > 0 ? `
       <div class="callout info" style="margin-top:16px">${ICON.info}<div>
         この月に使った <b>${yen(s.expense)}</b> のうち <b>${yen(s.deferred)}</b> はカード払いで、
         口座から出ていくのは翌月以降です。
         <b>${nextKey.replace('-', '年')}月の引落予定は ${yen(nextS.expensePaid)}</b>（うちこの月の利用が ${yen(s.deferred)}）。
       </div></div>` : ''}

       <div class="grid g-2" style="margin-top:16px">
         <div class="panel">
           <div class="panel-head"><h2>支出の内訳</h2><span class="hint">${esc(cashMonth)}</span></div>
           <div class="panel-body"><div class="chart" id="ch-cat"></div></div>
         </div>
         <div class="panel">
           <div class="panel-head"><h2>収支の推移</h2><span class="hint">直近12ヶ月</span></div>
           <div class="panel-body"><div class="chart" id="ch-cash12"></div><div id="lg-cash12"></div></div>
         </div>
       </div>

       <div class="panel" style="margin-top:16px">
         <div class="panel-head"><h2>カードの引落</h2>
           <span class="hint">${esc(cashMonth)} に口座から出る分</span></div>
         <div class="panel-body">
           ${state.cards.length ? `<div class="table-wrap"><table class="ledger">
             <thead><tr><th>カード</th><th class="r">引落額</th><th>出どころ</th><th></th></tr></thead>
             <tbody>${out.rows.map(r => `<tr>
               <td>${esc(r.name)}</td>
               <td class="r">${yen(r.amount)}</td>
               <td>${r.billed
                 ? '<span class="pill ok">請求額を登録済み</span>'
                 : r.detail > 0
                   ? '<span class="pill warn">明細から推定</span>'
                   : '<span class="pill flat">なし</span>'}</td>
               <td class="r">
                 <button class="btn sm" data-act="card-bill" data-id="${r.id}">請求額</button>
                 <button class="btn sm" data-act="edit-card" data-id="${r.id}">編集</button>
               </td></tr>`).join('')}</tbody>
             ${out.orphan > 0 ? `<tfoot><tr><td>（削除したカードの明細）</td>
               <td class="r">${yen(out.orphan)}</td><td colspan="2"></td></tr></tfoot>` : ''}
           </table></div>`
           : `<p style="color:var(--ink-3);font-size:13px">カードを登録すると、請求額を月ごとに入れられます。明細を1件ずつ入れなくても取り置きが正しくなります。</p>`}
           <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
             <button class="btn" data-act="add-card">${ICON.plus}カードを追加</button>
           </div>
           ${out.rows.some(r => !r.billed && r.detail > 0) ? `
             <p class="note" style="margin-top:10px">請求額が未登録のカードは、入力済みの明細の合計で代用しています。実際の請求額を入れると正確になります。</p>` : ''}
           ${state.cards.length && nextOut.card > 0 ? `
             <div class="calc-note" style="margin-top:12px">
               <div><b>翌月（${nextKey.replace('-', '年')}月）の引落は ${yen(nextOut.card)}</b></div>
               ${nextOut.rows.filter(r => r.amount > 0).map(r =>
                 `<div style="color:var(--ink-2)">${esc(r.name)} ${yen(r.amount)}${r.billed ? '' : '（明細から推定）'}</div>`).join('')}
               <div style="color:var(--ink-3);margin-top:4px">対象月を ${nextKey.replace('-', '年')}月 に切り替えると、その月の請求額を登録できます。</div>
             </div>` : ''}
         </div>
       </div>

       <div class="panel" style="margin-top:16px">
         <div class="panel-head"><h2>${esc(cashMonth)} の明細</h2><span class="hint">${rows.length}件</span></div>
         <div class="panel-body">
           ${rows.length ? `<div class="table-wrap"><table class="ledger">
             <thead><tr><th>日付</th><th>区分</th><th>カテゴリ</th><th class="r">金額</th><th class="col-memo">メモ</th><th></th></tr></thead>
             <tbody>${rows.map(t => `<tr>
               <td>${esc(t.date)}</td>
               <td>${t.type === 'income'
                 ? '<span class="pill ok">収入</span>'
                 : payMonthOf(t) !== monthKey(t.date)
                   ? `<span class="pill warn" title="${esc(payMonthOf(t))} に口座から出ていきます">${esc(cardName(t.cardId) || 'カード')}</span>`
                   : '<span class="pill flat">支出</span>'}</td>
               <td>${esc(t.category)}</td>
               <td class="r ${t.type === 'income' ? 'amt-pos' : ''}">${t.type === 'income' ? '+' : '−'}${yen0(t.amount)}</td>
               <td class="col-memo" style="color:var(--ink-2)">${esc(t.memo || '')}</td>
               <td class="r"><button class="btn sm danger" data-act="del-txn" data-id="${t.id}">削除</button></td>
             </tr>`).join('')}</tbody>
             <tfoot><tr><td colspan="3">差引（返済前）</td>
               <td class="r ${s.income - s.expense < 0 ? 'amt-neg' : 'amt-pos'}">${yen(s.income - s.expense)}</td>
               <td colspan="2"></td></tr></tfoot></table></div>`
             : `<p style="color:var(--ink-3);font-size:13px">この月の記録はまだありません。</p>`}
         </div>
       </div>`;

    document.getElementById('mSel').addEventListener('change', e => {
      cashMonth = e.target.value || thisMonth();
      render();
    });

    const cc = document.getElementById('ch-cat');
    if (cats.length) {
      mountChart(cc, (c, w) => barsChart(c, w, { rows: cats, colorFn: (r, i) => SERIES(i) }));
    } else {
      cc.innerHTML = '<p style="color:var(--ink-3);font-size:13px;padding:24px 0">この月の支出記録がありません。</p>';
    }
    renderCashChart('ch-cash12', 'lg-cash12', null, 12);
  };

  /* ---------- 目標 ---------- */
  V.goals = function () {
    const root = document.getElementById('view-goals');
    const g = state.goals;
    const tb = totalBalance();
    const sumMin = totalMinPayment();
    const cap = avgCapacity(3);

    let targetBlock;
    if (!g.targetDate) {
      targetBlock = `<p style="color:var(--ink-3);font-size:13px">完済の目標日を設定すると、そこから逆算して毎月いくら返済すればよいかを計算します。</p>`;
    } else if (tb <= 0) {
      targetBlock = `<div class="callout info">${ICON.ok}<div>借入残高はゼロです。おめでとうございます。</div></div>`;
    } else {
      const tm = monthsBetween(thisMonth(), monthKey(g.targetDate));
      if (tm <= 0) {
        targetBlock = `<div class="callout warn">${ICON.warn}<div>目標日が過去または今月です。将来の日付を設定してください。</div></div>`;
      } else {
        const need = requiredBudget(tm);
        const gap = need == null ? null : need - (cap ?? 0);
        targetBlock = `
          <div class="grid g-3" style="gap:14px">
            <div class="tile"><span class="tile-label">目標までの期間</span><span class="tile-value">${durationText(tm)}</span>
              <span class="tile-delta">${esc(g.targetDate)} まで</span></div>
            <div class="tile"><span class="tile-label">必要な月々の返済額</span>
              <span class="tile-value">${need == null ? '—' : yen(need)}</span>
              <span class="tile-delta">雪だるま式で返済した場合</span></div>
            <div class="tile"><span class="tile-label">直近3ヶ月の平均余力</span>
              <span class="tile-value ${cap != null && need != null && cap < need ? 'neg' : 'pos'}">${cap == null ? '—' : yen(cap)}</span>
              <span class="tile-delta">収入 − 引落の平均</span></div>
          </div>
          ${need == null
            ? `<div class="callout crit" style="margin-top:13px">${ICON.crit}<div>この期間内に完済できる返済額が見つかりませんでした。目標日を先に延ばすか、借り換えで金利を下げることを検討してください。</div></div>`
            : cap == null
            ? `<div class="callout info" style="margin-top:13px">${ICON.info}<div>収入と支出を記録すると、必要な返済額 <b>${yen(need)}</b> に対して余力が足りているかを判定できます。</div></div>`
            : gap > 0
            ? (() => {
                const at = simulate(cap, PLAN).payoffMonths;
                const alt = at
                  ? `今の余力のままなら完済は <b>${fmtMonth(addMonths(new Date(), at))}</b> 頃です。目標日をそこまで延ばすか、支出を見直して返済に回す額を増やしてください。`
                  : `今の余力のままでは残高が減りません。支出の見直しか、金利の低い借入への借り換えを検討してください。`;
                return `<div class="callout warn" style="margin-top:13px">${ICON.warn}<div>目標達成には毎月 <b>${yen(need)}</b> が必要ですが、平均余力は <b>${yen(cap)}</b> で、<b>${yen(gap)}</b> 足りません。${alt}</div></div>`;
              })()
            : `<div class="callout info" style="margin-top:13px">${ICON.ok}<div>平均余力 <b>${yen(cap)}</b> は必要額 <b>${yen(need)}</b> を上回っています。この調子で毎月の返済を続ければ目標日に間に合います。</div></div>`}`;
      }
    }

    // 今月の返済目標の進捗
    const mSum = monthSummary(thisMonth());
    const mrepay = mSum.repay;
    const mNet = mSum.net;
    const hold = committedNext(thisMonth());
    const mgoal = g.monthlyRepay || 0;
    const mprog = mgoal > 0 ? (mrepay / mgoal) * 100 : 0;

    // 生活防衛資金
    const ef = g.emergency || 0, efc = g.emergencyCurrent || 0;
    const efprog = ef > 0 ? (efc / ef) * 100 : 0;

    root.innerHTML =
      headHTML('目標', '完済したい時期と、毎月の返済額の目標を決めます。目標から逆算した必要額と、いまの家計の余力を突き合わせて過不足を判定します。') +

      `<div class="panel">
         <div class="panel-head"><h2>目標の設定</h2>
           <button class="btn sm" data-act="edit-goals">編集</button></div>
         <div class="panel-body">
           <div class="grid g-3" style="gap:14px">
             <div class="field"><label>完済の目標日</label>
               <div class="num" style="font-size:15px">${g.targetDate ? esc(g.targetDate) : '<span style="color:var(--ink-3);font-family:var(--sans)">未設定</span>'}</div></div>
             <div class="field"><label>月々の返済目標</label>
               <div class="num" style="font-size:15px">${mgoal ? yen(mgoal) : '<span style="color:var(--ink-3);font-family:var(--sans)">未設定</span>'}</div>
               <span class="note">最低返済額の合計は ${yen(sumMin)}</span></div>
             <div class="field"><label>生活防衛資金の目標</label>
               <div class="num" style="font-size:15px">${ef ? yen(ef) : '<span style="color:var(--ink-3);font-family:var(--sans)">未設定</span>'}</div>
               <span class="note">現在 ${yen(efc)}</span></div>
           </div>
         </div>
       </div>

       <div class="panel" style="margin-top:16px">
         <div class="panel-head"><h2>完済目標からの逆算</h2></div>
         <div class="panel-body">${targetBlock}</div>
       </div>

       <div class="grid g-2" style="margin-top:16px">
         <div class="panel">
           <div class="panel-head"><h2>今月の返済目標</h2>
             <span class="hint">${esc(thisMonth())}・借入を差引</span></div>
           <div class="panel-body">
             ${mgoal > 0
              ? `<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:9px">
                   <span class="num" style="font-size:24px;font-family:var(--sans);font-weight:600">${yen(mrepay)}</span>
                   <span style="font-size:12.5px;color:var(--ink-2)">目標 <b class="num">${yen(mgoal)}</b>（${pct(clamp(mprog, 0, 999))}）</span>
                 </div>
                 <div class="meter ${mprog >= 100 ? 'is-good' : mprog >= 60 ? '' : 'is-warn'}"><i style="width:${clamp(mprog, 0, 100)}%"></i></div>
                 <p style="font-size:12.5px;color:var(--ink-2);margin-top:9px">${mprog >= 100
                   ? '今月の目標を達成しています。'
                   : 'あと <b class="num">' + yen(mgoal - mrepay) + '</b> で今月の目標に届きます。'}</p>
                 ${mSum.borrow > 0 ? `<p style="font-size:12px;color:var(--ink-3);margin-top:6px">
                   返済 ${yen(mSum.repayGross)} から、今月の追加借入 ${yen(mSum.borrow)} を差し引いた額です。</p>` : ''}
                 ${hold > 0 ? `<div class="callout ${mNet - hold < 0 ? 'crit' : 'warn'}" style="margin-top:11px">
                   ${mNet - hold < 0 ? ICON.crit : ICON.warn}<div>
                   来月の引落 <b>${yen(hold)}</b> が確定しています。返済に回す前に取り置いてください。
                   今月まだ動かせるのは <b>${yen(Math.max(0, mNet - hold))}</b> です。</div></div>` : ''}`
              : `<p style="color:var(--ink-3);font-size:13px">月々の返済目標を設定すると、達成度をここに表示します。</p>`}
           </div>
         </div>
         <div class="panel">
           <div class="panel-head"><h2>生活防衛資金</h2><span class="hint">返済と並行して確保する</span></div>
           <div class="panel-body">
             ${ef > 0
              ? `<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:9px">
                   <span class="num" style="font-size:24px;font-family:var(--sans);font-weight:600">${yen(efc)}</span>
                   <span style="font-size:12.5px;color:var(--ink-2)">目標 <b class="num">${yen(ef)}</b>（${pct(clamp(efprog, 0, 999))}）</span>
                 </div>
                 <div class="meter ${efprog >= 100 ? 'is-good' : ''}"><i style="width:${clamp(efprog, 0, 100)}%"></i></div>
                 <p style="font-size:12.5px;color:var(--ink-2);margin-top:9px">急な出費で新たな借入をしないための備えです。生活費の3〜6ヶ月分が一つの目安とされます。</p>`
              : `<p style="color:var(--ink-3);font-size:13px">目標額を設定すると、積立の進捗をここに表示します。</p>`}
           </div>
         </div>
       </div>`;
  };

  /* ---------- シミュレーション ---------- */
  let simExtra = null;   // 追加返済額（最低返済額に上乗せする分）

  function computeStrategies(budget) {
    return [
      { key: 'plan', name: '少額優先（雪だるま式）', color: SERIES(1), r: simulate(budget, 'snowball'),
        desc: '残高の小さい借入から完済する。この方式で完済予定日を計算しています。' },
      { key: 'minimum', name: '最低返済のみ', color: SERIES(2), r: simulate(0, 'minimum'),
        desc: '毎月の最低返済額だけを払い続けた場合の基準線。' },
      { key: 'reference', name: '高金利優先（雪崩式・参考）', color: SERIES(0), r: simulate(budget, 'avalanche'),
        desc: '金利の高い借入から返した場合。利息は少なく済むが、この家計では採用していない。' }
    ];
  }

  /** 並び順に依存せず取り出す。順番を変えて壊れたことがあるので位置では引かない。 */
  function pick(sts, key) {
    const found = sts.find(s => s.key === key);
    return found ? found.r : null;
  }

  function simCardsHTML(sts) {
    return sts.map(s => {
      const r = s.r, ok = r.payoffMonths != null;
      return `<div class="panel"><div class="panel-body" style="padding:16px 18px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
          <i class="swatch" style="background:${s.color};width:10px;height:10px"></i>
          <h3 style="font-size:13.5px">${esc(s.name)}</h3>
        </div>
        <div style="font-family:var(--sans);font-weight:600;letter-spacing:-.01em;margin:6px 0 1px;${ok ? 'font-size:23px' : 'color:var(--crit-text);font-size:17px'}">
          ${ok ? durationText(r.payoffMonths) : '完済しません'}
        </div>
        <div style="font-size:12.5px;color:var(--ink-2)">
          ${ok ? fmtMonth(addMonths(new Date(), r.payoffMonths)) + ' に完済' : '残高が減らない、または50年を超えます'}
        </div>
        <div style="margin-top:11px;padding-top:11px;border-top:1px solid var(--border);font-size:12.5px;color:var(--ink-2)">
          支払う利息の総額<br>
          <b class="num" style="color:${ok ? 'var(--ink)' : 'var(--crit-text)'};font-size:15px">${ok ? yen(r.totalInterest) : '—'}</b>
        </div>
        <p style="font-size:12px;color:var(--ink-3);margin-top:10px;line-height:1.55">${esc(s.desc)}</p>
      </div></div>`;
    }).join('');
  }

  function simCalloutHTML(sts) {
    const av = pick(sts, 'plan'), mn = pick(sts, 'minimum');
    if (av.payoffMonths == null) {
      return `<div class="callout crit">${ICON.crit}<div>この返済額では残高が減りません。最低返済額の合計を下回っていないか、金利が高すぎないかを確認してください。</div></div>`;
    }
    if (mn.payoffMonths == null) {
      return `<div class="callout info">${ICON.info}<div>最低返済額のままでは完済できませんが、この返済額なら <b>${durationText(av.payoffMonths)}</b> で完済できます。支払う利息は <b>${yen(av.totalInterest)}</b> です。</div></div>`;
    }
    const saved = mn.totalInterest - av.totalInterest;
    const faster = mn.payoffMonths - av.payoffMonths;
    if (saved <= 0 && faster <= 0) {
      return `<div class="callout info">${ICON.info}<div>上乗せ分がゼロのため、最低返済のみの場合と同じ結果になります。スライダーを動かすと効果が見えます。</div></div>`;
    }
    return `<div class="callout info">${ICON.info}<div>この返済額なら、最低返済のみの場合に比べて利息を <b>${yen(saved)}</b> 節約でき、完済が <b>${durationText(faster)}</b> 早まります。</div></div>`;
  }

  function simTableHTML(sts) {
    const mn = pick(sts, 'minimum');
    return `<div class="table-wrap"><table class="ledger">
      <thead><tr><th>戦略</th><th class="r">完済まで</th><th class="r">完済予定</th><th class="r">支払う利息</th><th class="r">最低返済のみとの差</th></tr></thead>
      <tbody>${sts.map(s => {
        const r = s.r, ok = r.payoffMonths != null;
        const diff = ok && mn.payoffMonths != null ? mn.totalInterest - r.totalInterest : null;
        return `<tr>
          <td><span style="display:inline-flex;align-items:center;gap:7px"><i class="swatch" style="background:${s.color}"></i>${esc(s.name)}</span></td>
          <td class="r">${ok ? durationText(r.payoffMonths) : '—'}</td>

          <td class="r">${ok ? yen(r.totalInterest) : '—'}</td>
          <td class="r ${diff > 0 ? 'amt-pos' : ''}">${diff == null ? '—' : (diff > 0 ? '−' + yen0(diff) : '0')}</td>
        </tr>`;
      }).join('')}</tbody></table></div>`;
  }

  function simOrderHTML(av) {
    return `<div class="table-wrap"><table class="ledger">
      <thead><tr><th>順</th><th>借入先</th><th class="r">残高</th><th class="r">年利</th><th class="r">完済まで</th><th class="r">完済予定</th></tr></thead>
      <tbody>${state.debts.filter(d => d.balance > 0.5)
        .map(d => ({ d, off: av.perDebt[d.id] ? av.perDebt[d.id].paidOff : null }))
        .sort((a, b) => (a.off == null ? 9999 : a.off) - (b.off == null ? 9999 : b.off))

          <td class="r" style="text-align:left">${i + 1}</td>

  function drawSimChart(sts) {
    const maxLen = Math.min(360, Math.max(...sts.map(s => s.r.months.length), 1));
    mountChart(document.getElementById('ch-sim'), (c, w) => multiLine(c, w, {
      height: 260, xLabel: '経過月数',
      series: sts.map(s => ({
        name: s.name, color: s.color, payoff: s.r.payoffMonths,
        points: s.r.months.slice(0, maxLen).map(m => m.balance)
      }))
    }));
  }

  V.sim = function () {
    const root = document.getElementById('view-sim');
    const sumMin = totalMinPayment();

    if (totalBalance() <= 0) {
      root.innerHTML = headHTML('シミュレーション', '<b>雪だるま式</b>（残高の小さい借入から完済する方式）で計算しています。毎月いくら返せるかで、完済時期と利息がどれだけ変わるかを試せます。') +
        `<div class="empty"><h3>比較する借入がありません</h3>
          <p>残高のある借入を登録すると、毎月の返済額を動かして完済時期を試せます。</p>
          <button class="btn primary" data-act="add-debt">${ICON.plus}借入を登録する</button></div>`;
      return;
    }

    if (simExtra == null) simExtra = Math.max(0, Math.round((plannedBudget() - sumMin) / 1000) * 1000);
    // 毎月の返済額の上限。上乗せではなく「合計でいくらまで試せるか」で決める。
    const BUDGET_CAP = 500000;
    const maxExtra = Math.max(10000, BUDGET_CAP - sumMin);
    simExtra = clamp(simExtra, 0, maxExtra);

    let sts = computeStrategies(sumMin + simExtra);

    root.innerHTML =
      headHTML('シミュレーション', '<b>雪だるま式</b>で計算しています。残高の小さい借入から順に完済していく方式です。スライダーで毎月の返済額を動かすと、完済時期と支払う利息がどう変わるか見られます。') +

      `<div class="panel">
         <div class="panel-head"><h2>毎月の返済額</h2>
           <span class="hint">最低返済額 ${yen(sumMin)} + 上乗せ分</span></div>
         <div class="panel-body">
           <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px">
             <span id="budgetVal" class="num" style="font-size:30px;font-family:var(--sans);font-weight:600">${yen(sumMin + simExtra)}</span>
             <span style="font-size:13px;color:var(--ink-2)">うち上乗せ <b class="num" id="extraVal">${yen(simExtra)}</b>／月</span>
           </div>
           <input type="range" id="extra" min="0" max="${maxExtra}" step="1000" value="${simExtra}"
             aria-label="毎月の上乗せ返済額">
           <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:2px">
             <span class="num">+0（${yen0(sumMin)}）</span>
             <span class="num">+${yen0(maxExtra)}（${yen0(sumMin + maxExtra)}）</span>
           </div>
           <div id="simCallout" style="margin-top:14px">${simCalloutHTML(sts)}</div>
         </div>
       </div>

       <div class="grid g-3" id="sim-cards" style="margin-top:16px">${simCardsHTML(sts)}</div>

       <div class="panel" style="margin-top:16px">
         <div class="panel-head"><h2>残高の推移を比較</h2><span class="hint">月ごとの残高合計</span></div>
         <div class="panel-body">
           <div class="chart" id="ch-sim"></div>
           ${legendHTML(sts.map(s => ({ name: s.name, color: s.color })))}
           <details class="tableview"><summary>数値で見る</summary><div id="sim-table">${simTableHTML(sts)}</div></details>
         </div>
       </div>

       <div class="panel" style="margin-top:16px">
         <div class="panel-head"><h2>高金利優先で返した場合の完済順</h2>
           <span class="hint">先に完済する借入から</span></div>
         <div class="panel-body" id="sim-order">${simOrderHTML(pick(sts, 'plan'))}</div>
       </div>`;

    drawSimChart(sts);

    // スライダー操作中はテキストと集計だけを差し替え、入力要素自体は作り直さない
    const slider = document.getElementById('extra');
    const refresh = withChart => {
      sts = computeStrategies(sumMin + simExtra);
      document.getElementById('budgetVal').textContent = yen(sumMin + simExtra);
      document.getElementById('extraVal').textContent = yen(simExtra);
      document.getElementById('simCallout').innerHTML = simCalloutHTML(sts);
      document.getElementById('sim-cards').innerHTML = simCardsHTML(sts);
      document.getElementById('sim-table').innerHTML = simTableHTML(sts);
      document.getElementById('sim-order').innerHTML = simOrderHTML(pick(sts, 'plan'));
      if (withChart) drawSimChart(sts);
    };
    slider.addEventListener('input', () => { simExtra = +slider.value; refresh(false); });
    slider.addEventListener('change', () => { simExtra = +slider.value; refresh(true); });
  };

  /* ---------- データ ---------- */
  const bytes = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB'
                   : n >= 1024 ? Math.round(n / 1024) + ' KB' : n + ' B';

  V.data = function () {

    root.innerHTML =

      `<div class="grid g-2">
         <div class="panel">
           <div class="panel-head"><h2>保存先</h2>

           <div class="panel-body">
             <div class="table-wrap"><table class="ledger">

                 <tr><td>借入</td><td class="r">${state.debts.length} 件</td></tr>
                 <tr><td>収入・支出</td><td class="r">${state.txns.length} 件</td></tr>
