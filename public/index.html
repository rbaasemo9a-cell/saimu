               <tbody>${rows('fixed').map(f => `<tr>
                 <td>${f.type === 'income'
                   ? '<span class="pill ok">収入</span>'

                 <td class="r" style="color:var(--ink-2)">${f.day ? f.day + '日' : '—'}</td>
                 <td>${esc(f.name || f.category)}</td>
                 <td class="r">${yen(f.amount)}</td>
                 <td class="col-memo" style="color:var(--ink-2)">${esc(f.memo || '')}</td>
                 <td class="r"><button class="btn sm" data-act="edit-fixed" data-id="${f.id}">編集</button></td>
               </tr>`).join('')}
               ${plan.repay > 0 ? `<tr>
                 <td><span class="pill flat">支出</span></td>
                 <td class="r" style="color:var(--ink-2)">—</td>
                 <td>毎月の返済 <span class="pill warn">借入から自動</span></td>
                 <td class="r">${yen(plan.repay)}</td>
                 <td class="col-memo" style="color:var(--ink-2)">${plan.fromGoal

                 <td class="r"><button class="btn sm" data-act="edit-goals">目標を編集</button></td>
               </tr>` : ''}</tbody></table></div>` : ''}

           </div>
           <p class="note" style="margin-top:10px">ここに入れた金額は計画のための数字です。実際の収支の記録にはなりません。<br>
             返済の行は借入の登録から自動で入ります。<b>固定の支出に返済を手で足さないでください</b>（二重に数えられます）。</p>
         </div>
       </div>

       <div class="panel" style="margin-top:16px">
         <div class="panel-head"><h2>今月の実績と計画</h2>

         <div class="panel-body">
           <div class="table-wrap"><table class="ledger">

             <tbody>${[
               ['収入', plan.income, mSum.income, 'more'],
               ['支出（引落）', plan.expense, mSum.expensePaid, 'less'],
               ['返済', plan.repay, mSum.repay, 'more']
             ].map(([label, want, got, good]) => {
               const diff = got - want;
               const bad = good === 'more' ? diff < 0 : diff > 0;
               return `<tr>
                 <td>${label}</td>
                 <td class="r" style="color:var(--ink-3)">${plan.has ? yen(want) : '—'}</td>
                 <td class="r">${yen(got)}</td>
                 <td class="r ${plan.has && bad ? 'amt-neg' : 'amt-pos'}">${plan.has
                   ? (diff >= 0 ? '+' : '') + yen(diff) : '—'}</td>
               </tr>`;
             }).join('')}</tbody>
             <tfoot><tr>
               <td>残り</td>

             ${mgoal > 0
              ? `<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:9px">

                   ? '今月の目標を達成しています。'
                   : 'あと <b class="num">' + yen(mgoal - mrepay) + '</b> で今月の目標に届きます。'}</p>
                 ${mSum.borrow > 0 ? `<p style="font-size:12px;color:var(--ink-3);margin-top:6px">
                   返済 ${yen(mSum.repayGross)} から、今月の追加借入 ${yen(mSum.borrow)} を差し引いた額です。</p>` : ''}
                 ${hold > 0 ? `<div class="callout ${mNet - hold < 0 ? 'crit' : 'warn'}" style="margin-top:11px">
                   ${mNet - hold < 0 ? ICON.crit : ICON.warn}<div>
                   来月の引落 <b>${yen(hold)}</b> が確定しています。返済に回す前に取り置いてください。
                   今月まだ動かせるのは <b>${yen(Math.max(0, mNet - hold))}</b> です。</div></div>` : ''}`
              : `<p style="color:var(--ink-3);font-size:13px">月々の返済目標を設定すると、達成度をここに表示します。</p>`}
           </div>
         </div>
         <div class="panel">
           <div class="panel-head"><h2>生活防衛資金</h2><span class="hint">返済と並行して確保する</span></div>

             ${ef > 0
              ? `<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:9px">
                   <span class="num" style="font-size:24px;font-family:var(--sans);font-weight:600">${yen(efc)}</span>
                   <span style="font-size:12.5px;color:var(--ink-2)">目標 <b class="num">${yen(ef)}</b>（${pct(clamp(efprog, 0, 999))}）</span>
                 </div>
                 <div class="meter ${efprog >= 100 ? 'is-good' : ''}"><i style="width:${clamp(efprog, 0, 100)}%"></i></div>
                 <p style="font-size:12.5px;color:var(--ink-2);margin-top:9px">急な出費で新たな借入をしないための備えです。生活費の3〜6ヶ月分が一つの目安とされます。</p>`
              : `<p style="color:var(--ink-3);font-size:13px">目標額を設定すると、積立の進捗をここに表示します。</p>`}
           </div>
         </div>
       </div>`;
  };

  /* ---------- ふるさと納税 ---------- */

  /** 内訳表の1行。ラベル・金額・注記。 */

    const auto = inp.auto;

    const years = [thisYear, thisYear - 1, thisYear - 2];
    const left = Math.max(0, r.limit - auto.donated);

    // 年の途中なら、記録もまだ途中までしかない
    const partial = taxYear === thisYear && auto.months > 0 && auto.months < 12;
    const paceNote = partial
      ? `いまは${auto.months}ヶ月ぶんの記録です。このペースなら事業所得は年間で約
         ${yen((auto.bizIncome - auto.bizCost) / auto.months * 12)} になります。`
      : '';

      verdict = `<div class="callout warn">${ICON.warn}<div>この内容だと住民税の所得割が出ません。
        ふるさと納税をしても差し引く税金が無いので、寄付した額がそのまま自己負担になります。
        ${auto.txnCount === 0
          ? `${taxYear}年の収入と支出をまだ記録していません。記録するか、<b>編集</b>から直接入れてください。`
          : '所得より控除の方が大きくなっています。<b>編集</b>から内容を確かめてください。'}</div></div>`;

      verdict = `<div class="callout warn">${ICON.warn}<div>寄付できる額が総所得の30%で頭打ちになりました。
        これを超えるぶんは住民税から差し引けません。</div></div>`;
    } else {
      verdict = `<div class="callout info">${ICON.ok}<div>${yen(r.safe)}までにしておくと、
        年末に収入が増えても自己負担が2,000円で収まりやすくなります。${paceNote}</div></div>`;
    }

    const cats = costByCategory(taxYear);
    const costTotal = cats.reduce((a, c) => a + c.counted, 0);

    root.innerHTML =
      headHTML('ふるさと納税',
        '収入と経費と控除から、自己負担が2,000円で収まる寄付額の上限を計算します。' +
        '住民税の所得割額の20%までしか特例分を使えない、という決まりから逆算しています。') +

      `<div class="panel">

       <div class="grid g-2" style="margin-top:16px">

           <div class="panel-body">
             <div class="table-wrap"><table class="ledger">
               <tbody>
                 ${taxRow('事業の売上', yen(r.bizRev),

             <li>令和7年(2025年)の改正を織り込んでいます。給与所得控除の最低保障 65万円、所得税の基礎控除の上乗せ。</li>
             <li>生命保険料控除などは所得税と住民税で上限が違いますが、ここでは同じ額として扱います。
                 住民税の控除を多めに見るぶん、上限は控えめに出ます。出しすぎるより安全な側です。</li>

  /* ---------- シミュレーション ---------- */
  let simExtra = null;   // 追加返済額（最低返済額に上乗せする分）

  function computeStrategies(budget) {
    return [
      { key: 'plan', name: '少額優先（雪だるま式）', color: SERIES(1), r: simulate(budget, 'snowball'),
        desc: '残高の小さい借入から完済する。この方式で完済予定日を計算しています。' },
      { key: 'minimum', name: '最低返済のみ', color: SERIES(2), r: simulate(0, 'minimum'),
        desc: '毎月の最低返済額だけを払い続けた場合の基準線。' },
      { key: 'reference', name: '高金利優先（雪崩式・参考）', color: SERIES(0), r: simulate(budget, 'avalanche'),
        desc: '金利の高い借入から返した場合。利息は少なく済むが、この家計では採用していない。' }
    ];
  }

  /** 並び順に依存せず取り出す。順番を変えて壊れたことがあるので位置では引かない。 */
  function pick(sts, key) {
    const found = sts.find(s => s.key === key);
    return found ? found.r : null;
  }

  function simCardsHTML(sts) {
    return sts.map(s => {
      const r = s.r, ok = r.payoffMonths != null;
      return `<div class="panel"><div class="panel-body" style="padding:16px 18px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
          <i class="swatch" style="background:${s.color};width:10px;height:10px"></i>
          <h3 style="font-size:13.5px">${esc(s.name)}</h3>
        </div>
        <div style="font-family:var(--sans);font-weight:600;letter-spacing:-.01em;margin:6px 0 1px;${ok ? 'font-size:23px' : 'color:var(--crit-text);font-size:17px'}">
          ${ok ? durationText(r.payoffMonths) : '完済しません'}
        </div>
        <div style="font-size:12.5px;color:var(--ink-2)">
          ${ok ? fmtMonth(addMonths(new Date(), r.payoffMonths)) + ' に完済' : '残高が減らない、または50年を超えます'}
        </div>
        <div style="margin-top:11px;padding-top:11px;border-top:1px solid var(--border);font-size:12.5px;color:var(--ink-2)">
          支払う利息の総額<br>
          <b class="num" style="color:${ok ? 'var(--ink)' : 'var(--crit-text)'};font-size:15px">${ok ? yen(r.totalInterest) : '—'}</b>
        </div>
        <p style="font-size:12px;color:var(--ink-3);margin-top:10px;line-height:1.55">${esc(s.desc)}</p>
      </div></div>`;
    }).join('');
  }

  function simCalloutHTML(sts) {
    const av = pick(sts, 'plan'), mn = pick(sts, 'minimum');
    if (av.payoffMonths == null) {
      return `<div class="callout crit">${ICON.crit}<div>この返済額では残高が減りません。最低返済額の合計を下回っていないか、金利が高すぎないかを確認してください。</div></div>`;
    }
    if (mn.payoffMonths == null) {
      return `<div class="callout info">${ICON.info}<div>最低返済額のままでは完済できませんが、この返済額なら <b>${durationText(av.payoffMonths)}</b> で完済できます。支払う利息は <b>${yen(av.totalInterest)}</b> です。</div></div>`;
    }
    const saved = mn.totalInterest - av.totalInterest;
    const faster = mn.payoffMonths - av.payoffMonths;
    if (saved <= 0 && faster <= 0) {
      return `<div class="callout info">${ICON.info}<div>上乗せ分がゼロのため、最低返済のみの場合と同じ結果になります。スライダーを動かすと効果が見えます。</div></div>`;
    }
    return `<div class="callout info">${ICON.info}<div>この返済額なら、最低返済のみの場合に比べて利息を <b>${yen(saved)}</b> 節約でき、完済が <b>${durationText(faster)}</b> 早まります。</div></div>`;
  }

  function simTableHTML(sts) {
    const mn = pick(sts, 'minimum');
    return `<div class="table-wrap"><table class="ledger">
      <thead><tr><th>戦略</th><th class="r">完済まで</th><th class="r">完済予定</th><th class="r">支払う利息</th><th class="r">最低返済のみとの差</th></tr></thead>
      <tbody>${sts.map(s => {
        const r = s.r, ok = r.payoffMonths != null;
        const diff = ok && mn.payoffMonths != null ? mn.totalInterest - r.totalInterest : null;
        return `<tr>
          <td><span style="display:inline-flex;align-items:center;gap:7px"><i class="swatch" style="background:${s.color}"></i>${esc(s.name)}</span></td>
          <td class="r">${ok ? durationText(r.payoffMonths) : '—'}</td>
          <td class="r">${ok ? fmtMonth(addMonths(new Date(), r.payoffMonths)) : '—'}</td>
          <td class="r">${ok ? yen(r.totalInterest) : '—'}</td>
          <td class="r ${diff > 0 ? 'amt-pos' : ''}">${diff == null ? '—' : (diff > 0 ? '−' + yen0(diff) : '0')}</td>
        </tr>`;
      }).join('')}</tbody></table></div>`;
  }

  function simOrderHTML(av) {
    return `<div class="table-wrap"><table class="ledger">
      <thead><tr><th>順</th><th>借入先</th><th class="r">残高</th><th class="r">年利</th><th class="r">完済まで</th><th class="r">完済予定</th></tr></thead>
      <tbody>${state.debts.filter(d => d.balance > 0.5)
        .map(d => ({ d, off: av.perDebt[d.id] ? av.perDebt[d.id].paidOff : null }))
        .sort((a, b) => (a.off == null ? 9999 : a.off) - (b.off == null ? 9999 : b.off))
        .map((x, i) => `<tr>
          <td class="r" style="text-align:left">${i + 1}</td>
          <td>${esc(x.d.name)}</td>
          <td class="r">${yen(x.d.balance)}</td>
          <td class="r">${x.d.rate}%</td>
          <td class="r">${x.off ? durationText(x.off) : '—'}</td>
          <td class="r">${x.off ? fmtMonth(addMonths(new Date(), x.off)) : '—'}</td>
        </tr>`).join('')}</tbody></table></div>`;
  }

  function drawSimChart(sts) {
    const maxLen = Math.min(360, Math.max(...sts.map(s => s.r.months.length), 1));
    mountChart(document.getElementById('ch-sim'), (c, w) => multiLine(c, w, {
      height: 260, xLabel: '経過月数',
      series: sts.map(s => ({
        name: s.name, color: s.color, payoff: s.r.payoffMonths,
        points: s.r.months.slice(0, maxLen).map(m => m.balance)
      }))
    }));
  }

  V.sim = function () {
    const root = document.getElementById('view-sim');
    const sumMin = totalMinPayment();

    if (totalBalance() <= 0) {
      root.innerHTML = headHTML('シミュレーション', '<b>雪だるま式</b>（残高の小さい借入から完済する方式）で計算しています。毎月いくら返せるかで、完済時期と利息がどれだけ変わるかを試せます。') +
        `<div class="empty"><h3>比較する借入がありません</h3>
          <p>残高のある借入を登録すると、毎月の返済額を動かして完済時期を試せます。</p>
          <button class="btn primary" data-act="add-debt">${ICON.plus}借入を登録する</button></div>`;
      return;
    }

    if (simExtra == null) simExtra = Math.max(0, Math.round((plannedBudget() - sumMin) / 1000) * 1000);
    // 毎月の返済額の上限。上乗せではなく「合計でいくらまで試せるか」で決める。
    const BUDGET_CAP = 500000;
    const maxExtra = Math.max(10000, BUDGET_CAP - sumMin);
    simExtra = clamp(simExtra, 0, maxExtra);

    let sts = computeStrategies(sumMin + simExtra);

    root.innerHTML =
      headHTML('シミュレーション', '<b>雪だるま式</b>で計算しています。残高の小さい借入から順に完済していく方式です。スライダーで毎月の返済額を動かすと、完済時期と支払う利息がどう変わるか見られます。') +

      `<div class="panel">
         <div class="panel-head"><h2>毎月の返済額</h2>
           <span class="hint">最低返済額 ${yen(sumMin)} + 上乗せ分</span></div>
         <div class="panel-body">
           <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px">
             <span id="budgetVal" class="num" style="font-size:30px;font-family:var(--sans);font-weight:600">${yen(sumMin + simExtra)}</span>
             <span style="font-size:13px;color:var(--ink-2)">うち上乗せ <b class="num" id="extraVal">${yen(simExtra)}</b>／月</span>
           </div>
           <input type="range" id="extra" min="0" max="${maxExtra}" step="1000" value="${simExtra}"
             aria-label="毎月の上乗せ返済額">
           <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:2px">
             <span class="num">+0（${yen0(sumMin)}）</span>
             <span class="num">+${yen0(maxExtra)}（${yen0(sumMin + maxExtra)}）</span>
           </div>
           <div id="simCallout" style="margin-top:14px">${simCalloutHTML(sts)}</div>
         </div>
       </div>

       <div class="grid g-3" id="sim-cards" style="margin-top:16px">${simCardsHTML(sts)}</div>

       <div class="panel" style="margin-top:16px">
         <div class="panel-head"><h2>残高の推移を比較</h2><span class="hint">月ごとの残高合計</span></div>
         <div class="panel-body">
           <div class="chart" id="ch-sim"></div>
           ${legendHTML(sts.map(s => ({ name: s.name, color: s.color })))}
           <details class="tableview"><summary>数値で見る</summary><div id="sim-table">${simTableHTML(sts)}</div></details>
         </div>
       </div>

       <div class="panel" style="margin-top:16px">
         <div class="panel-head"><h2>高金利優先で返した場合の完済順</h2>
           <span class="hint">先に完済する借入から</span></div>
         <div class="panel-body" id="sim-order">${simOrderHTML(pick(sts, 'plan'))}</div>
       </div>`;

    drawSimChart(sts);

    // スライダー操作中はテキストと集計だけを差し替え、入力要素自体は作り直さない
    const slider = document.getElementById('extra');
    const refresh = withChart => {
      sts = computeStrategies(sumMin + simExtra);
      document.getElementById('budgetVal').textContent = yen(sumMin + simExtra);
      document.getElementById('extraVal').textContent = yen(simExtra);
      document.getElementById('simCallout').innerHTML = simCalloutHTML(sts);
      document.getElementById('sim-cards').innerHTML = simCardsHTML(sts);
      document.getElementById('sim-table').innerHTML = simTableHTML(sts);
      document.getElementById('sim-order').innerHTML = simOrderHTML(pick(sts, 'plan'));
      if (withChart) drawSimChart(sts);
    };
    slider.addEventListener('input', () => { simExtra = +slider.value; refresh(false); });
    slider.addEventListener('change', () => { simExtra = +slider.value; refresh(true); });
  };

  /* ---------- データ ---------- */
  const bytes = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB'
                   : n >= 1024 ? Math.round(n / 1024) + ' KB' : n + ' B';

  V.data = function () {
    const root = document.getElementById('view-data');
    const n = state.debts.length + state.txns.length + state.repayments.length;

    root.innerHTML =
      headHTML('データ', 'このアプリの記録は、お使いのパソコン上の <b>SQLite データベースファイル</b>に保存されます。外部には一切送信されません。サーバーは 127.0.0.1 でのみ待ち受けているので、同じネットワークの他の端末からも接続できません。') +

      `<div class="grid g-2">
         <div class="panel">
           <div class="panel-head"><h2>データベース</h2>
             ${online ? '<span class="pill ok">接続中</span>' : '<span class="pill crit">未接続</span>'}</div>
           <div class="panel-body">
             <div class="table-wrap"><table class="ledger">
               <tbody>
                 <tr><td>借入</td><td class="r">${state.debts.length} 件</td></tr>
                 <tr><td>収入・支出</td><td class="r">${state.txns.length} 件</td></tr>
                 <tr><td>返済の記録</td><td class="r">${state.repayments.length} 件</td></tr>
                 <tr><td>ファイルの大きさ</td><td class="r">${dbStats ? bytes(dbStats.size) : '—'}</td></tr>
               </tbody></table></div>
             ${dbStats ? `<div class="field" style="margin-top:13px">
               <label>保存先</label>
               <div class="num" style="font-size:11.5px;word-break:break-all;color:var(--ink-2)">${esc(dbStats.path)}</div>
             </div>` : ''}
             <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:16px">
               <button class="btn" data-act="sample">サンプルデータを読み込む</button>
               <button class="btn danger" data-act="wipe" ${n ? '' : 'disabled'}>すべて削除</button>
             </div>
           </div>
         </div>

         <div class="panel">
           <div class="panel-head"><h2>バックアップ</h2></div>
           <div class="panel-body">
             <p style="font-size:13px;color:var(--ink-2);margin-bottom:11px">
               <b>データベースの複製</b>は <code style="font-family:var(--mono);font-size:12px">VACUUM INTO</code> で作ります。単なるファイルのコピーと違い、書き込み途中の中途半端な状態を掴むことがありません。</p>
             <button class="btn primary" data-act="backup">データベースを複製する</button>
             ${dbStats ? `<div class="note" style="font-size:11.5px;color:var(--ink-3);margin-top:6px;word-break:break-all">保存先： ${esc(dbStats.backupDir)}</div>` : ''}

             <p style="font-size:13px;color:var(--ink-2);margin:18px 0 11px;padding-top:16px;border-top:1px solid var(--border)">
               <b>JSON で書き出す</b>と、他のツールでも読める形になります。</p>
             <div style="display:flex;gap:9px;flex-wrap:wrap">
               <button class="btn" data-act="export">JSON に書き出す</button>
               <button class="btn" data-act="copy">クリップボードにコピー</button>
             </div>
             <div class="field" style="margin-top:16px">
               <label for="impFile">JSON バックアップを読み込む</label>
               <input type="file" id="impFile" accept="application/json,.json">
               <span class="note">読み込むと、現在のデータはすべて置き換わります。</span>
             </div>
           </div>
         </div>
       </div>

       <div class="panel" style="margin-top:16px">
         <div class="panel-head"><h2>計算の前提</h2></div>
         <div class="panel-body">
           <ul style="margin:0;padding-left:20px;font-size:13px;color:var(--ink-2);line-height:1.85">
             <li>利息は<b>日割り</b>で計算します。<b>元金 × 年利 ÷ 365日 × 経過日数</b>。うるう年も 365 日として扱います。</li>
             <li>利息が付くのは<b>元金だけ</b>です。払いきれずに残った未払利息が、それ自身でさらに利息を生むことはありません。</li>
             <li>返済を記録すると、起算日から返済日までの利息を積んだうえで、返済額を<b>まず利息に、残りを元金に</b>充当します。この計算と残高の更新は<b>一つのトランザクション</b>で行うため、片方だけが反映されることはありません。</li>
             <li>実際の約定日・遅延損害金・借入先ごとの端数処理は考慮していません。</li>
             <li>シミュレーションは、毎月の返済額が一定で、新たな借入がないことを前提としています。</li>
             <li>50年（600ヶ月）以内に完済しない場合、または残高が減らない場合は「完済しません」と表示します。</li>
             <li>実際の契約条件は借入先の返済予定表が優先されます。ここでの数字は計画を立てるための目安として使ってください。</li>
           </ul>
         </div>
       </div>`;

    const f = document.getElementById('impFile');
    f.addEventListener('change', () => {
      const file = f.files && f.files[0];
      if (!file) return;
      const rd = new FileReader();
      rd.onload = async () => {
        let p = null;
        try {
          p = JSON.parse(rd.result);
          if (!p || !Array.isArray(p.debts)) throw new Error();
        } catch (e) {
          toast('読み込めませんでした。JSON ファイルを確認してください。');
          f.value = '';
          return;
        }
        simExtra = null;
        await commit('/import', 'POST', p, 'バックアップを読み込みました');
        const f2 = document.getElementById('impFile');
        if (f2) f2.value = '';
      };
      rd.readAsText(file);
    });
  };

  /* ==========================================================
     7. ダイアログ（フォーム）
     ========================================================== */
  const dlg = document.getElementById('dlg');
  const dlgForm = document.getElementById('dlgForm');
  let onSubmit = null;

  function openDialog({ title, lede, body, ok, onOk, onOpen }) {
    document.getElementById('dlgTitle').textContent = title;
    document.getElementById('dlgLede').textContent = lede || '';
    document.getElementById('dlgBody').innerHTML = body;
    // フッターは使い回しなので、前のダイアログが足したボタンを必ず取り除く
    document.querySelectorAll('.dlg-foot [data-injected]').forEach(el => el.remove());
    document.getElementById('dlgOk').textContent = ok || '保存';
    onSubmit = onOk;
    dlg.showModal();
    if (onOpen) onOpen();
    const first = dlg.querySelector('input,select,textarea');
    if (first) first.focus();
  }

  document.getElementById('dlgCancel').addEventListener('click', () => dlg.close('cancel'));

  dlgForm.addEventListener('submit', ev => {
    const v = ev.submitter ? ev.submitter.value : 'ok';
    if (v !== 'ok') return;
    if (onSubmit) {
      const res = onSubmit(new FormData(dlgForm));
      if (res === false) { ev.preventDefault(); return; }
    }
  });
  // ここで onSubmit を消してはいけない。close は非同期に発火するので、
  // 「閉じてすぐ次を開く」と、遅れて届いた close が次の画面の処理を消してしまう。
  // 実際それで保存が黙って失われていた。開くたびに上書きするので後始末は不要。

  const numOf = (fd, k) => {
    const v = parseFloat(String(fd.get(k) || '').replace(/[^\d.\-]/g, ''));
    return isFinite(v) ? v : 0;
  };

  function debtForm(d) {
    return `<div class="form-grid">
      <div class="field full"><label for="f-name">借入先の名前</label>
        <input type="text" id="f-name" name="name" required maxlength="40" placeholder="例：〇〇カードローン" value="${d ? esc(d.name) : ''}"></div>
      <div class="field"><label for="f-prin">元金（円）</label>
        <input type="number" id="f-prin" name="principal" required min="0" step="1" value="${d ? Math.round(d.principal) : ''}">
        <span class="note">利息が付く対象</span></div>
      <div class="field"><label for="f-int">未払いの利息（円）</label>
        <input type="number" id="f-int" name="interestAccrued" min="0" step="1" value="${d ? Math.round(d.interestToday) : 0}">
        <span class="note">無ければ 0</span></div>
      <div class="field full"><label for="f-acc">利息計算の起算日</label>
        <input type="date" id="f-acc" name="accruedAt" required value="${todayISO()}">
        <span class="note">翌日から日割りで利息が付きます</span></div>
      <div class="field"><label for="f-rate">年利（%）</label>
        <input type="number" id="f-rate" name="rate" required min="0" max="100" step="0.01" value="${d ? d.rate : ''}"></div>
      <div class="field"><label for="f-init">当初の借入額（円）</label>
        <input type="number" id="f-init" name="initial" min="0" step="1" value="${d ? Math.round(d.initial || d.balance) : ''}">
        <span class="note">進捗率に使用</span></div>
      <div class="field"><label for="f-min">毎月の最低返済額（円）</label>
        <input type="number" id="f-min" name="minPayment" required min="0" step="1" value="${d ? Math.round(d.minPayment) : ''}"></div>
      <div class="full"><div class="calc-note" id="f-calc"></div></div>
    </div>`;
  }

  /** 元金・未払利息・年利の入力から、合計残高とこれから付く利息を出しておく。 */
  function debtFormPreview() {
    const get = id => Math.max(0, +document.getElementById(id).value || 0);
    const calc = document.getElementById('f-calc');
    const upd = () => {
      const prin = get('f-prin'), int = get('f-int'), rate = get('f-rate');
      const day = interestFor(prin, rate, 1);
      const mon = monthlyInterest({ principal: prin, rate });
      calc.innerHTML =
        `<div>合計残高 <b>${yen(prin + int)}</b>（元金 ${yen(prin)} ＋ 未払利息 ${yen(int)}）</div>
         <div>利息 <b>${yen(day)}</b>／日・<b>${yen(mon)}</b>／月
           <span style="color:var(--ink-3)">（元金 × ${rate}% ÷ ${DAY_BASIS}日）</span></div>`;
    };
    ['f-prin', 'f-int', 'f-rate'].forEach(id =>
      document.getElementById(id).addEventListener('input', upd));
    upd();
  }

  const debtPayload = fd => ({
    name: String(fd.get('name') || '').trim(),
    principal: numOf(fd, 'principal'),
    interestAccrued: numOf(fd, 'interestAccrued'),
    accruedAt: String(fd.get('accruedAt') || todayISO()),
    initial: numOf(fd, 'initial'),
    rate: numOf(fd, 'rate'),
    minPayment: numOf(fd, 'minPayment')
  });

  function addDebt() {
    openDialog({
      title: '借入を追加',
      lede: '返済予定表の数字を入れてください。以降の利息は日割りで自動計算されます。',
      body: debtForm(null),
      onOpen: debtFormPreview,
      onOk: fd => {
        const p = debtPayload(fd);
        if (!p.name) return false;
        simExtra = null;
        commit('/debts', 'POST', p, '借入を登録しました');
      }
    });
  }

  function editDebt(id) {
    const d = state.debts.find(x => x.id === id);
    if (!d) return;
    openDialog({
      title: '借入を編集',
      lede: d.name + '　未払利息と起算日は今日時点にそろえてあります',
      body: debtForm(d),
      onOpen: debtFormPreview,
      onOk: fd => {
        const p = debtPayload(fd);
        if (!p.name) return false;
        simExtra = null;
        commit('/debts/' + d.id, 'PUT', p, '借入を更新しました');
      }
    });
  }

  function payDialog(id) {
    const d = state.debts.find(x => x.id === id);
    if (!d) return;
    openDialog({
      title: '返済を記録',
      lede: `${d.name}（元金 ${yen(d.principal)} ＋ 未払利息 ${yen(d.interestToday)} ＝ ${yen(d.balance)}）`,
      ok: '記録する',
      body: `<div class="form-grid">
        <div class="field wide-sm"><label for="p-date">返済日</label>
          <input type="date" id="p-date" name="date" required value="${todayISO()}"></div>
        <div class="field"><label for="p-amt">返済額（円）</label>
          <input type="number" id="p-amt" name="amount" required min="1" step="1" value="${Math.round(d.minPayment)}"></div>
        <div class="field full"><label for="p-memo">メモ</label>
          <input type="text" id="p-memo" name="memo" maxlength="60" placeholder="任意"></div>
        <div class="full"><div class="calc-note" id="p-calc"></div></div>
      </div>`,
      onOpen: () => {
        const amtEl = document.getElementById('p-amt');
        const dateEl = document.getElementById('p-date');
        const calc = document.getElementById('p-calc');
        const upd = () => {
          // サーバーと同じ順序で試算する：日割りで利息を積む → 利息へ充当 → 残りを元金へ。
          const picked = dateEl.value || todayISO();
          if (d.originDate && picked < d.originDate) {
            calc.innerHTML =
              `<div style="color:var(--warn-text,var(--ink))"><b>${esc(d.originDate)} より前の日付です。</b></div>
               <div>記録は残りますが、<b>残高の計算には入りません</b>。この借入は
                 ${esc(d.originDate)} 時点の残高として登録されていて、
                 それより前の返済はその残高に既に含まれているためです。</div>
               <div style="color:var(--ink-3);margin-top:4px">残高にも反映したいときは、借入を編集して
                 起算日と元金を、その時点の値に直してください。</div>`;
            return;
          }
          const days = daysApart(new Date(d.accruedAt + 'T00:00:00'),
                                 new Date(picked + 'T00:00:00'));
          const int = d.interestAccrued + interestFor(d.principal, d.rate, days);
          const a = Math.max(0, +amtEl.value || 0);
          const toInterest = Math.min(a, int);
          const toPrincipal = Math.min(a - toInterest, d.principal);
          const over = a - toInterest - toPrincipal;
          calc.innerHTML =
            `<div>${esc(d.accruedAt)} から <b>${days}日</b>分の利息 <b>${yen(interestFor(d.principal, d.rate, days))}</b>
                  <span style="color:var(--ink-3)">（元金 ${yen0(d.principal)} × ${d.rate}% ÷ ${DAY_BASIS}日 × ${days}日）</span></div>
             <div>未払利息の合計 <b>${yen(int)}</b></div>
             <div style="margin-top:4px">うち利息への充当 <b>${yen(toInterest)}</b></div>
             <div>うち元金への充当 <b>${yen(toPrincipal)}</b></div>
             <div>返済後の残高 <b>${yen(d.principal - toPrincipal + int - toInterest)}</b></div>
             ${a > 0 && a <= int
               ? `<div style="color:var(--crit-text);margin-top:4px">返済額が利息以下のため、元金は1円も減りません。</div>` : ''}
             ${over > 0.5
               ? `<div style="color:var(--ink-3);margin-top:4px">完済に必要なのは ${yen(int + d.principal)} です。超過分 ${yen(over)} は充当されません。</div>` : ''}`;
        };
        amtEl.addEventListener('input', upd);
        dateEl.addEventListener('change', upd);
        upd();
      },
      onOk: fd => {
        const amount = numOf(fd, 'amount');
        if (amount <= 0) return false;
        // 利息と元金の内訳はサーバー側で返済日までの日割り利息から計算し、
        // 残高の更新と同じトランザクションに入れる。
        commit('/repayments', 'POST', {
          debtId: d.id,
          date: String(fd.get('date') || todayISO()),
          amount,
          memo: String(fd.get('memo') || '').trim()
        }, '返済を記録しました');
      }
    });
  }

  function borrowDialog(id) {
    const d = state.debts.find(x => x.id === id);
    if (!d) return;
    openDialog({
      title: '追加で借りた', ok: '記録する',
      lede: `${d.name}（元金 ${yen(d.principal)}）　カードローンなどで、返済しながらまた借りたとき`,
      body: `<div class="form-grid">
        <div class="field wide-sm"><label for="w-date">借りた日</label>
          <input type="date" id="w-date" name="date" required value="${todayISO()}"></div>
        <div class="field"><label for="w-amt">借りた金額（円）</label>
          <input type="number" id="w-amt" name="amount" required min="1" step="1" placeholder="0"></div>
        <div class="field full"><label for="w-memo">メモ</label>
          <input type="text" id="w-memo" name="memo" maxlength="60" placeholder="任意"></div>
        <div class="full"><div class="calc-note" id="w-calc"></div></div>
      </div>`,
      onOpen: () => {
        const amtEl = document.getElementById('w-amt');
        const calc = document.getElementById('w-calc');
        const upd = () => {
          const a = Math.max(0, +amtEl.value || 0);
          calc.innerHTML =
            `<div>借入後の元金 <b>${yen(d.principal + a)}</b></div>
             <div>利息 <b>${yen(interestFor(d.principal + a, d.rate, 1))}</b>／日
               <span style="color:var(--ink-3)">（いまは ${yen(interestFor(d.principal, d.rate, 1))}／日）</span></div>
             <div style="color:var(--ink-3);margin-top:4px">当初の借入額にも足され、返済済みの割合はその分下がります。</div>`;
        };
        amtEl.addEventListener('input', upd);
        upd();
      },
      onOk: fd => {
        const amount = numOf(fd, 'amount');
        if (amount <= 0) return false;
        simExtra = null;
        commit('/borrows', 'POST', {
          debtId: d.id,
          date: String(fd.get('date') || todayISO()),
          amount,
          memo: String(fd.get('memo') || '').trim()
        }, '追加借入を記録しました');
      }
    });
  }

  /**
   * 支払い方法の選択値をほどく。'' なら現金・口座、'card:<id>' ならカード払い。
   * カードは翌月引落なので、そのまま何ヶ月ずらすかも一緒に返す。
   */
  function payVia(v) {
    if (!String(v || '').startsWith('card:')) return { offset: 0, cardId: '' };
    return { offset: 1, cardId: String(v).slice(5) };
  }

  function txnDialog(type) {
    const cats = type === 'income' ? INCOME_CATS : EXPENSE_CATS;
    const label = type === 'income' ? '収入' : '支出';
    openDialog({
      title: label + 'を追加',
      lede: type === 'income' ? '手取り額（実際に受け取った金額）を入力してください。' : '借入の返済は「借入・返済」画面で記録します。',
      ok: '追加',
      body: `<div class="form-grid">
        <div class="field wide-sm"><label for="t-date">日付</label>
          <input type="date" id="t-date" name="date" required value="${todayISO()}"></div>
        <div class="field"><label for="t-amt">金額（円）</label>
          <input type="number" id="t-amt" name="amount" required min="1" step="1" placeholder="0"></div>
        <div class="field"><label for="t-cat">カテゴリ</label>
          <select id="t-cat" name="category">${cats.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
        <div class="field"><label for="t-memo">メモ</label>
          <input type="text" id="t-memo" name="memo" maxlength="60" placeholder="任意"></div>
        ${type === 'expense' ? `
        <div class="field full"><label for="t-pay">支払い方法</label>
          <select id="t-pay" name="payVia">
            <option value="">現金・口座引落・デビット（今月）</option>
            ${rows('cards').length
              ? `<optgroup label="カード（翌月引落）">
                   ${rows('cards').map(c => `<option value="card:${esc(c.id)}">${esc(c.name)}</option>`).join('')}
                   <option value="card:">その他のカード</option>
                 </optgroup>`
              : `<option value="card:">クレジットカード（翌月引落）</option>`}
          </select>
          <span class="note" id="t-paynote"></span></div>
        <div class="field full"><label for="t-cost">経費にする割合</label>
          <select id="t-cost" name="costRate">
            ${COST_RATES.map(v => `<option value="${v}">${v === 0 ? '経費にしない' : v + '%'}</option>`).join('')}
          </select>
          <span class="note">ふるさと納税の上限を出すときに、事業の売上から差し引きます</span></div>` : ''}
      </div>`,
      onOpen: type === 'expense' ? () => {
        const dateEl = document.getElementById('t-date');
        const payEl = document.getElementById('t-pay');
        const note = document.getElementById('t-paynote');
        const upd = () => {
          const via = payVia(payEl.value);
          const m = addMonthKey(monthKey(dateEl.value || todayISO()), via.offset);
          // 請求額を登録しているカードなら、この明細は内訳であって二重に数えない
          const billed = via.cardId &&
            rows('cardBills').some(b => b.cardId === via.cardId && b.payMonth === m);
          note.textContent = m.replace('-', '年') + '月に口座から出ていきます' +
            (billed ? '。請求額を登録済みなので内訳として扱います' : '');
        };
        dateEl.addEventListener('change', upd);
        payEl.addEventListener('change', upd);
        upd();
      } : undefined,
      onOk: fd => {
        const amount = numOf(fd, 'amount');
        if (amount <= 0) return false;
        const date = String(fd.get('date') || todayISO());
        cashMonth = monthKey(date);
        const via = payVia(String(fd.get('payVia') || ''));
        commit('/txns', 'POST', {
          type, date, amount,
          category: String(fd.get('category') || 'その他'),
          memo: String(fd.get('memo') || '').trim(),
          payMonth: addMonthKey(monthKey(date), via.offset),
          cardId: via.cardId,
          costRate: numOf(fd, 'costRate')
        }, label + 'を追加しました');
      }
    });
  }

  function cardDialog(id) {

    openDialog({
      title: c ? 'カードを編集' : 'カードを追加',
      lede: c ? '' : '請求額を月ごとに登録できるようになります。',
      body: `<div class="form-grid">
        <div class="field full"><label for="c-name">カードの名前</label>

      body: `<div class="form-grid">
        <div class="field full"><label for="x-name">項目名</label>
          <input type="text" id="x-name" name="name" required maxlength="40" list="x-cats"
                 placeholder="${kind === 'income' ? '例：給与（本業）' : '例：家賃、楽天モバイル'}"
                 value="${f ? esc(f.name || f.category) : ''}">
          <datalist id="x-cats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>
        <div class="field"><label for="x-day">毎月の日付</label>

        <div class="field"><label for="x-amt">金額（円）</label>
          <input type="number" id="x-amt" name="amount" required min="1" step="1"
                 value="${f ? Math.round(f.amount) : ''}" placeholder="0"></div>
        <div class="field full"><label for="x-memo">メモ</label>
          <input type="text" id="x-memo" name="memo" maxlength="60" placeholder="任意"
                 value="${f ? esc(f.memo) : ''}"></div>
      </div>`,
      onOpen: f ? () => {
        const foot = document.querySelector('.dlg-foot');
        if (!foot) return;
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'btn danger'; b.textContent = '削除';
        b.dataset.injected = '1';
        b.addEventListener('click', () => {
          dlg.close('cancel');
          commit('/fixed/' + f.id, 'DELETE', undefined, '削除しました');
        });
        foot.insertBefore(b, foot.firstChild);
      } : undefined,
      onOk: fd => {
        const amount = numOf(fd, 'amount');
        if (amount <= 0) return false;
        const name = String(fd.get('name') || '').trim();
        if (!name) return false;
        const body = {
          type: kind, name, amount,
          day: numOf(fd, 'day'),
          memo: String(fd.get('memo') || '').trim()
        };
        if (f) commit('/fixed/' + f.id, 'PUT', body, '更新しました');
        else commit('/fixed', 'POST', body, label + 'を追加しました');
      }
    });
  }

  function taxDialog(year) {
    const inp = taxInput(year);
    const auto = inp.auto;
    // 背の低い端末では .note を畳んで高さを稼ぐ作りなので、
    // 「空欄なら記録からいくら入るか」はラベル側に書く。注記は補足に留める。
    const fld = (id, name, label, value, note) =>
      `<div class="field"><label for="${id}">${label}</label>
         <input type="number" id="${id}" name="${name}" min="0" step="1" inputmode="numeric"
                value="${value > 0 ? Math.round(value) : ''}" placeholder="0">
         ${note ? `<span class="note">${note}</span>` : ''}</div>`;
    const auf = (id, name, label, value, fallback) =>
      fld(id, name, `${label}<span style="color:var(--ink-3);font-weight:400">（空欄で ${yen(fallback)}）</span>`,
          value, '記録から集計した額です');

    openDialog({
      title: year + '年の申告内容',
      lede: '空欄のままにすると、記録から集計した数字を使います。',
      ok: '保存',
      body: `<div class="form-grid">
        ${auf('x-biz', 'bizIncome', '事業の売上', inp.saved.bizIncome, auto.bizIncome)}
        ${auf('x-cost', 'bizCost', '経費', inp.saved.bizCost, auto.bizCost)}
        <div class="field"><label for="x-blue">青色申告特別控除</label>
          <select id="x-blue" name="blue">
            ${BLUE_AMOUNTS.map(([v, label]) =>
              `<option value="${v}"${inp.blue === v ? ' selected' : ''}>${label}</option>`).join('')}
          </select>
          <span class="note">複式簿記＋e-Taxなら65万、書面なら55万、簡易簿記は10万</span></div>
        ${auf('x-soc', 'social', '社会保険料控除', inp.saved.social, auto.social)}
        <div class="field full"><label for="x-levy">住民税の所得割額</label>
          <input type="number" id="x-levy" name="levy" min="0" step="1" inputmode="numeric"
                 value="${inp.levy > 0 ? Math.round(inp.levy) : ''}" placeholder="決定通知書に載っている額">
          <span class="note">入れると上の項目より優先され、一番正確になります</span></div>
        <details class="tableview full"><summary>給与・その他の控除</summary>
          <div class="form-grid" style="margin-top:10px">
            ${fld('x-sal', 'salary', '給与の年収（額面）', inp.salary,
                  '源泉徴収票の「支払金額」。入れると給与・賞与の記録は売上から外します')}
            ${fld('x-life', 'lifeIns', '生命保険料控除', inp.lifeIns, '最大12万円')}
            ${fld('x-ide', 'ideco', 'iDeCo・小規模企業共済', inp.ideco, '掛金の全額')}
            ${fld('x-med', 'medical', '医療費控除', inp.medical, '10万円を超えた分')}
            ${fld('x-fam', 'family', '配偶者・扶養の控除', inp.family, '合計額')}
            ${fld('x-oth', 'otherDed', 'その他の所得控除', inp.otherDed, '寡婦・障害者控除など')}
          </div>
        </details>
      </div>`,
      onOpen: () => {
        // 中に入力済みの数字があるなら、隠したままでは気づけない
        const d = document.querySelector('#dlgBody details');
        if (d && ['salary', 'lifeIns', 'ideco', 'medical', 'family', 'otherDed']
              .some(k => inp[k] > 0)) d.open = true;
      },
      onOk: fd => {
        const body = { year };
        ['salary', 'social', 'bizIncome', 'bizCost', 'blue', 'lifeIns', 'ideco',
         'medical', 'family', 'otherDed', 'levy'].forEach(k => { body[k] = numOf(fd, k); });
        commit('/tax', 'POST', body, year + '年の内容を保存しました');
      }
    });
  }

  function goalsDialog() {
    const g = state.goals;
    openDialog({
      title: '目標を編集', lede: '未入力の項目は「未設定」として扱われます。',
      body: `<div class="form-grid">
        <div class="field wide-sm"><label for="g-date">完済の目標日</label>
          <input type="date" id="g-date" name="targetDate" value="${esc(g.targetDate || '')}"></div>
        <div class="field"><label for="g-rep">月々の返済目標（円）</label>
          <input type="number" id="g-rep" name="monthlyRepay" min="0" step="1000" value="${g.monthlyRepay || ''}">
          <span class="note">最低返済額 ${yen(totalMinPayment())} を含む総額で入れてください</span></div>
        <div class="field"><label for="g-ef">生活防衛資金の目標（円）</label>
          <input type="number" id="g-ef" name="emergency" min="0" step="10000" value="${g.emergency || ''}"></div>
        <div class="field"><label for="g-efc">生活防衛資金の現在額（円）</label>
          <input type="number" id="g-efc" name="emergencyCurrent" min="0" step="1000" value="${g.emergencyCurrent || ''}"></div>
      </div>`,
      onOk: fd => {
        simExtra = null;
        commit('/goals', 'PUT', {
          targetDate: String(fd.get('targetDate') || ''),
          monthlyRepay: numOf(fd, 'monthlyRepay'),
          emergency: numOf(fd, 'emergency'),
          emergencyCurrent: numOf(fd, 'emergencyCurrent')
        }, '目標を更新しました');
      }
    });
  }

  function confirmDialog(title, lede, onYes, okLabel) {
    openDialog({
      title, lede, ok: okLabel || '削除する',
      body: '<p style="font-size:13px;color:var(--ink-2)">この操作は元に戻せません。</p>',
      onOk: () => { onYes(); }
    });
    const ok = document.getElementById('dlgOk');
    ok.classList.remove('primary'); ok.classList.add('danger');
    dlg.addEventListener('close', function restore() {
      ok.classList.add('primary'); ok.classList.remove('danger');
      dlg.removeEventListener('close', restore);
    });
  }

  /* ==========================================================
     8. データの書き出し・サンプル
     ========================================================== */
  function exportData() {
    // サーバーが Content-Disposition を付けて返すので、ブラウザがそのまま保存する
    location.href = '/api/export';
  }

  /** SQLite の VACUUM INTO で DB ファイルそのものの複製を backups/ に作る */
  async function makeBackup() {
    try {
      const r = await api('/backup', 'POST');
      try { dbStats = await api('/stats'); } catch (e) {}
      render();
      toast('バックアップを作成しました（' + Math.max(1, Math.round(r.size / 1024)) + ' KB）');
    } catch (e) {
      toast(e.message);
    }
  }

  async function copyData() {
    const json = JSON.stringify(state, null, 2);
    try {
      await navigator.clipboard.writeText(json);
      toast('クリップボードにコピーしました');
    } catch (e) {
      openDialog({
        title: 'バックアップ', lede: '下のテキストをすべて選択してコピーし、ファイルとして保存してください。',
        ok: '閉じる',
        body: `<textarea readonly style="min-height:200px" id="bkText">${esc(json)}</textarea>`,
        onOpen: () => { const t = document.getElementById('bkText'); t.focus(); t.select(); },
        onOk: () => {}
      });
    }
  }

  /* ==========================================================
     9. イベント配線と初期化
     ========================================================== */
  document.addEventListener('click', ev => {
    const nav = ev.target.closest('.nav-item');
    if (nav) {
      currentView = nav.dataset.view;
      document.querySelectorAll('.nav-item').forEach(b =>
        b.setAttribute('aria-current', b === nav ? 'page' : 'false'));
      document.querySelectorAll('.view').forEach(v =>
        v.classList.toggle('is-active', v.dataset.view === currentView));
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
      return;
    }

    const btn = ev.target.closest('[data-act]');
    if (!btn) return;
    const id = btn.dataset.id;

    switch (btn.dataset.act) {
      case 'add-debt':   addDebt(); break;
      case 'edit-debt':  editDebt(id); break;
      case 'pay':        payDialog(id); break;
      case 'add-income': txnDialog('income'); break;
      case 'add-expense':txnDialog('expense'); break;
      case 'add-card':   cardDialog(null); break;
      case 'add-fixed-income':  fixedDialog('income'); break;
      case 'add-fixed-expense': fixedDialog('expense'); break;
      case 'edit-fixed':        fixedDialog(null, id); break;
      case 'edit-card':  cardDialog(id); break;
      case 'card-bill':  cardBillDialog(id); break;
      case 'borrow':     borrowDialog(id); break;
      case 'edit-goals': goalsDialog(); break;
      case 'edit-tax':   taxDialog(taxYear); break;
      case 'export':     exportData(); break;
      case 'copy':       copyData(); break;
      case 'backup':     makeBackup(); break;
      case 'sample':
        simExtra = null; cashMonth = thisMonth();
        commit('/sample', 'POST', undefined, 'サンプルデータを読み込みました');
        break;

      case 'del-debt': {
        const d = state.debts.find(x => x.id === id);
        if (!d) break;
        confirmDialog('借入を削除', `「${d.name}」と、この借入に紐づく返済の記録をすべて削除します。`, () => {
          simExtra = null;
          commit('/debts/' + id, 'DELETE', undefined, '借入を削除しました');
        });
        break;
      }
      case 'del-borrow': {
        const b = state.borrows.find(x => x.id === id);
        if (!b) break;
        confirmDialog('追加借入を取り消す',
          `${b.date} の ${yen(b.amount)} の借入を取り消し、残高と当初借入額を元に戻します。`,
          () => { simExtra = null; commit('/borrows/' + id, 'DELETE', undefined, '追加借入を取り消しました'); });
        break;
      }
      case 'del-rep': {
        const r = state.repayments.find(x => x.id === id);
        if (!r) break;
        confirmDialog('返済の記録を取り消す',
          `${r.date} の ${yen(r.amount)} を取り消し、元金充当分 ${yen(r.principal)} を残高に戻します。`,
          () => commit('/repayments/' + id, 'DELETE', undefined, '返済の記録を取り消しました'),
          '取り消す');
        break;
      }
      case 'del-txn':
        commit('/txns/' + id, 'DELETE', undefined, '削除しました');
        break;

      case 'wipe':
        confirmDialog('すべて削除', '借入・収支・返済の記録と目標を、すべて消去します。', () => {
          simExtra = null; cashMonth = thisMonth();
          commit('/wipe', 'POST', undefined, 'すべて削除しました');
        });
        break;
    }
  });

  boot();
})();
</script>
</body>
</html>
