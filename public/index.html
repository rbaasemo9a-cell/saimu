<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>返済ロードマップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ============================================================
   TOKENS — light is the bare :root; dark redefined in both scopes
   ============================================================ */
:root {
  color-scheme: light;
  --bg:          #eef0f4;
  --surface:     #fafbfc;
  --surface-2:   #f2f4f7;
  --surface-3:   #e8ebf1;
  --border:      #dde1e8;
  --border-2:    #c6cdda;
  --ink:         #131720;
  --ink-2:       #545d6b;
  --ink-3:       #838d9c;
  --accent:      #2b4a8f;
  --accent-2:    #3f63b4;
  --accent-ink:  #ffffff;
  --accent-soft: #e3e9f6;
  --good:        #0ca30c;
  --good-text:   #006300;
  --good-soft:   #e2f3e2;
  --warn:        #fab219;
  --warn-text:   #855400;
  --warn-soft:   #fdf1d9;
  --crit:        #d03b3b;
  --crit-text:   #a72a2a;
  --crit-soft:   #fae5e5;
  --grid:        #e3e6ec;
  --axis:        #c6cdda;
  --shadow:      0 1px 2px rgba(19,23,32,.05), 0 8px 24px -14px rgba(19,23,32,.22);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;

  --sans: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
  --disp: "Zen Kaku Gothic New", "IBM Plex Sans JP", "Hiragino Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:          #0d1016;
    --surface:     #171b23;
    --surface-2:   #1e232d;
    --surface-3:   #262c38;
    --border:      #2a3140;
    --border-2:    #3a4354;
    --ink:         #eef1f6;
    --ink-2:       #a4aebd;
    --ink-3:       #7b8696;
    --accent:      #7b9bea;
    --accent-2:    #99b4f4;
    --accent-ink:  #0d1016;
    --accent-soft: #1d2740;
    --good:        #0ca30c;
    --good-text:   #3fc93f;
    --good-soft:   #143014;
    --warn:        #fab219;
    --warn-text:   #f5bb44;
    --warn-soft:   #33280d;
    --crit:        #d03b3b;
    --crit-text:   #ef7c7c;
    --crit-soft:   #331717;
    --grid:        #242a35;
    --axis:        #333c4b;
    --shadow:      0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.8);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:          #0d1016;
  --surface:     #171b23;
  --surface-2:   #1e232d;
  --surface-3:   #262c38;
  --border:      #2a3140;
  --border-2:    #3a4354;
  --ink:         #eef1f6;
  --ink-2:       #a4aebd;
  --ink-3:       #7b8696;
  --accent:      #7b9bea;
  --accent-2:    #99b4f4;
  --accent-ink:  #0d1016;
  --accent-soft: #1d2740;
  --good:        #0ca30c;
  --good-text:   #3fc93f;
  --good-soft:   #143014;
  --warn:        #fab219;
  --warn-text:   #f5bb44;
  --warn-soft:   #33280d;
  --crit:        #d03b3b;
  --crit-text:   #ef7c7c;
  --crit-soft:   #331717;
  --grid:        #242a35;
  --axis:        #333c4b;
  --shadow:      0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.8);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
}

/* ============================================================
   BASE
   ============================================================ */
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { font-family: var(--disp); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.3; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ============================================================
   SHELL
   ============================================================ */
.app { display: grid; grid-template-columns: 232px minmax(0,1fr); min-height: 100vh; }

.rail {
  border-right: 1px solid var(--border);
  background: var(--surface);
  padding: 22px 14px;
  display: flex; flex-direction: column; gap: 26px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.brand-mark {
  font-family: var(--disp); font-weight: 900; font-size: 17px;
  letter-spacing: .01em; color: var(--ink);
}
.brand-sub { font-size: 11px; color: var(--ink-3); letter-spacing: .09em; text-transform: uppercase; }

.rail-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 10px; border-radius: var(--r);
  background: none; border: 0; cursor: pointer;
  color: var(--ink-2); font-size: 13.5px; font-weight: 500;
  text-align: left; width: 100%; transition: background .13s, color .13s;
}
.nav-item svg { width: 17px; height: 17px; flex: none; stroke-width: 1.7; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 8px; }
.saved-note { font-size: 11px; color: var(--ink-3); line-height: 1.5; }

.main { padding: 34px 40px 72px; max-width: 1240px; }
.view { display: none; }
.view.is-active { display: block; }

.view-head { margin-bottom: 24px; }
.view-head h1 { font-size: 25px; font-weight: 900; letter-spacing: -.01em; }
.view-head .lede { color: var(--ink-2); font-size: 13.5px; margin-top: 4px; max-width: 62ch; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail {
    position: static; height: auto; flex-direction: row; align-items: center;
    border-right: 0; border-bottom: 1px solid var(--border);
    padding: 12px 16px; gap: 16px; overflow-x: auto;
  }
  .brand { flex: none; }
  .brand-sub { display: none; }
  .rail-nav { flex-direction: row; gap: 4px; }
  .nav-item { padding: 7px 11px; white-space: nowrap; }
  .nav-item span { display: none; }
  .nav-item[aria-current="page"] span { display: inline; }
  .rail-foot { display: none; }
  .main { padding: 22px 18px 64px; }
}

/* ============================================================
   PANELS / CARDS
   ============================================================ */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
}
.panel-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 14px; padding: 16px 18px 0;
}
.panel-head h2 { font-size: 14.5px; font-weight: 700; }
.panel-head .hint { font-size: 12px; color: var(--ink-3); }
.panel-body { padding: 14px 18px 18px; }

.grid { display: grid; gap: 16px; }
.g-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
@media (max-width: 1080px) { .g-4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 820px)  { .g-2, .g-3 { grid-template-columns: 1fr; } .g-4 { grid-template-columns: repeat(2,minmax(0,1fr)); } }

/* ---- roadmap band (the dashboard hero) ---- */
.roadmap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  display: grid; grid-template-columns: 320px minmax(0,1fr);
  overflow: hidden; box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.roadmap-figure {
  padding: 22px 24px; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; justify-content: center; gap: 3px;
}
.roadmap-label {
  font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 600;
}
.hero-figure {
  font-family: var(--sans); font-weight: 600; font-size: 40px;
  line-height: 1.12; letter-spacing: -.02em; color: var(--ink);
}
.hero-figure.is-muted { font-size: 27px; color: var(--ink-2); }
.roadmap-sub { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.roadmap-chart { position: relative; min-height: 190px; display: flex; align-items: flex-end; }
.roadmap-chart > svg { width: 100%; }
@media (max-width: 820px) {
  .roadmap { grid-template-columns: 1fr; }
  .roadmap-figure { border-right: 0; border-bottom: 1px solid var(--border); }
}

/* ---- stat tiles ---- */
.tile {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 14px 16px;
  display: flex; flex-direction: column; gap: 2px;
}
.tile-label { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }
.tile-value { font-family: var(--sans); font-weight: 600; font-size: 22px; letter-spacing: -.01em; line-height: 1.25; }
.tile-value.neg { color: var(--crit-text); }
.tile-value.pos { color: var(--good-text); }
.tile-delta { font-size: 11.5px; color: var(--ink-2); }

/* ---- meter ---- */
.meter { height: 7px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.meter.is-good > i { background: var(--good); }
.meter.is-warn > i { background: var(--warn); }
.meter.is-crit > i { background: var(--crit); }

/* ---- pills ---- */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600; padding: 2px 8px;
  border-radius: 20px; border: 1px solid transparent; white-space: nowrap;
}
.pill svg { width: 12px; height: 12px; flex: none; }
.pill.ok   { background: var(--good-soft); color: var(--good-text); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
.pill.warn { background: var(--warn-soft); color: var(--warn-text); border-color: color-mix(in srgb, var(--warn) 34%, transparent); }
.pill.crit { background: var(--crit-soft); color: var(--crit-text); border-color: color-mix(in srgb, var(--crit) 34%, transparent); }
.pill.flat { background: var(--surface-2); color: var(--ink-2); border-color: var(--border); }

/* ============================================================
   CONTROLS
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  padding: 8px 14px; border-radius: var(--r);
  border: 1px solid var(--border-2); background: var(--surface);
  color: var(--ink); font-size: 13px; font-weight: 500; cursor: pointer;
  transition: background .13s, border-color .13s;
}
.btn svg { width: 15px; height: 15px; flex: none; stroke-width: 1.8; }
.btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.danger { color: var(--crit-text); border-color: color-mix(in srgb, var(--crit) 40%, transparent); }
.btn.danger:hover { background: var(--crit-soft); }
.btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field > label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field .note { font-size: 11.5px; color: var(--ink-3); }
input[type="text"], input[type="number"], input[type="date"], input[type="month"], select, textarea {
  font: inherit; width: 100%;
  padding: 8px 10px; border-radius: 5px;
  border: 1px solid var(--border-2); background: var(--surface);
  color: var(--ink);
}
input[type="number"] { font-family: var(--mono); font-variant-numeric: tabular-nums; }
textarea { resize: vertical; min-height: 62px; font-family: var(--mono); font-size: 12px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 13px; }
/* 既定の min-width:auto だと、日付欄のように最小幅を持つ部品が枠を押し広げ、
   隣の欄に被る。縮めるようにして、はみ出しの元を断つ。 */
.form-grid > * { min-width: 0; }
.form-grid input, .form-grid select, .form-grid textarea {
  min-width: 0; max-width: 100%; box-sizing: border-box;
}
.form-grid .full { grid-column: 1 / -1; }
/* 狭い画面でも2列のままにする。1列にすると縦に伸びて小さい端末で収まらない。
   横に置けない項目だけ .full を付けて全幅にする。 */
@media (max-width: 620px) {
  .form-grid { gap: 10px 9px; }
  /* 日付欄は端末によって幅が大きく変わる（iOS Safari は特に横に長い）。
     半分の幅に押し込めず隣に被るので、狭い画面では1行を占有させる。 */
  .form-grid .wide-sm { grid-column: 1 / -1; }
}

/* ============================================================
   MOBILE — 普段使いはスマホ。親指の届く下部タブと、詰まらない余白。
   ============================================================ */
@media (max-width: 700px) {
  /* 内容が列を押し広げないようにする。横スクロールの元凶を断つ。 */
  .app { grid-template-columns: minmax(0, 1fr); }
  .main { padding: 16px 14px calc(78px + env(safe-area-inset-bottom)); }
  .main, .view, .panel, .debt-card, .tile { min-width: 0; }

  /* --- ナビを下部タブへ --- */
  .rail {
    position: fixed; inset: auto 0 0 0; z-index: 30;
    flex-direction: column; gap: 0; height: auto; overflow: visible;
    padding: 0 0 env(safe-area-inset-bottom);
    border-bottom: 0; border-top: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: saturate(1.6) blur(12px);
  }
  .brand { display: none; }
  .rail-foot { display: none; }
  .rail-nav {
    flex-direction: row; gap: 0;
    justify-content: space-around; align-items: stretch; width: 100%;
  }
  .nav-item {
    flex: 1 1 0; min-width: 0;
    flex-direction: column; gap: 3px;
    padding: 8px 2px 7px; border-radius: 0;
    font-size: 10px; line-height: 1.2; text-align: center;
    justify-content: center;
  }
  .nav-item svg { width: 21px; height: 21px; }
  /* 下部タブでは全項目の名前を出す。現在地だけ見えても迷う。 */
  /* 元の名前は長すぎて省略されるので、タブ用の短い名前に差し替える */
  .nav-item span { display: inline !important; font-size: 0; white-space: nowrap; }
  .nav-item span::after { font-size: 10.5px; letter-spacing: .01em; }
  .nav-item[data-view="dash"]  span::after { content: "ホーム"; }
  .nav-item[data-view="debts"] span::after { content: "借入"; }
  .nav-item[data-view="cash"]  span::after { content: "収支"; }
  .nav-item[data-view="goals"] span::after { content: "目標"; }
  .nav-item[data-view="tax"]   span::after { content: "ふるさと"; }
  .nav-item[data-view="sim"]   span::after { content: "試算"; }
  .nav-item[data-view="data"]  span::after { content: "データ"; }
  .nav-item[aria-current="page"] { background: none; color: var(--accent); font-weight: 700; }
  .nav-item[aria-current="page"] svg { stroke-width: 2.2; }

  /* --- 見出しと余白を締める --- */
  .view-head { margin-bottom: 16px; }
  .view-head h1 { font-size: 21px; }
  .view-head .lede { font-size: 12.5px; }
  .grid { gap: 12px; }
  .panel-head { padding: 14px 14px 0; }
  .panel-body { padding: 12px 14px 14px; }

  /* --- 数字は詰めて2列に収める --- */
  .g-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .tile { padding: 12px 12px; }
  .tile-value { font-size: 19px; }
  .tile-delta, .tile-label { overflow-wrap: anywhere; }

  /* --- ダッシュボードの主役 --- */
  .hero-figure { font-size: 31px; }
  .hero-figure.is-muted { font-size: 21px; }
  .roadmap-figure { padding: 16px 16px; }
  .roadmap-chart { min-height: 150px; }

  /* --- 借入カード --- */
  .debt-card { padding: 14px; }
  .debt-top { flex-wrap: wrap; gap: 8px; }
  .debt-bal { font-size: 24px; }
  .debt-meta { gap: 4px 12px; font-size: 11.5px; }
  .debt-actions { gap: 8px; }
  .debt-actions .btn { flex: 1 1 auto; justify-content: center; }

  /* --- 表は文字単位で折り返さず、枠の中で横スクロールさせる --- */
  /* 文字単位の折り返しをやめ、枠の中だけを横に滑らせる。
     右端固定はやめた — 金額の上に「取消」が重なって読めなくなるため。 */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .ledger th, .ledger td { white-space: nowrap; }
  .col-memo { display: none; }

  /* --- 指で押せる大きさに --- */
  .btn { min-height: 40px; padding: 9px 14px; }
  .btn.sm { min-height: 40px; padding: 8px 12px; font-size: 12.5px; }
  .toolbar { gap: 8px; }
  .toolbar .spacer { flex-basis: 100%; height: 0; }

  /* --- 入力欄。16px 未満だと iOS が勝手に拡大する --- */
  input, select, textarea { font-size: 16px !important; min-height: 42px; }
  .field .note { font-size: 11px; }

  /* --- 背の低い端末でも入力欄が画面に収まるように詰める --- */
  @media (max-height: 700px) {
    .dlg-head { padding: 12px 16px 0; }
    .dlg-head h3 { font-size: 15px; }
    .dlg-head p { font-size: 11.5px; line-height: 1.5; }
    .dlg-body { padding: 11px 16px; }
    .dlg-foot { padding: 10px 16px; }
    .form-grid { gap: 8px 9px; }
    .field > label { font-size: 11.5px; }
    .field .note { font-size: 10.5px; line-height: 1.45; }
    input, select, textarea { min-height: 38px !important; }
    .calc-note { font-size: 11px; line-height: 1.55; }
    /* 補足はラベルを読めば分かる範囲なので、背が低い端末では畳んで高さを稼ぐ。
       これを出したままだと借入フォームが画面に収まらない。 */
    .dlg-body .field .note { display: none; }
  }

  /* --- ダイアログは下から出るシートに --- */
  /* 要素は <dialog id="dlg">。class="dlg" は無いので id で当てる。
     ここを .dlg と書いていて、この節がまるごと効いていなかった。 */
  #dlg {
    margin: auto auto 0; width: 100%; max-width: none;
    border-radius: 16px 16px 0 0;
    max-height: 96vh; max-height: 96dvh; padding-bottom: env(safe-area-inset-bottom);
  }
  /* display は開いているときだけ指定する。#dlg に直接書くと、ブラウザ標準の
     dialog:not([open]) { display: none } を打ち消し、閉じたダイアログの
     「保存・キャンセル」が各画面の下に出たままになる。
     見出しと操作列を先に確保し、残り全部を本文に配る。 */
  #dlg[open] { display: flex; flex-direction: column; }
  /* #dlg の直接の子は <form> で、見出し・本文・操作列はその中にある。
     form にも flex を掛けないと、本文が縮まず操作列が枠の外へ出る。 */
  #dlgForm { display: flex; flex-direction: column; min-height: 0; max-height: inherit; }
  .dlg-head, .dlg-foot { flex: 0 0 auto; }
  /* basis を 0 にして、見出しと操作列を引いた残りだけを本文に与える。 */
  .dlg-body { flex: 1 1 0%; min-height: 0; overflow-y: auto; }
  .dlg-foot .btn { flex: 1 1 auto; justify-content: center; }
}

<script>
(function () {
  'use strict';

  /* ==========================================================
     1. 定数・ユーティリティ
     ========================================================== */
  const MAXM = 600;                       // シミュレーション上限 (50年)
  const NS = 'http://www.w3.org/2000/svg';

  const INCOME_CATS  = ['給与', '賞与', '配達（現金回収）', '副業', '事業', '年金・給付', 'その他収入'];
  const EXPENSE_CATS = ['住居', '食費', '水道光熱', '通信', '交通', '保険', '医療',
                        '日用品', '被服', '教育', '交際費', '娯楽',
                        '社会保険', '税金', 'ふるさと納税', '預かり金の返却', 'その他支出'];

  const yen  = n => '¥' + Math.round(n).toLocaleString('ja-JP');
  const yen0 = n => Math.round(n).toLocaleString('ja-JP');
  const pct  = n => (Math.round(n * 10) / 10).toFixed(1) + '%';
  const uid  = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ローカル時刻での日付。toISOString() は UTC を返すので、日本時間だと朝9時前に前日へずれる。
  const todayISO = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  };
  const monthKey = iso => (iso || '').slice(0, 7);
  const thisMonth = () => todayISO().slice(0, 7);

  function addMonths(date, n) {
    const d = new Date(date.getFullYear(), date.getMonth(), 1);
    d.setMonth(d.getMonth() + n);
    return d;
  }
  const fmtMonth = d => d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
  const fmtMonthShort = key => {
    const [y, m] = key.split('-');
    return (+m === 1 ? y.slice(2) + '/' : '') + (+m) + '月';
  };
  /** YYYY-MM に n ヶ月足す。年またぎもここで面倒を見る。 */
  function addMonthKey(key, n) {
    if (!/^\d{4}-\d{2}$/.test(key || '')) return key;
    const [y, m] = key.split('-').map(Number);
    const t = (y * 12) + (m - 1) + n;
    return Math.floor(t / 12) + '-' + String((t % 12) + 1).padStart(2, '0');
  }
  /** 実際に口座から出ていく月。未設定の古い記録は利用月とみなす。 */
  const payMonthOf = t => t.payMonth || monthKey(t.date);

  /**
   * 一覧の取り出し。新しい種類のデータを足したとき、まだそれを持たない保存先を
   * 開いても画面が落ちないようにする。列を足して実際に壊したことがあるので、
   * ここは必ずこの関数を通す。
   */
  const rows = name => (Array.isArray(state[name]) ? state[name] : []);

  function monthsBetween(fromKey, toKey) {
    const [y1, m1] = fromKey.split('-').map(Number);
    const [y2, m2] = toKey.split('-').map(Number);
    return (y2 - y1) * 12 + (m2 - m1);
  }
  function durationText(m) {
    if (m == null) return '—';
    const y = Math.floor(m / 12), r = m % 12;
    if (y && r) return y + '年' + r + 'ヶ月';
    if (y) return y + '年';
    return r + 'ヶ月';
  }

  const ICON = {
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.01"/></svg>',
    crit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.01"/></svg>',
    ok:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.8 2.8L16 9.5"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
  };

  /* ==========================================================
     2. 状態と保存
     ========================================================== */
  const blank = () => ({
    debts: [], txns: [], repayments: [], borrows: [], cards: [], cardBills: [], fixed: [],
    goals: { targetDate: '', monthlyRepay: 0, emergency: 0, emergencyCurrent: 0 },
    v: 1
  });

  let state = blank();
  let dbStats = null;
  let online = true;

  /** サーバーの応答を画面が期待する形に整える */
  function adopt(p) {
    state = Object.assign(blank(), p);
    state.goals = Object.assign(blank().goals, p.goals || {});
  }

  // ここから下のデータ層は tools/build-web.js が Google スプレッドシート版に差し替える
  /* @swap:api */
  async function api(path, method, body) {
    const res = await fetch('/api' + path, {
      method: method || 'GET',
      headers: body !== undefined ? { 'Content-Type': 'application/json' } : undefined,
      body: body !== undefined ? JSON.stringify(body) : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || '通信に失敗しました（' + res.status + '）');
    return data;
  }
  /* @swap:api:end */

  /**
   * 書き込み。サーバーが返す更新後の全状態で置き換えてから再描画するので、
   * 画面と DB の中身がずれることがない。
   */
  async function commit(path, method, body, okMsg) {
    try {
      adopt(await api(path, method, body));
      online = true;
      try { dbStats = await api('/stats'); } catch (e) { /* 表示用なので失敗は無視 */ }
      render();
      if (okMsg) toast(okMsg);
      return true;
    } catch (e) {
      online = false;
      render();
      toast(e.message);
      return false;
    }
  }

  /* @swap:boot */
  async function boot() {
    try {
      adopt(await api('/state'));
      dbStats = await api('/stats');
      online = true;
    } catch (e) {
      online = false;
    }
    render();
    if (!online) toast('サーバーに接続できません。npm start が動いているか確認してください。');
  }
  /* @swap:boot:end */

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ==========================================================
     3. 金融計算
     ========================================================== */
  const DAY_BASIS = 365;                  // 年利を日割りする分母。うるう年も 365 日として扱う。

  /** 日付を保ったまま n ヶ月後。31日など相手の月に無い日は月末に丸める。 */
  function addMonthsExact(date, n) {
    const d = new Date(date.getFullYear(), date.getMonth(), 1);
    d.setMonth(d.getMonth() + n);
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(date.getDate(), last));
    return d;
  }
  /** Date どうしの日数。過去に戻る向きは 0。 */
  function daysApart(a, b) {
    const u = x => Date.UTC(x.getFullYear(), x.getMonth(), x.getDate());
    return Math.max(0, Math.round((u(b) - u(a)) / 86400000));
  }
  /** days 日分の利息。利息は元金にのみ付き、未払いの利息はそれ自身では増えない。 */
  function interestFor(principal, rate, days) {
    return principal * (rate / 100 / DAY_BASIS) * days;
  }
  /** 今日から1ヶ月後までに発生する利息。 */
  function monthlyInterest(d) {
    const t = new Date();
    return interestFor(d.principal, d.rate, daysApart(t, addMonthsExact(t, 1)));
  }

  const totalBalance     = () => rows('debts').reduce((s, d) => s + Math.max(0, d.balance), 0);
  const totalPrincipal   = () => rows('debts').reduce((s, d) => s + Math.max(0, d.principal), 0);
  const totalInterestDue = () => rows('debts').reduce((s, d) => s + Math.max(0, d.interestToday), 0);
  const totalInitial     = () => rows('debts').reduce((s, d) => s + Math.max(d.initial || 0, d.balance), 0);
  const totalMinPayment  = () => rows('debts').reduce((s, d) => (d.balance > 0 ? s + d.minPayment : s), 0);

  /**
   * 毎月の返済をシミュレートする。
   * 利息は日割り（年利 ÷ 365 × 経過日数）で元金にのみ発生し、返済額はまず未払利息に、
   * 残った分だけが元金に充当される。返済日は今日から1ヶ月刻みに置くので、
   * 月ごとの日数の違い（28日／31日）もそのまま利息に効く。
   * strategy: 'avalanche' 高金利優先 / 'snowball' 少額優先 / 'minimum' 最低返済のみ
   * 返り値の payoffMonths が null なら期間内に完済しない。
   */
  function simulate(budget, strategy) {
    const ds = rows('debts')
      .filter(d => d.balance > 0.5)
      .map(d => ({ id: d.id, name: d.name, prin: Math.max(0, d.principal),
                   int: Math.max(0, d.interestToday), rate: d.rate, min: d.minPayment }));

    if (!ds.length) return { months: [], totalInterest: 0, payoffMonths: 0, stalled: false, perDebt: {} };

    const sumMin = ds.reduce((s, d) => s + d.min, 0);
    const budgetUsed = strategy === 'minimum' ? sumMin : Math.max(budget, 0);

    const months = [];
    const perDebt = {};
    ds.forEach(d => { perDebt[d.id] = { name: d.name, paidOff: null }; });
    let totalInterest = 0, stalled = false;

    const bal = d => d.prin + d.int;
    /** 1件への充当。利息が先、余りが元金。 */
    const apply = (d, pay) => {
      const toInterest = Math.min(pay, d.int);
      d.int -= toInterest;
      d.prin = Math.max(0, d.prin - (pay - toInterest));
    };

    const start = new Date();
    let cursor = start;

    for (let m = 0; m < MAXM; m++) {
      const live = ds.filter(d => bal(d) > 0.5);
      if (!live.length) break;

      // 前回の返済日から今回の返済日までの日数分、利息が発生する
      const due = addMonthsExact(start, m + 1);
      const days = daysApart(cursor, due);
      cursor = due;

      let mi = 0;
      live.forEach(d => { const i = interestFor(d.prin, d.rate, days); d.int += i; mi += i; });
      totalInterest += mi;

      // 最低返済を全件に充当
      let avail = budgetUsed;
      live.forEach(d => {
        const pay = Math.min(d.min, bal(d), avail);
        apply(d, pay); avail -= pay;
      });

      // 余剰を戦略に従って1件へ集中
      if (strategy !== 'minimum' && avail > 0.5) {
        const rest = ds.filter(d => bal(d) > 0.5);
        rest.sort(strategy === 'snowball' ? (a, b) => bal(a) - bal(b) : (a, b) => b.rate - a.rate);
        for (const d of rest) {
          if (avail <= 0.5) break;
          const pay = Math.min(avail, bal(d));
          apply(d, pay); avail -= pay;
        }
      }

      live.forEach(d => { if (bal(d) <= 0.5 && perDebt[d.id].paidOff == null) perDebt[d.id].paidOff = m + 1; });

      const tb = ds.reduce((s, d) => s + Math.max(0, bal(d)), 0);
      months.push({ m: m + 1, balance: tb, interest: mi });

      const L = months.length;
      if (L >= 2 && months[L - 1].balance >= months[L - 2].balance - 0.5) { stalled = true; break; }
    }

    const done = !stalled && ds.every(d => bal(d) <= 0.5);
    return {
      months, totalInterest, perDebt, stalled,
      payoffMonths: done ? months.length : null,
      budgetUsed
    };
  }

  /**
   * この家計で使う返済方式。残高の小さい借入から順に完済していく雪だるま式。
   * 完済予定日も必要返済額も、実際に払う方式で計算しないと意味がない。
   */
  const PLAN = 'snowball';

  /** 目標期間内に完済するのに必要な月額返済を二分探索で求める */
  function requiredBudget(targetMonths) {
    if (targetMonths <= 0) return null;
    const tb = totalBalance();
    if (tb <= 0) return 0;
    let lo = 0, hi = tb * 1.5 + 10000;
    if (!simulate(hi, PLAN).payoffMonths) return null;
    for (let i = 0; i < 44; i++) {
      const mid = (lo + hi) / 2;
      const r = simulate(mid, PLAN);
      if (r.payoffMonths && r.payoffMonths <= targetMonths) hi = mid; else lo = mid;
    }
    return Math.ceil(hi / 100) * 100;
  }

  /* ==========================================================
     4. 集計
     ========================================================== */
  /**
   * その月に口座から出ていく額の内訳。
   * カードは、請求額の登録があればそれを正とする（明細を全部入れなくても正しくなる）。
   * 登録が無い月だけ、明細の合計で代替する。両方を足すと二重計上になるので必ずどちらか。
   * usedBy を渡すと「その月までに使った分」だけを明細から拾う（取り置きの計算用）。
   */
  function outflow(key, usedBy) {
    let cash = 0;
    const byCard = {};
    rows('txns').forEach(t => {
      if (t.type !== 'expense' || payMonthOf(t) !== key) return;
      if (usedBy && monthKey(t.date) > usedBy) return;
      if (t.cardId) byCard[t.cardId] = (byCard[t.cardId] || 0) + t.amount;
      else cash += t.amount;
    });

    const bills = {};
    rows('cardBills').forEach(b => { if (b.payMonth === key) bills[b.cardId] = b.amount; });

    const cardRows = rows('cards').map(c => {
      const billed = Object.prototype.hasOwnProperty.call(bills, c.id);
      return {
        id: c.id, name: c.name, billed,
        amount: billed ? bills[c.id] : (byCard[c.id] || 0),
        detail: byCard[c.id] || 0
      };
    });
    // 消したカードに紐づいたままの明細も取りこぼさない
    let orphan = 0;
    Object.keys(byCard).forEach(id => {
      if (!cardRows.some(c => c.id === id)) orphan += byCard[id];
    });

    const card = cardRows.reduce((a, r) => a + r.amount, 0) + orphan;
    return { cash, card, orphan, rows: cardRows, total: cash + card };
  }

  /**
   * 月次の集計。支出は2つの見方を持つ。
   *   expense     発生ベース … 使った月。「今月いくら使ったか」を見るための数字。
   *   expensePaid 引落ベース … 実際に口座から出ていく月。カード払いは翌月に回る。
   * 「返済に回せる余力」は現金の話なので、引落ベースで出す。
   */
  function monthSummary(key) {
    let income = 0, expense = 0, expensePaid = 0, deferred = 0;
    rows('txns').forEach(t => {
      const used = monthKey(t.date) === key;
      if (t.type === 'income') { if (used) income += t.amount; return; }
      if (used) {
        expense += t.amount;
        if (payMonthOf(t) !== key) deferred += t.amount;   // 今月使ったが翌月以降に出ていく分
      }
    });
    const out = outflow(key);
    expensePaid = out.total;

    // その月に実際に借金が減った額。返済しても同じ月に借りていれば、その分は戻る。
    // 現金の流れとしても、借入は手元に入るお金なので差し引きで見るのが正しい。
    const repayGross = rows('repayments')
      .filter(r => monthKey(r.date) === key)
      .reduce((s, r) => s + r.amount, 0);
    const borrow = rows('borrows')
      .filter(b => monthKey(b.date) === key)
      .reduce((s, b) => s + b.amount, 0);
    const repay = repayGross - borrow;

    return { key, income, expense, expensePaid, deferred, out,
             repay, repayGross, borrow,
             net: income - expensePaid - repay };
  }

  /**
   * 翌月に確定している引落。今月の手元にお金があっても、この分は既に他人のものなので
   * 使ってはいけない。現金回収の仕事だと手元の現金と口座の引落がずれるため、
   * これを見せないと「使い切って翌月払えない」が起きる。
   */
  function committedNext(key) {
    return outflow(addMonthKey(key, 1), key).total;
  }

  /** その月に引き落とされる額のうち、前の月までに使った分（＝カード払いの繰越）。 */
  function carriedInto(key) {
    return rows('txns')
      .filter(t => t.type === 'expense' && payMonthOf(t) === key && monthKey(t.date) !== key)
      .reduce((s, t) => s + t.amount, 0);
  }

  const cardName = id => (rows('cards').find(c => c.id === id) || {}).name || '';

  /** 直近 n ヶ月（当月を含む）のキー配列 */
  function recentMonths(n) {
    const out = [];
    const now = new Date();
    for (let i = n - 1; i >= 0; i--) {
      const d = addMonths(now, -i);
      out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
    }
    return out;
  }

  /** 今月がどこまで進んだか。月の途中の実績を読むときの物差しにする。 */
  function monthProgress() {
    const t = new Date();
    const days = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    return { day: t.getDate(), days, pct: (t.getDate() / days) * 100 };
  }

  /**
   * 毎月の固定収支から、目標返済額に届くかを見る。
   *   返済に回せる額 = 固定収入 − 固定支出
   *   不足           = 目標返済額 − 返済に回せる額
   * 不足があるなら、その分を稼ぐか、支出を削るかのどちらかで埋めることになる。
   */
  function fixedPlan(goalRepay) {
    const income = rows('fixed').filter(f => f.type === 'income')
      .reduce((a, f) => a + f.amount, 0);
    const expense = rows('fixed').filter(f => f.type === 'expense')
      .reduce((a, f) => a + f.amount, 0);
    // 毎月の返済も固定で出ていくお金。目標があればそれ、無ければ最低返済額の合計。
    const sumMin = totalMinPayment();
    const repay = goalRepay > 0 ? goalRepay : sumMin;
    const left = income - expense - repay;
    return { income, expense, repay, sumMin, left,
             fromGoal: goalRepay > 0,
             need: Math.max(0, -left),
             // 固定収支を1つも登録していないうちは、案内だけ出す
             has: rows('fixed').length > 0 };
  }

  /* ---------- ふるさと納税 ---------- */

  // 給与として扱うカテゴリ。額面を手で入れたときだけ、売上から外して二重計上を防ぐ。
  const TAX_SALARY_CATS = ['給与', '賞与'];
  // 青色申告特別控除は法律で決まった3つの額しか無い。自由入力にする意味がない。
  const BLUE_AMOUNTS = [[0, '使わない'], [100000, '10万円'], [550000, '55万円'], [650000, '65万円']];
  const TAX_CUSTODY = '預かり金の返却';
  const TAX_SOCIAL  = '社会保険';
  const TAX_DONATE  = 'ふるさと納税';
  // 経費に計上できる割合の選択肢。家事按分はだいたいこの刻みで足りる。
  const COST_RATES = [0, 25, 50, 75, 100];

  /**
   * その年の記録から、申告に使う数字を集める。
   *
   * 収入はすべて事業の売上として数える。
   * ただし給与の額面を手で入れているときだけは、給与・賞与を売上から外す。
   * 記録しているのは手取りなので、額面と足すと同じ収入を二重に数えてしまう。
   */
  function taxAuto(year, salaryTyped) {
    const y = String(year);
    const inYear = t => String(t.date || '').slice(0, 4) === y;
    const all = rows('txns').filter(inYear);
    const ti = all.filter(t => t.type === 'income');
    const te = all.filter(t => t.type === 'expense');
    const sum = (a, f) => a.reduce((s, t) => s + (f ? f(t) : t.amount), 0);

    const counted = salaryTyped ? ti.filter(t => !TAX_SALARY_CATS.includes(t.category)) : ti;
    const gross = sum(counted);
    const excluded = sum(ti) - gross;      // 給与の額面を手で入れたぶん、売上から外した額
    const custody = sum(te.filter(t => t.category === TAX_CUSTODY));
    // 預かり金は客から預かっただけで自分の売上ではない。返した分を引くと報酬が残る。
    const bizIncome = Math.max(0, gross - custody);
    // 返した預かり金は経費ではない。上で売上から引いてあるので、ここでも数えると二重になる。
    const costRows = te.filter(t => (t.costRate || 0) > 0 && t.category !== TAX_CUSTODY);
    const bizCost = sum(costRows, t => t.amount * (t.costRate || 0) / 100);
    const social = sum(te.filter(t => t.category === TAX_SOCIAL));
    const donated = sum(te.filter(t => t.category === TAX_DONATE));
    // 記録のある月数。年の途中なら、上限も途中までの数字で出ていることになる。
    const months = new Set(all.map(t => String(t.date).slice(0, 7))).size;
    return { gross, custody, bizIncome, bizCost, social, donated, excluded,
             costCount: costRows.length, months, txnCount: all.length };
  }

  /**
   * 手で入れた数字があればそれ、無ければ記録から集めた数字。
   * 0 は「未入力」であって「ゼロと申告した」ではない。
   */
  function taxInput(year) {
    const saved = rows('tax').find(t => Number(t.year) === Number(year)) || {};
    const auto = taxAuto(year, Math.max(0, Number(saved.salary) || 0) > 0);
    const typed = k => Math.max(0, Number(saved[k]) || 0);
    const or = (k, a) => (typed(k) > 0 ? typed(k) : a);
    return {
      year, saved, auto,
      salary: typed('salary'),          // 額面。記録からは取れないので手入力だけ
      bizIncome: or('bizIncome', auto.bizIncome),
      bizCost: or('bizCost', auto.bizCost),
      social: or('social', auto.social),
      blue: typed('blue'),
      lifeIns: typed('lifeIns'), ideco: typed('ideco'), medical: typed('medical'),
      family: typed('family'), otherDed: typed('otherDed'), levy: typed('levy'),
      isTyped: k => typed(k) > 0
    };
  }

  /** その年の支出をカテゴリごとにまとめる。経費の一括設定に使う。 */
  function costByCategory(year) {
    const y = String(year);
    const map = new Map();
    rows('txns')
      .filter(t => t.type === 'expense' && String(t.date || '').slice(0, 4) === y
                   && t.category !== TAX_CUSTODY)
      .forEach(t => {
        const g = map.get(t.category) ||
          { category: t.category, count: 0, total: 0, counted: 0, rates: new Set() };
        g.count++; g.total += t.amount;
        g.counted += t.amount * (t.costRate || 0) / 100;
        g.rates.add(t.costRate || 0);
        map.set(t.category, g);
      });
    return [...map.values()]
      .map(g => Object.assign(g, {
        // 全部同じ割合なら、その割合を選択肢に出せる。違うなら「混在」
        rate: g.rates.size === 1 ? [...g.rates][0] : null
      }))
      .sort((a, b) => b.counted - a.counted || b.total - a.total);
  }

  /**
   * 税額の計算に使う数字。年で変わるので、散らばらないようここにまとめる。
   * 令和7年(2025年)の改正を織り込んである（給与所得控除の最低保障 55万→65万、
   * 所得税の基礎控除の上乗せ）。年が変わったらここだけ直せばよい。
   * 上限は「目安」であって申告の代わりにはならない。最後は住民税決定通知書で確かめる。
   */
  const TAX = {
    // 給与所得控除。収入がその額以下なら、その式を使う。
    salaryDeduction: [
      [1900000, () => 650000],
      [3600000, r => r * 0.30 + 80000],
      [6600000, r => r * 0.20 + 440000],
      [8500000, r => r * 0.10 + 1100000],
      [Infinity, () => 1950000]
    ],
    // 所得税の基礎控除。令和7・8年分は所得に応じて上乗せがある。
    basicIncome: [[1320000, 950000], [3360000, 880000], [4890000, 680000],
                  [6550000, 630000], [23500000, 580000], [24000000, 480000],
                  [24500000, 320000], [25000000, 160000], [Infinity, 0]],
    // 住民税の基礎控除。所得税と違って据え置き。この差が調整控除の理由。
    basicResident: [[24000000, 430000], [24500000, 290000], [25000000, 150000], [Infinity, 0]],
    // 所得税の税率。課税所得がその額以下なら、その税率。
    incomeRate: [[1950000, 0.05], [3300000, 0.10], [6950000, 0.20], [9000000, 0.23],
                 [18000000, 0.33], [40000000, 0.40], [Infinity, 0.45]],
    residentRate: 0.10,       // 住民税の所得割（市町村6% + 都道府県4%）
    reconstruction: 1.021,    // 復興特別所得税。2037年分まで所得税に上乗せされる
    selfPay: 2000,            // ふるさと納税の自己負担額
    specialCap: 0.20,         // 住民税特例分の上限。所得割額に対する割合
    basicCap: 0.30,           // 住民税基本分の対象にできる寄付額の上限。総所得に対する割合
    adjustBase: 50000         // 調整控除に使う人的控除の差（基礎控除の分）
  };

  /** 区切り表から、値に当てはまる行の中身を取り出す。 */
  const taxPick = (table, v) => (table.find(row => v <= row[0]) || table[table.length - 1])[1];

  /** 課税所得は千円未満を切り捨てる。 */
  const floor1000 = v => Math.floor(Math.max(0, v) / 1000) * 1000;

  /** 給与の額面から給与所得を出す。 */
  function salaryIncome(revenue) {
    if (revenue <= 0) return 0;
    return Math.max(0, revenue - taxPick(TAX.salaryDeduction, revenue)(revenue));
  }

  /**
   * 調整控除。住民税の基礎控除が所得税より5万円少ないぶんを埋め合わせる仕組み。
   * 入れないと所得割額を多く見積もり、ふるさと納税の上限も多く出てしまう。
   */
  function adjustCredit(taxableResident) {
    if (taxableResident <= 0 || taxableResident > 25000000) return 0;
    if (taxableResident <= 2000000) {
      return Math.min(TAX.adjustBase, taxableResident) * 0.05;
    }
    return Math.max(2500, (TAX.adjustBase - (taxableResident - 2000000)) * 0.05);
  }

  /**
   * ふるさと納税の控除上限額（自己負担が2,000円で収まる寄付額）。
   *
   * 上限を決めているのは住民税の「特例分」で、所得割額の20%までしか使えない。
   *   (寄付額 − 2,000) × (100% − 住民税10% − 所得税率×1.021) = 所得割額 × 20%
   * これを寄付額について解いたものが下の式。
   *
   * levy（住民税決定通知書の所得割額）が入っていればそれを使う。
   * 通知書の実額が一番正確で、控除の見落としがあっても影響を受けない。
   *
   * 途中の数字も全部返す。上限だけ出されても検算のしようがない。
   */
  function furusato(input) {
    const at = k => Math.max(0, Number(input[k]) || 0);
    const salaryRev = at('salary');
    const bizRev = at('bizIncome');
    const bizCost = at('bizCost');
    const blue = at('blue');

    const salaryPart = salaryIncome(salaryRev);
    const bizPart = Math.max(0, bizRev - bizCost - blue);
    const total = salaryPart + bizPart;                 // 合計所得金額

    // 所得税と住民税で控除額が違うものもあるが、ここでは同じとして扱う。
    // 住民税の控除を多めに見るぶん所得割額は小さめに出て、上限は控えめになる。
    // ふるさと納税では出しすぎが損なので、ずれるなら少ない側が安全。
    const otherDeductions = ['social', 'lifeIns', 'ideco', 'medical', 'family', 'otherDed']
      .reduce((a, k) => a + at(k), 0);

    const basicI = taxPick(TAX.basicIncome, total);
    const basicR = taxPick(TAX.basicResident, total);
    const taxableI = floor1000(total - basicI - otherDeductions);
    const taxableR = floor1000(total - basicR - otherDeductions);

    const rate = taxPick(TAX.incomeRate, taxableI);
    const adjust = adjustCredit(taxableR);
    const levyCalc = Math.max(0, taxableR * TAX.residentRate - adjust);
    const levy = at('levy') > 0 ? at('levy') : levyCalc;
    const fromLevy = at('levy') > 0;

    // 分母は「特例分が寄付額のうち何割を受け持つか」。所得税率が高いほど小さくなり、
    // 同じ所得割額でも上限は大きくなる。
    const denom = 0.9 - rate * TAX.reconstruction;
    let limit = 0, capped = false;
    if (levy > 0 && denom > 0) {
      limit = levy * TAX.specialCap / denom + TAX.selfPay;
      // 住民税基本分は総所得の30%までしか対象にできない。ここで頭打ちになることもある。
      const hardCap = total * TAX.basicCap;
      if (hardCap > 0 && limit > hardCap) { limit = hardCap; capped = true; }
    }
    // 端数を切り上げて申し込むと自己負担が増える。千円単位で切り捨てておく。
    limit = Math.floor(limit / 1000) * 1000;
    // 上限ちょうどを狙うと、年末に収入が増えただけで足が出る。少し内側を勧める。
    const safe = Math.floor(limit * 0.9 / 1000) * 1000;

    return {
      salaryRev, salaryPart, bizRev, bizCost, blue, bizPart, total,
      basicI, basicR, otherDeductions, taxableI, taxableR,
      rate, adjust, levyCalc, levy, fromLevy, limit, safe, capped,
      // 所得割が無ければ、そもそも控除される住民税が無い
      noLevy: levy <= 0
    };
  }

  /**
   * 返済に回せる月々の余力：直近 n ヶ月の (収入 − 引落) の平均。
   * 使った月ではなく口座から出ていく月で数える。カード払いを発生ベースで引くと、
   * 引落が翌月に来る分だけ余力を過大にも過小にも見せてしまう。
   */
  function avgCapacity(n) {
    const keys = recentMonths(n).filter(k => {
      return state.txns.some(t => monthKey(t.date) === k);
    });
    if (!keys.length) return null;
    const tot = keys.reduce((s, k) => {
      const m = monthSummary(k);
      return s + (m.income - m.expensePaid);
    }, 0);
    return tot / keys.length;
  }

  function expenseByCategory(key) {
    const map = new Map();
    state.txns.forEach(t => {
      if (t.type !== 'expense' || monthKey(t.date) !== key) return;
      map.set(t.category, (map.get(t.category) || 0) + t.amount);
    });
    let rows = [...map.entries()].map(([k, v]) => ({ label: k, value: v }))
      .sort((a, b) => b.value - a.value);
    // 系列は循環させない。8枠を超えたら「その他」に畳む。
    if (rows.length > 7) {
      const rest = rows.slice(7).reduce((s, r) => s + r.value, 0);
      rows = rows.slice(0, 7).concat([{ label: 'その他の項目', value: rest }]);
    }
    return rows;
  }

  /* ==========================================================
     5. チャート基盤
     ========================================================== */
  const SERIES = i => 'var(--s' + ((i % 8) + 1) + ')';
  let observers = [];
  function clearCharts() { observers.forEach(o => o.disconnect()); observers = []; }

  function mountChart(el, draw) {
    // 同じ要素に二重に監視をつけない
    if (el.__ro) {
      el.__ro.disconnect();
      const i = observers.indexOf(el.__ro);
      if (i >= 0) observers.splice(i, 1);
    }
    let last = 0;
    const ro = new ResizeObserver(entries => {
      const w = Math.max(260, Math.floor(entries[0].contentRect.width));
      if (Math.abs(w - last) < 2) return;
      last = w;
      el.querySelectorAll('svg').forEach(s => s.remove());
      draw(el, w);
    });
    ro.observe(el);
    observers.push(ro);
    el.__ro = ro;
  }

  function el(tag, attrs, style) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (style) e.setAttribute('style', style);
    return e;
  }

  function tipFor(container) {
    let t = container.querySelector('.tip');
    if (!t) { t = document.createElement('div'); t.className = 'tip'; container.appendChild(t); }
    return t;
  }
  function placeTip(container, tip, x, y) {
    const cw = container.clientWidth;
    tip.classList.add('show');
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = clamp(x - tw / 2, 4, Math.max(4, cw - tw - 4)) + 'px';
    tip.style.top = Math.max(4, y - th - 12) + 'px';
  }

  /** 目盛りの丸め */
  function niceTicks(max, count) {
    if (max <= 0) return [0, 1];
    const raw = max / count;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
    const out = [];
    for (let v = 0; v <= max + step * 0.001; v += step) out.push(v);
    if (out[out.length - 1] < max) out.push(out[out.length - 1] + step);
    return out;
  }
  function compact(n) {
    const a = Math.abs(n);
    if (a >= 1e8) return (n / 1e8).toFixed(a >= 1e9 ? 0 : 1).replace(/\.0$/, '') + '億';
    if (a >= 1e4) return (n / 1e4).toFixed(a >= 1e6 ? 0 : 1).replace(/\.0$/, '') + '万';
    return yen0(n);
  }

  /** 片側だけ角を丸めたバーのパス */
  function barPath(x, y, w, h, r, dir) {
    r = Math.max(0, Math.min(r, dir === 'up' ? w / 2 : h / 2, dir === 'up' ? h : w));
    if (h <= 0 || w <= 0) return '';
    if (dir === 'up') {
      return `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z`;
    }
    return `M${x},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h - r} Q${x + w},${y + h} ${x + w - r},${y + h} L${x},${y + h} Z`;
  }

  /* ---------- 面グラフ（単一系列・十字カーソル） ---------- */
  function areaChart(container, w, opts) {
    const { points, height = 190, pad = { t: 16, r: 16, b: 26, l: 52 }, label, bleed } = opts;
    if (!points.length) return;
    const P = bleed ? { t: 14, r: 0, b: 24, l: 0 } : pad;
    const iw = w - P.l - P.r, ih = height - P.t - P.b;
    const svg = el('svg', { viewBox: `0 0 ${w} ${height}`, height, role: 'img',
      'aria-label': (label || '推移') + 'の折れ線グラフ' });

    const maxV = Math.max(...points.map(p => p.v), 1);
    const ticks = niceTicks(maxV, 3);
    const top = ticks[ticks.length - 1];
    const X = i => P.l + (points.length === 1 ? iw / 2 : (i / (points.length - 1)) * iw);
    const Y = v => P.t + ih - (v / top) * ih;

    if (!bleed) {
      ticks.forEach(t => {
        svg.appendChild(el('line', { x1: P.l, x2: P.l + iw, y1: Y(t), y2: Y(t) },
          'stroke:var(--grid);stroke-width:1'));
        const tx = el('text', { x: P.l - 8, y: Y(t) + 3.5, 'text-anchor': 'end', class: 'tick' },
          'fill:var(--ink-3)');
        tx.textContent = compact(t);
        svg.appendChild(tx);
      });
    } else {
      ticks.forEach(t => {
        if (t === 0) return;
        svg.appendChild(el('line', { x1: 0, x2: w, y1: Y(t), y2: Y(t) },
          'stroke:var(--grid);stroke-width:1'));
      });
    }

    const gid = 'ag' + uid();
    const defs = el('defs');
    const grad = el('linearGradient', { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 });
    grad.appendChild(el('stop', { offset: '0%', 'stop-opacity': '.16' }, 'stop-color:var(--accent)'));
    grad.appendChild(el('stop', { offset: '100%', 'stop-opacity': '.01' }, 'stop-color:var(--accent)'));
    defs.appendChild(grad); svg.appendChild(defs);

    const line = points.map((p, i) => (i ? 'L' : 'M') + X(i) + ',' + Y(p.v)).join(' ');
    svg.appendChild(el('path', { d: `${line} L${X(points.length - 1)},${P.t + ih} L${X(0)},${P.t + ih} Z`, fill: `url(#${gid})` }));
    svg.appendChild(el('path', { d: line, fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' },
      'stroke:var(--accent);stroke-width:2'));

    // 軸ラベル（最初と最後のみ）
    [0, points.length - 1].forEach((i, k) => {
      if (points.length < 2 && k) return;
      const t = el('text', { x: clamp(X(i), 16, w - 16), y: height - 7,
        'text-anchor': k ? 'end' : 'start', class: 'tick' }, 'fill:var(--ink-3)');
      t.textContent = points[i].label;
      svg.appendChild(t);
    });

    // 終点のマーカー（サーフェスリング付き）
    const li = points.length - 1;
    svg.appendChild(el('circle', { cx: X(li), cy: Y(points[li].v), r: 5.5 },
      'fill:var(--accent);stroke:var(--surface);stroke-width:2'));

    // 十字カーソル
    const cross = el('line', { y1: P.t, y2: P.t + ih, opacity: 0 }, 'stroke:var(--ink-3);stroke-width:1');
    const dot = el('circle', { r: 4.5, opacity: 0 }, 'fill:var(--accent);stroke:var(--surface);stroke-width:2');
    svg.appendChild(cross); svg.appendChild(dot);
    const tip = tipFor(container);

    svg.addEventListener('pointermove', ev => {
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) * (w / r.width);
      let idx = points.length === 1 ? 0
        : Math.round(((px - P.l) / iw) * (points.length - 1));
      idx = clamp(idx, 0, points.length - 1);
      const p = points[idx];
      cross.setAttribute('x1', X(idx)); cross.setAttribute('x2', X(idx)); cross.setAttribute('opacity', .5);
      dot.setAttribute('cx', X(idx)); dot.setAttribute('cy', Y(p.v)); dot.setAttribute('opacity', 1);
      tip.innerHTML = `<div class="tip-t">${esc(p.full || p.label)}</div>
        <div class="tip-r"><span class="tip-k"><i class="swatch" style="background:var(--accent)"></i>${esc(label || '残高')}</span><b>${yen(p.v)}</b></div>`;
      placeTip(container, tip, X(idx) * (r.width / w), Y(p.v) * (r.height / height));
    });
    svg.addEventListener('pointerleave', () => {
      cross.setAttribute('opacity', 0); dot.setAttribute('opacity', 0); tip.classList.remove('show');
    });

    container.appendChild(svg);
  }

  /* ---------- 横棒グラフ（カテゴリ別） ---------- */
  function barsChart(container, w, opts) {
    const { rows, colorFn, valueFmt = yen } = opts;
    if (!rows.length) return;
    const labelW = Math.min(112, Math.max(64, w * 0.26));
    const P = { t: 6, r: 74, b: 6, l: labelW };
    const bh = Math.min(24, Math.max(13, 240 / rows.length));
    const gap = 12;
    const height = P.t + P.b + rows.length * (bh + gap) - gap;
    const iw = w - P.l - P.r;
    const max = Math.max(...rows.map(r => r.value), 1);

    const svg = el('svg', { viewBox: `0 0 ${w} ${height}`, height, role: 'img',
      'aria-label': '項目別の横棒グラフ' });
    const tip = tipFor(container);

    rows.forEach((r, i) => {
      const y = P.t + i * (bh + gap);
      const bw = Math.max(2, (r.value / max) * iw);
      const color = colorFn ? colorFn(r, i) : SERIES(i);

      const lb = el('text', { x: P.l - 10, y: y + bh / 2 + 4, 'text-anchor': 'end', class: 'clabel' },
        'fill:var(--ink-2)');
      lb.textContent = r.label.length > 7 ? r.label.slice(0, 6) + '…' : r.label;
      svg.appendChild(lb);

      svg.appendChild(el('rect', { x: P.l, y, width: iw, height: bh, rx: 3 },
        'fill:var(--surface-3);opacity:.55'));

      const bar = el('path', { d: barPath(P.l, y, bw, bh, 4, 'right') }, 'fill:' + color);
      svg.appendChild(bar);

      const vl = el('text', { x: P.l + bw + 9, y: y + bh / 2 + 4, class: 'dlabel' }, 'fill:var(--ink-2)');
      vl.textContent = valueFmt(r.value);
      svg.appendChild(vl);

      const hit = el('rect', { x: 0, y: y - gap / 2, width: w, height: bh + gap, fill: 'transparent' });
      hit.style.cursor = 'default';
      hit.addEventListener('pointerenter', () => {
        bar.style.filter = 'brightness(1.08)';
        tip.innerHTML = `<div class="tip-t">${esc(r.label)}</div>
          <div class="tip-r"><span class="tip-k"><i class="swatch" style="background:${color}"></i>${esc(r.sub || '金額')}</span><b>${valueFmt(r.value)}</b></div>`;
        const rc = svg.getBoundingClientRect();
        placeTip(container, tip, (P.l + bw / 2) * (rc.width / w), (y) * (rc.height / height));
      });
      hit.addEventListener('pointerleave', () => { bar.style.filter = ''; tip.classList.remove('show'); });
      svg.appendChild(hit);
    });

    container.appendChild(svg);
  }

  /* ---------- グループ縦棒（月次収支） ---------- */
  function groupedColumns(container, w, opts) {
    const { groups, series, height = 220 } = opts;
    if (!groups.length) return;
    const P = { t: 14, r: 12, b: 30, l: 52 };
    const iw = w - P.l - P.r, ih = height - P.t - P.b;
    const max = Math.max(1, ...groups.map(g => Math.max(...g.values)));
    const ticks = niceTicks(max, 3);
    const top = ticks[ticks.length - 1];

    const svg = el('svg', { viewBox: `0 0 ${w} ${height}`, height, role: 'img',
      'aria-label': '月ごとの収入・支出・返済の縦棒グラフ' });
    const tip = tipFor(container);

    ticks.forEach(t => {
      const y = P.t + ih - (t / top) * ih;
      svg.appendChild(el('line', { x1: P.l, x2: P.l + iw, y1: y, y2: y },
        'stroke:' + (t === 0 ? 'var(--axis)' : 'var(--grid)') + ';stroke-width:1'));
      const tx = el('text', { x: P.l - 8, y: y + 3.5, 'text-anchor': 'end', class: 'tick' }, 'fill:var(--ink-3)');
      tx.textContent = compact(t);
      svg.appendChild(tx);
    });

    const band = iw / groups.length;
    const n = series.length;
    const GAP = 2;                                   // サーフェスギャップ
    const bw = Math.min(24, Math.max(5, (band * 0.66 - GAP * (n - 1)) / n));
    const clusterW = bw * n + GAP * (n - 1);

    groups.forEach((g, gi) => {
      const cx = P.l + band * gi + band / 2;
      const x0 = cx - clusterW / 2;

      g.values.forEach((v, si) => {
        const h = (v / top) * ih;
        const x = x0 + si * (bw + GAP);
        const y = P.t + ih - h;
        if (h > 0.5) {
          svg.appendChild(el('path', { d: barPath(x, y, bw, h, 4, 'up') },
            'fill:' + series[si].color));
        }
      });

      const lb = el('text', { x: cx, y: height - 9, 'text-anchor': 'middle', class: 'tick' },
        'fill:var(--ink-3)');
      lb.textContent = g.label;
      svg.appendChild(lb);

      const hit = el('rect', { x: P.l + band * gi, y: P.t, width: band, height: ih, fill: 'transparent' });
      hit.addEventListener('pointerenter', () => {
        tip.innerHTML = `<div class="tip-t">${esc(g.full || g.label)}</div>` +
          series.map((s, si) => `<div class="tip-r"><span class="tip-k"><i class="swatch" style="background:${s.color}"></i>${esc(s.name)}</span><b>${yen(g.values[si])}</b></div>`).join('') +
          `<div class="tip-r" style="margin-top:4px;padding-top:4px;border-top:1px solid var(--border)"><span class="tip-k">差引</span><b>${yen(g.net)}</b></div>`;
        const rc = svg.getBoundingClientRect();
        placeTip(container, tip, cx * (rc.width / w), P.t * (rc.height / height));
      });
      hit.addEventListener('pointerleave', () => tip.classList.remove('show'));
      svg.appendChild(hit);
    });

    container.appendChild(svg);
  }

  /* ---------- 複数折れ線（戦略比較） ---------- */
  function multiLine(container, w, opts) {
    const { series, height = 250, xLabel } = opts;
    const P = { t: 16, r: 84, b: 30, l: 56 };
    const iw = w - P.l - P.r, ih = height - P.t - P.b;
    const len = Math.max(...series.map(s => s.points.length), 1);
    const max = Math.max(1, ...series.flatMap(s => s.points));
    const ticks = niceTicks(max, 4);
    const top = ticks[ticks.length - 1];
    const X = i => P.l + (len === 1 ? 0 : (i / (len - 1)) * iw);
    const Y = v => P.t + ih - (v / top) * ih;

    const svg = el('svg', { viewBox: `0 0 ${w} ${height}`, height, role: 'img',
      'aria-label': '返済戦略ごとの残高推移の比較グラフ' });
    const tip = tipFor(container);

    ticks.forEach(t => {
      svg.appendChild(el('line', { x1: P.l, x2: P.l + iw, y1: Y(t), y2: Y(t) },
        'stroke:' + (t === 0 ? 'var(--axis)' : 'var(--grid)') + ';stroke-width:1'));
      const tx = el('text', { x: P.l - 8, y: Y(t) + 3.5, 'text-anchor': 'end', class: 'tick' }, 'fill:var(--ink-3)');
      tx.textContent = compact(t);
      svg.appendChild(tx);
    });

    // x 軸ラベル
    [0, Math.floor((len - 1) / 2), len - 1].forEach((i, k) => {
      if (i < 0) return;
      const t = el('text', { x: clamp(X(i), P.l, P.l + iw), y: height - 9,
        'text-anchor': k === 0 ? 'start' : k === 2 ? 'end' : 'middle', class: 'tick' }, 'fill:var(--ink-3)');
      t.textContent = (i + 1) + 'ヶ月';
      svg.appendChild(t);
    });
    if (xLabel) {
      const t = el('text', { x: P.l, y: 10, class: 'clabel' }, 'fill:var(--ink-3)');
      t.textContent = xLabel; svg.appendChild(t);
    }

    series.forEach(s => {
      if (!s.points.length) return;
      const d = s.points.map((v, i) => (i ? 'L' : 'M') + X(i) + ',' + Y(v)).join(' ');
      svg.appendChild(el('path', { d, fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' },
        `stroke:${s.color};stroke-width:2`));
      const li = s.points.length - 1;
      svg.appendChild(el('circle', { cx: X(li), cy: Y(s.points[li]), r: 4.5 },
        `fill:${s.color};stroke:var(--surface);stroke-width:2`));
      // 完済点に直接ラベル（凡例を補う）
      const lab = el('text', { x: Math.min(X(li) + 10, w - 4), y: Y(s.points[li]) + 4, class: 'dlabel' },
        'fill:var(--ink-2)');
      lab.textContent = s.payoff ? s.payoff + 'ヶ月' : '未完済';
      svg.appendChild(lab);
    });

    const cross = el('line', { y1: P.t, y2: P.t + ih, opacity: 0 }, 'stroke:var(--ink-3);stroke-width:1');
    svg.appendChild(cross);
    svg.addEventListener('pointermove', ev => {
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) * (w / r.width);
      let idx = clamp(Math.round(((px - P.l) / iw) * (len - 1)), 0, len - 1);
      cross.setAttribute('x1', X(idx)); cross.setAttribute('x2', X(idx)); cross.setAttribute('opacity', .45);
      tip.innerHTML = `<div class="tip-t">${idx + 1}ヶ月後の残高</div>` +
        series.map(s => `<div class="tip-r"><span class="tip-k"><i class="swatch" style="background:${s.color}"></i>${esc(s.name)}</span><b>${idx < s.points.length ? yen(s.points[idx]) : '完済'}</b></div>`).join('');
      placeTip(container, tip, X(idx) * (r.width / w), P.t * (r.height / height));
    });
    svg.addEventListener('pointerleave', () => { cross.setAttribute('opacity', 0); tip.classList.remove('show'); });

    container.appendChild(svg);
  }

  function legendHTML(items) {
    return '<div class="legend">' + items.map(i =>
      `<span><i class="swatch" style="background:${i.color}"></i>${esc(i.name)}</span>`).join('') + '</div>';
  }

  /* ==========================================================
     6. ビュー描画
     ========================================================== */
  let currentView = 'dash';
  const V = {};

  function render() {
    clearCharts();
    V[currentView]();
    const note = document.getElementById('saveNote');
    note.textContent = online
      ? 'SQLite（saimu.db）に保存しています。'
      : 'サーバーに接続できません。npm start が動いているか確認してください。';

  function headHTML(title, lede) {
    return `<div class="view-head"><h1>${esc(title)}</h1><p class="lede">${lede}</p></div>`;
  }

  /* ---------- ダッシュボード ---------- */
  V.dash = function () {
    const root = document.getElementById('view-dash');
    const tb = totalBalance();

    if (!state.debts.length) {
      root.innerHTML = headHTML('ダッシュボード', 'まず借入を登録すると、完済予定日と必要な毎月の返済額を計算します。') +
        `<div class="empty">
           <h3>借入がまだ登録されていません</h3>
           <p>借入先・元金・未払利息・年利・最低返済額を登録すると、完済までの道のりと利息の総額がすぐに見えるようになります。利息はその後、日割りで自動計算されます。</p>
           <div style="display:flex;gap:9px;flex-wrap:wrap;justify-content:center">
             <button class="btn primary" data-act="add-debt">${ICON.plus}借入を登録する</button>
             <button class="btn" data-act="sample">サンプルデータで試す</button>
           </div>
         </div>`;
      return;
    }

    const budget = plannedBudget();
    const sim = simulate(budget, PLAN);
    const payoffDate = sim.payoffMonths ? fmtMonth(addMonths(new Date(), sim.payoffMonths)) : null;
    const mk = thisMonth();
    const ms = monthSummary(mk);
    const init = totalInitial();
    const progress = init > 0 ? ((init - tb) / init) * 100 : 0;
    const sumMin = totalMinPayment();
    const monthInterest = state.debts.reduce((s, d) => s + monthlyInterest(d), 0);
    const dayInterest = state.debts.reduce((s, d) => s + interestFor(d.principal, d.rate, 1), 0);

    const alerts = [];
    state.debts.filter(d => d.balance > 0.5).forEach(d => {
      if (d.minPayment <= monthlyInterest(d)) {
        alerts.push(`<div class="callout crit">${ICON.crit}<div><b>${esc(d.name)}</b> は最低返済額（${yen(d.minPayment)}）が毎月の利息（${yen(monthlyInterest(d))}）を下回っています。このままでは残高が減りません。返済額を増やすか、借り換えを検討してください。</div></div>`);
      }
    });
    const committed = committedNext(mk);
    if (committed > 0 && ms.net - committed < 0) {
      alerts.push(`<div class="callout crit">${ICON.crit}<div>来月の引落 <b>${yen(committed)}</b> が確定していますが、今月の余力は <b>${yen(ms.net)}</b> しかありません。<b>${yen(committed - ms.net)}</b> 不足します。手元の現金を使う前に取り置いてください。</div></div>`);
    } else if (committed > 0) {
      alerts.push(`<div class="callout warn">${ICON.warn}<div>来月の引落として <b>${yen(committed)}</b> が確定しています。今月まだ使ってよいのは <b>${yen(ms.net - committed)}</b> です。</div></div>`);
    }
    if (budget < sumMin) {
      alerts.push(`<div class="callout warn">${ICON.warn}<div>予定している月々の返済額 <b>${yen(budget)}</b> が、最低返済額の合計 <b>${yen(sumMin)}</b> に届いていません。目標画面で返済額を見直してください。</div></div>`);
    }

    root.innerHTML =
      headHTML('ダッシュボード', `現在の残高と返済ペースから、完済までの道のりを計算しています。基準となる月々の返済額は <b class="num">${yen(budget)}</b> です。`) +

      `<div class="roadmap">
         <div class="roadmap-figure">
           <div class="roadmap-label">完済予定</div>
           ${payoffDate
            ? `<div class="hero-figure">${payoffDate}</div>
               <div class="roadmap-sub">あと <b class="num">${durationText(sim.payoffMonths)}</b>・支払う利息 <b class="num">${yen(sim.totalInterest)}</b></div>`
            : `<div class="hero-figure is-muted">計算できません</div>
               <div class="roadmap-sub">今の返済額では残高が減りません。返済額を増やすと予定日が表示されます。</div>`}
         </div>
         <div class="roadmap-chart chart" id="ch-road"></div>
       </div>

       ${alerts.join('')}

       <div class="grid g-4" style="margin-top:16px">
         <div class="tile">
           <span class="tile-label">借入残高の合計</span>
           <span class="tile-value neg">${yen(tb)}</span>
           <span class="tile-delta">元金 ${compact(totalPrincipal())}・未払利息 ${compact(totalInterestDue())}</span>
         </div>
         <div class="tile">
           <span class="tile-label">返済の進捗</span>
           <span class="tile-value">${pct(progress)}</span>
           <div class="meter ${progress >= 60 ? 'is-good' : ''}" style="margin-top:6px"><i style="width:${clamp(progress, 0, 100)}%"></i></div>
         </div>
         <div class="tile">
           <span class="tile-label">今月の収支（返済後）</span>
           <span class="tile-value ${ms.net < 0 ? 'neg' : 'pos'}">${yen(ms.net)}</span>
           <span class="tile-delta">収入 ${compact(ms.income)}・引落 ${compact(ms.expensePaid)}・返済 ${compact(ms.repay)}${ms.borrow > 0 ? `（${compact(ms.repayGross)}−借入${compact(ms.borrow)}）` : ''}${ms.deferred > 0 ? `<br>カードで翌月に回る分 ${compact(ms.deferred)}` : ''}</span>
         </div>
         <div class="tile">
           <span class="tile-label">これから1ヶ月の利息</span>
           <span class="tile-value">${yen(monthInterest)}</span>
           <span class="tile-delta">日割りで ${yen(dayInterest)}/日・最低返済額 ${compact(sumMin)}</span>
         </div>
       </div>

       <div class="grid g-2" style="margin-top:16px">
         <div class="panel">
           <div class="panel-head"><h2>借入先ごとの残高</h2><span class="hint">完済予定順</span></div>
           <div class="panel-body"><div class="chart" id="ch-debts"></div>
             <details class="tableview"><summary>数値で見る</summary><div id="tb-debts"></div></details>
           </div>
         </div>
         <div class="panel">
           <div class="panel-head"><h2>月次の収入・支出・返済</h2><span class="hint">直近6ヶ月</span></div>
           <div class="panel-body"><div class="chart" id="ch-cash"></div>
             <div id="lg-cash"></div>
             <details class="tableview"><summary>数値で見る</summary><div id="tb-cash"></div></details>
           </div>
         </div>
       </div>`;

    // 残高の降下カーブ
    const road = document.getElementById('ch-road');
    const pts = [{ v: tb, label: '現在', full: '現在' }].concat(
      sim.months.map((m, i) => ({
        v: m.balance,
        label: sim.payoffMonths && i === sim.months.length - 1 ? '完済' : (m.m + 'ヶ月'),
        full: fmtMonth(addMonths(new Date(), m.m))
      })));
    mountChart(road, (c, w) => areaChart(c, w, { points: pts, height: 190, bleed: true, label: '残高' }));

    // 借入先ごとの残高（完済予定順）
    const dRows = state.debts.filter(d => d.balance > 0.5)
      .map(d => ({ ...d, off: sim.perDebt[d.id] ? sim.perDebt[d.id].paidOff : null }))
      .sort((a, b) => (a.off ?? 9999) - (b.off ?? 9999))
      .map((d, i) => ({ label: d.name, value: d.balance, sub: '残高', off: d.off, rate: d.rate,
                        prin: d.principal, int: d.interestToday, _i: i }));
    const dc = document.getElementById('ch-debts');
    if (dRows.length) {
      mountChart(dc, (c, w) => barsChart(c, w, { rows: dRows, colorFn: (r) => SERIES(r._i) }));
      document.getElementById('tb-debts').innerHTML = `<div class="table-wrap"><table class="ledger">
        <thead><tr><th>借入先</th><th class="r">元金</th><th class="r">未払利息</th><th class="r">残高</th><th class="r">年利</th><th class="r">完済まで</th></tr></thead>
        <tbody>${dRows.map(r => `<tr>
          <td><span style="display:inline-flex;align-items:center;gap:7px"><i class="swatch" style="background:${SERIES(r._i)}"></i>${esc(r.label)}</span></td>
          <td class="r">${yen(r.prin)}</td>
          <td class="r" style="color:var(--ink-2)">${yen(r.int)}</td>
          <td class="r">${yen(r.value)}</td><td class="r">${r.rate}%</td>
          <td class="r">${r.off ? durationText(r.off) : '—'}</td></tr>`).join('')}</tbody></table></div>`;
    } else {
      dc.innerHTML = '<p style="color:var(--ink-3);font-size:13px">残高のある借入がありません。</p>';
    }

    // 月次収支
    renderCashChart('ch-cash', 'lg-cash', 'tb-cash', 6);
  };

  function renderCashChart(chartId, legendId, tableId, n) {
    const keys = recentMonths(n);
    const sums = keys.map(monthSummary);
    const series = [
      { name: '収入', color: SERIES(0) },
      { name: '生活支出（引落）', color: SERIES(1) },
      { name: '返済（借入を差引）', color: SERIES(2) }
    ];
    // 棒は現金の出入りなので引落ベース。使った月ではなく出ていく月で並べる。
    const groups = sums.map(s => ({
      label: fmtMonthShort(s.key), full: s.key.replace('-', '年') + '月',
      values: [s.income, s.expensePaid, s.repay], net: s.net
    }));
    const c = document.getElementById(chartId);
    if (!sums.some(s => s.income || s.expense || s.repay)) {
      c.innerHTML = '<p style="color:var(--ink-3);font-size:13px;padding:24px 0">収入・支出・返済の記録がまだありません。</p>';
      if (legendId) document.getElementById(legendId).innerHTML = '';
      if (tableId) document.getElementById(tableId).innerHTML = '';
      return;
    }
    mountChart(c, (cc, w) => groupedColumns(cc, w, { groups, series }));
    if (legendId) document.getElementById(legendId).innerHTML = legendHTML(series);
    if (tableId) {
      document.getElementById(tableId).innerHTML = `<div class="table-wrap"><table class="ledger">
        <thead><tr><th>月</th><th class="r">収入</th>
          <th class="r col-memo" title="その月に使った額">使った額</th>
          <th class="r">引落</th><th class="r col-memo">借入</th><th class="r">返済</th><th class="r">差引</th></tr></thead>
        <tbody>${sums.map(s => `<tr><td>${esc(s.key)}</td>
          <td class="r">${yen(s.income)}</td>
          <td class="r col-memo" style="color:var(--ink-3)">${yen(s.expense)}</td>
          <td class="r">${yen(s.expensePaid)}</td>
          <td class="r col-memo" style="color:var(--ink-3)">${s.borrow > 0 ? '+' + yen(s.borrow) : '—'}</td>
          <td class="r ${s.repay < 0 ? 'amt-neg' : ''}">${yen(s.repay)}</td>
          <td class="r ${s.net < 0 ? 'amt-neg' : 'amt-pos'}">${yen(s.net)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>合計</td>
          <td class="r">${yen(sums.reduce((a, s) => a + s.income, 0))}</td>
          <td class="r col-memo" style="color:var(--ink-3)">${yen(sums.reduce((a, s) => a + s.expense, 0))}</td>
          <td class="r">${yen(sums.reduce((a, s) => a + s.expensePaid, 0))}</td>
          <td class="r col-memo" style="color:var(--ink-3)">${yen(sums.reduce((a, s) => a + s.borrow, 0))}</td>
          <td class="r">${yen(sums.reduce((a, s) => a + s.repay, 0))}</td>
          <td class="r">${yen(sums.reduce((a, s) => a + s.net, 0))}</td></tr></tfoot></table></div>`;
    }
  }

  /** 計画上の月々の返済額：目標 > 直近実績の平均 > 最低返済額合計 */
  function plannedBudget() {
    if (state.goals.monthlyRepay > 0) return state.goals.monthlyRepay;
    const keys = recentMonths(3);
    const paid = keys.map(k => monthSummary(k).repay).filter(v => v > 0);
    if (paid.length) return paid.reduce((a, b) => a + b, 0) / paid.length;
    return totalMinPayment();
  }

  /* ---------- 借入・返済 ---------- */
  V.debts = function () {
    const root = document.getElementById('view-debts');
    const sim = simulate(plannedBudget(), PLAN);

    const cards = state.debts.map((d, i) => {
      const int = monthlyInterest(d);
      const init = Math.max(d.initial || 0, d.balance);
      const prog = init > 0 ? ((init - d.balance) / init) * 100 : 100;
      const off = sim.perDebt[d.id] ? sim.perDebt[d.id].paidOff : null;
      const cleared = d.balance <= 0.5;
      const stuck = !cleared && d.minPayment <= int;
      const pill = cleared
        ? `<span class="pill ok">${ICON.ok}完済</span>`
        : stuck ? `<span class="pill crit">${ICON.crit}元金が減りません</span>`
        : off ? `<span class="pill flat">あと ${durationText(off)}</span>`
        : `<span class="pill warn">${ICON.warn}期間内に完済しません</span>`;

      return `<div class="debt-card">
        <div class="debt-top">
          <div>
            <div class="debt-name"><i class="swatch" style="background:${SERIES(i)};width:10px;height:10px"></i>${esc(d.name)}</div>
            <div class="debt-bal ${cleared ? '' : 'amt-neg'}" style="margin-top:2px">${yen(d.balance)}</div>
            <div style="font-size:12px;color:var(--ink-2);margin-top:2px">
              元金 <b>${yen(d.principal)}</b>　＋　未払利息 <b>${yen(d.interestToday)}</b></div>
          </div>
          ${pill}
        </div>
        <div class="meter ${cleared ? 'is-good' : stuck ? 'is-crit' : ''}"><i style="width:${clamp(prog, 0, 100)}%"></i></div>
        <div class="debt-meta">
          <span>年利 <b>${d.rate}%</b></span>
          <span>最低返済 <b>${yen(d.minPayment)}</b></span>
          <span title="元金 ${yen0(d.principal)} × ${d.rate}% ÷ ${DAY_BASIS}日">利息 <b>${yen(interestFor(d.principal, d.rate, 1))}/日</b>・<b>${yen(int)}/月</b></span>
          <span>返済済み <b>${pct(prog)}</b></span>
        </div>
        <div class="debt-actions">
          <button class="btn sm primary" data-act="pay" data-id="${d.id}" ${cleared ? 'disabled' : ''}>返済を記録</button>
          <button class="btn sm" data-act="borrow" data-id="${d.id}">追加で借りた</button>
          <button class="btn sm" data-act="edit-debt" data-id="${d.id}">編集</button>
          <button class="btn sm danger" data-act="del-debt" data-id="${d.id}">削除</button>
        </div>
      </div>`;
    }).join('');

    // 返済と追加借入を1つの時間軸で見せる。残高が動いた理由が一覧で追える。
    const moves = [
      ...state.repayments.map(r => ({ ...r, kind: 'repay' })),
      ...state.borrows.map(b => ({ ...b, kind: 'borrow' }))
    ].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 40);
    const nameOf = id => (rows('debts').find(d => d.id === id) || {}).name || '（削除済み）';
    /** 起点より前の記録は、申告した残高に既に含まれているので計算に入らない。 */
    const historyOnly = r => {
      const d = rows('debts').find(x => x.id === r.debtId);
      return !!(d && d.originDate && r.date < d.originDate);
    };

    root.innerHTML =
      headHTML('借入・返済', '借入ごとに<b>元金</b>と<b>未払利息</b>を登録すると、以降の利息は<b>日割り</b>（年利 ÷ 365 × 経過日数）で自動計算されます。返済を記録すると、返済額はまず利息に充当され、残った分が元金から引かれます。') +
      `<div class="toolbar">
         <button class="btn primary" data-act="add-debt">${ICON.plus}借入を追加</button>
         <div class="spacer"></div>
         <span style="font-size:12.5px;color:var(--ink-2)">残高合計 <b class="num" style="color:var(--ink)">${yen(totalBalance())}</b>（元金 ${yen(totalPrincipal())}＋未払利息 ${yen(totalInterestDue())}）　最低返済額 <b class="num" style="color:var(--ink)">${yen(totalMinPayment())}/月</b></span>
       </div>` +
      (state.debts.length
        ? `<div class="grid g-2">${cards}</div>`
        : `<div class="empty"><h3>借入がありません</h3><p>「借入を追加」から、借入先・元金・未払利息・年利・毎月の最低返済額を登録してください。</p>
             <button class="btn primary" data-act="add-debt">${ICON.plus}借入を追加</button></div>`) +

      `<div class="panel" style="margin-top:16px">
         <div class="panel-head"><h2>返済・追加借入の記録</h2><span class="hint">直近40件</span></div>
         <div class="panel-body">
           ${moves.length ? `<div class="table-wrap"><table class="ledger">
             <thead><tr><th>日付</th><th>区分</th><th>借入先</th><th class="r">金額</th><th class="r">うち利息</th><th class="r">うち元金</th><th class="col-memo">メモ</th><th></th></tr></thead>
             <tbody>${moves.map(r => `<tr>
               <td class="r" style="text-align:left">${esc(r.date)}</td>
               <td>${r.kind === 'borrow'
                 ? '<span class="pill crit">借入</span>'
                 : '<span class="pill flat">返済</span>'}${historyOnly(r)
                 ? '<br><span class="pill warn" title="起算日より前なので、残高の計算には入りません">履歴のみ</span>' : ''}</td>
               <td>${esc(nameOf(r.debtId))}</td>
               <td class="r ${r.kind === 'borrow' ? 'amt-neg' : ''}">${r.kind === 'borrow' ? '+' : ''}${yen(r.amount)}</td>
               <td class="r" style="color:var(--ink-2)">${r.kind === 'borrow' || historyOnly(r) ? '—' : yen(r.interest)}</td>
               <td class="r">${r.kind === 'borrow' || historyOnly(r) ? '—' : yen(r.principal)}</td>
               <td class="col-memo" style="color:var(--ink-2)">${esc(r.memo || '')}</td>
               <td class="r"><button class="btn sm danger" data-act="${r.kind === 'borrow' ? 'del-borrow' : 'del-rep'}" data-id="${r.id}">取消</button></td>
             </tr>`).join('')}</tbody></table></div>`
             : `<p style="color:var(--ink-3);font-size:13px">まだ記録がありません。借入カードの「返済を記録」「追加で借りた」から登録してください。</p>`}
         </div>
       </div>`;
  };

  /* ---------- 収入・支出 ---------- */
  let cashMonth = thisMonth();

      .sort((a, b) => b.date.localeCompare(a.date));
    const cats = expenseByCategory(cashMonth);
    const repRows = state.repayments.filter(r => monthKey(r.date) === cashMonth);
    const carried = carriedInto(cashMonth);
    const nextKey = addMonthKey(cashMonth, 1);
    const nextS = monthSummary(nextKey);
    const committed = committedNext(cashMonth);
    const out = s.out;
    const nextOut = nextS.out;

    root.innerHTML =
      headHTML('収入・支出', '毎月の手取り収入と生活支出を記録します。返済は別集計なので二重に数えられません。カード払いは<b>口座から出ていく月</b>で数えるので、<b>収入 − 引落 − 返済 = 返済に回せる余力</b>が実態どおりになります。') +
      `<div class="toolbar">
         <button class="btn primary" data-act="add-income">${ICON.plus}収入を追加</button>

         この月に使った <b>${yen(s.expense)}</b> のうち <b>${yen(s.deferred)}</b> はカード払いで、
         口座から出ていくのは翌月以降です。
         <b>${nextKey.replace('-', '年')}月の引落予定は ${yen(nextS.expensePaid)}</b>（うちこの月の利用が ${yen(s.deferred)}）。
       </div></div>` : ''}

       <div class="grid g-2" style="margin-top:16px">

         <div class="panel">
           <div class="panel-head"><h2>収支の推移</h2><span class="hint">直近12ヶ月</span></div>

       <div class="panel" style="margin-top:16px">
         <div class="panel-head"><h2>カードの引落</h2>
           <span class="hint">${esc(cashMonth)} に口座から出る分</span></div>
         <div class="panel-body">
           ${state.cards.length ? `<div class="table-wrap"><table class="ledger">
             <thead><tr><th>カード</th><th class="r">引落額</th><th>出どころ</th><th></th></tr></thead>

               <td>${esc(r.name)}</td>
               <td class="r">${yen(r.amount)}</td>
               <td>${r.billed
                 ? '<span class="pill ok">請求額を登録済み</span>'

               </td></tr>`).join('')}</tbody>
             ${out.orphan > 0 ? `<tfoot><tr><td>（削除したカードの明細）</td>
               <td class="r">${yen(out.orphan)}</td><td colspan="2"></td></tr></tfoot>` : ''}
           </table></div>`
           : `<p style="color:var(--ink-3);font-size:13px">カードを登録すると、請求額を月ごとに入れられます。明細を1件ずつ入れなくても取り置きが正しくなります。</p>`}
           <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">

           ${state.cards.length && nextOut.card > 0 ? `
             <div class="calc-note" style="margin-top:12px">
               <div><b>翌月（${nextKey.replace('-', '年')}月）の引落は ${yen(nextOut.card)}</b></div>
               ${nextOut.rows.filter(r => r.amount > 0).map(r =>
                 `<div style="color:var(--ink-2)">${esc(r.name)} ${yen(r.amount)}${r.billed ? '' : '（明細から推定）'}</div>`).join('')}
               <div style="color:var(--ink-3);margin-top:4px">対象月を ${nextKey.replace('-', '年')}月 に切り替えると、その月の請求額を登録できます。</div>

       <div class="panel" style="margin-top:16px">

             <thead><tr><th>日付</th><th>区分</th><th>カテゴリ</th><th class="r">金額</th><th class="col-memo">メモ</th><th></th></tr></thead>
             <tbody>${rows.map(t => `<tr>

                 ? '<span class="pill ok">収入</span>'

                   ? `<span class="pill warn" title="${esc(payMonthOf(t))} に口座から出ていきます">${esc(cardName(t.cardId) || 'カード')}</span>`
                   : '<span class="pill flat">支出</span>'}</td>
               <td>${esc(t.category)}</td>
               <td class="r ${t.type === 'income' ? 'amt-pos' : ''}">${t.type === 'income' ? '+' : '−'}${yen0(t.amount)}</td>
               <td class="col-memo" style="color:var(--ink-2)">${esc(t.memo || '')}</td>

  /* ---------- 目標 ---------- */
  V.goals = function () {

      if (tm <= 0) {
        targetBlock = `<div class="callout warn">${ICON.warn}<div>目標日が過去または今月です。将来の日付を設定してください。</div></div>`;

    const hold = committedNext(thisMonth());
    const plan = fixedPlan(g.monthlyRepay || 0);
    const mp = monthProgress();
    const mgoal = g.monthlyRepay || 0;
    const mprog = mgoal > 0 ? (mrepay / mgoal) * 100 : 0;

    // 生活防衛資金
    const ef = g.emergency || 0, efc = g.emergencyCurrent || 0;
    const efprog = ef > 0 ? (efc / ef) * 100 : 0;

    root.innerHTML =
      headHTML('目標', '完済したい時期と、毎月の返済額の目標を決めます。目標から逆算した必要額と、いまの家計の余力を突き合わせて過不足を判定します。') +

       <div class="panel" style="margin-top:16px">

         <div class="panel-body">
           ${!plan.has

                    <span class="tile-value pos">${yen(plan.income)}</span></div>
                  <div class="tile"><span class="tile-label">固定の支出</span>
                    <span class="tile-value">${yen(plan.expense)}</span>
                    <span class="tile-delta">生活にかかる分</span></div>
                  <div class="tile"><span class="tile-label">毎月の返済</span>
                    <span class="tile-value">${yen(plan.repay)}</span>

                       毎月 <b>${yen(plan.repay)}</b> を返すには <b>${yen(plan.need)}</b> 足りません。次のどちらか、または組み合わせで埋めます。</div></div>
                     <div class="grid g-2" style="gap:14px;margin-top:13px">
                       <div class="tile"><span class="tile-label">副業などで稼ぐ</span>
                         <span class="tile-value">${yen(plan.need)}</span>

                       <div class="tile"><span class="tile-label">固定支出を減らす</span>
                         <span class="tile-value">${yen(plan.need)}</span>
                         <span class="tile-delta">いまの固定支出の ${pct(plan.expense > 0 ? plan.need / plan.expense * 100 : 0)}</span></div>
                     </div>`}`}

           ${(rows('fixed').length || plan.repay > 0) ? `<div class="table-wrap" style="margin-top:14px"><table class="ledger">
